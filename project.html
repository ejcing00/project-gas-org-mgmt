<style>
.sec[data-sec-tabs] .sec-body.fill { min-height: 0; } /* 안전장치 */

.sec[data-sec-tabs] .sec-panel.is-active{
  /* meta에서 이미 flex-column + flex:1 이지만, 패널 내부 아이템 계산 안정화 */
  min-height: 0;
}

.sec[data-sec-tabs] .sec-panel.is-active > .wrap-sum{
  flex: 0 0 auto;      /* ✅ 요약은 늘어나지 않음 */
  min-height: auto;
  overflow: visible;   /* 요약이 잘리지 않게 (원하면 hidden/auto로 변경) */
}

.sec[data-sec-tabs] .sec-panel.is-active > .wrap-tbl{
  flex: 1 1 auto;      /* ✅ 테이블이 남은 공간 전부 차지 */
  min-height: 0;       /* ✅ scroll 영역이 제대로 계산되게 */
}

/* 일부 탭에서 wrap-tbl에 mb-2가 있어 남는 높이 계산이 흔들리면 제거 */
.sec[data-sec-tabs] .sec-panel.is-active > .wrap-tbl.mb-2{
  margin-bottom: 0 !important;
}

/* 참여인력 탭: 테이블 2개를 세로로 정확히 5:5 분할 */
[data-panel="project-member-list"] .pjt-member-split-v{
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  flex: 1 1 auto;
  min-height: 0;    /* ✅ 아래 wrap들이 남은 높이를 정확히 나눠 갖게 */
}

/* 두 테이블 래퍼를 정확히 반반 */
[data-panel="project-member-list"] .pjt-member-split-v > .wrap.wrap-tbl{
  flex: 1 1 0;      /* ✅ 1:1 = 5:5 */
  min-height: 0;    /* ✅ 내부 scroll-xy 계산 안정화 */
}

</style>

<script>
/** =========================
 * Project Detail Modal - Front 연결
 * - data-field 기반 payload 수집
 * - 실제 GAS 연결 전제(모킹 제거)
 * ========================= */

(function(){

  // ===== 유틸: 값 읽기 =====
  function _trim_(v){ return String(v == null ? '' : v).trim(); }

  function _readFieldValue_(el){
    if (!el) return '';

    var tag = (el.tagName || '').toLowerCase();

    // 1) 원본 값 읽기
    var v = '';
    if (tag === 'input'){
      var type = (el.type || 'text').toLowerCase();
      if (type === 'checkbox') return !!el.checked;
      v = el.value;
    } else if (tag === 'select' || tag === 'textarea'){
      v = el.value;
    } else {
      v = el.textContent; // div.text-tbl 등
    }

    v = String(v == null ? '' : v).trim();

    // ✅ input-date는 DB에 "YYYY-MM-DD"만 저장 (요일 제거)
    if (tag === 'input' && el.classList && el.classList.contains('input-date')) {
      // 1) "YYYY-MM-DD ..." 형태면 앞 10글자만
      var m = v.match(/^(\d{4}-\d{2}-\d{2})/);
      if (m) return m[1];

      // 2) 혹시 DB/입력값이 "20250101" 같은 8자리면 YYYY-MM-DD로 변환
      var digits = v.replace(/\D/g, '').slice(0, 8);
      if (digits.length === 8) {
        return digits.slice(0,4) + '-' + digits.slice(4,6) + '-' + digits.slice(6,8);
      }
      return '';
    }

    // 2) 단위/숫자 필드 판별
    // - input-unit / text-unit
    // - 또는 data-unit 속성이 있으면 “단위 붙는 숫자표현”으로 간주
    var isUnitNumber =
      (el.classList && (el.classList.contains('input-unit') || el.classList.contains('text-unit'))) ||
      (el.dataset && el.dataset.unit);

    // 3) 숫자 필드면: 콤마/공백 + 단위문자 제거 → 숫자/-,.만 남김
    if (isUnitNumber){
      // 예: "1,234,000원" -> "1234000"
      v = v.replace(/[,\s]/g, '');
      v = v.replace(/[^\d.\-]/g, ''); // 숫자, 점, 음수기호만 유지
      v = v.trim();
    }

    return v;
  }

  function _isEmptyValue_(v){
    return v == null || String(v).trim() === '';
  }

/* =========================
 * ✅ 상단 타이틀(year + business_name) 실시간 바인딩 (UI 전용)
 * - 표시 형식: "0000년 가나다라"
 * - 백엔드 저장/payload에는 영향 없음
 * ========================= */

function _pjtMakeLiveTitle_(year, name){
  year = String(year == null ? '' : year).trim();
  name = String(name == null ? '' : name).trim();

  if (year && name) return year + ' ' + name;
  if (year) return year;
  if (name) return name;
  return '';
}

function _pjtUpdateLiveTitle_(modalEl, bodyHost){
  if (!bodyHost) return;

  var root = bodyHost.querySelector('.pjt-modal-root[data-entity="Project"]') || bodyHost.querySelector('.pjt-modal-root');
  if (!root) return;

  var yearEl = root.querySelector('[data-field="year"]');
  var nameEl = root.querySelector('[data-field="business_name"]');

  // input/select는 value, div/text는 textContent일 수 있어서 둘 다 처리
  var year = yearEl ? (yearEl.value != null ? yearEl.value : yearEl.textContent) : '';
  var name = nameEl ? (nameEl.value != null ? nameEl.value : nameEl.textContent) : '';

  var title = _pjtMakeLiveTitle_(year, name);

  // 1) 템플릿(모달 body 상단) 타이틀
  var pageTitleEl = bodyHost.querySelector('[data-role="pjt-page-title"]');
  if (pageTitleEl) pageTitleEl.textContent = title;

  // 2) (선택) 모달 헤더 타이틀까지 같이 바꾸고 싶으면 아래 주석 해제
  // var modalTitleEl = modalEl && modalEl.querySelector ? modalEl.querySelector('[data-role="page-modal-title"]') : null;
  // if (modalTitleEl) modalTitleEl.textContent = title;
}

function _pjtBindLiveTitle_(modalEl, bodyHost){
  if (!modalEl || !bodyHost) return;

  // 중복 바인딩 방지
  if (bodyHost.__pjtLiveTitleBound) return;
  bodyHost.__pjtLiveTitleBound = true;

  // 초기 1회 반영(조회/신규 모두)
  _pjtUpdateLiveTitle_(modalEl, bodyHost);

  // bodyHost 범위 이벤트 위임(모달 내부에서만)
  function onChanged(e){
    var t = e.target;
    if (!t) return;
    var f = t.getAttribute && t.getAttribute('data-field');
    if (f === 'year' || f === 'business_name'){
      _pjtUpdateLiveTitle_(modalEl, bodyHost);
    }
  }

  bodyHost.addEventListener('input', onChanged, true);
  bodyHost.addEventListener('change', onChanged, true);
}


/*input-unit 포맷터 공통 유틸*/
function _applyUnitFormat_(el){
  if (!el) return;

  // ✅ 바인딩이 안된 상태(모달에서 새로 생성된 input-unit) 대비
  if (typeof initUnitInputs === 'function') {
    initUnitInputs(el.closest('.pjt-modal-root') || document);
  }

  // ✅ 단위 포함 "표시용" 포맷 강제
  if (typeof applyUnitDisplay === 'function') {
    applyUnitDisplay(el);
  } else {
    // fallback (혹시 전역이 없을 때)
    var wasDisabled = el.disabled;
    if (wasDisabled) el.disabled = false;
    el.dispatchEvent(new Event('input', { bubbles:true }));
    el.dispatchEvent(new Event('blur')); // blur 리스너가 단위를 붙임
    if (wasDisabled) el.disabled = true;
  }

  // 라벨 동기화 필요하면(선택)
  if (typeof refreshFloatingInputs === 'function') {
    refreshFloatingInputs(el.closest('.inputgroup1, .inputgroup2') || el);
  }
}

/* =========================
 * 프로젝트 기간 자동 계산 (start_date/end_date → period)
 * - period는 표시용: "N개월"
 * - 날짜가 없으면 period는 공란
 * ========================= */
// ===== 날짜 파서 (YYYY-MM-DD ... 형태 대응) =====
function _parseYMD_(s){
  s = String(s || '').trim();
  var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (!m) return null;
  var y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  if (!y || !mo || !d) return null;
  var dt = new Date(y, mo - 1, d);
  // 유효성 체크(예: 2025-02-30 방지)
  if (dt.getFullYear() !== y || dt.getMonth() !== (mo - 1) || dt.getDate() !== d) return null;
  return dt;
}

// 월 더하기(말일 보정)
function _addMonthsClamped_(dt, addMonths){
  var y = dt.getFullYear();
  var m = dt.getMonth() + addMonths;
  var d = dt.getDate();
  var lastDay = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(d, lastDay));
}

// 날짜 차이(포함) - 시작일을 1일로 카운트
function _diffDaysInclusive_(a, b){
  var au = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  var bu = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  var days = Math.floor((bu - au) / 86400000) + 1; // 포함
  return days < 0 ? 0 : days;
}

// 2자리 패딩(00, 01, 15...)
function _pad2_(n){
  n = Number(n || 0);
  if (n < 0) n = 0;
  return (n < 10) ? ('0' + n) : String(n);
}

function _lastDayOfMonth_(dt){
  return new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
}
function _isEndOfMonth_(dt){
  return dt.getDate() === _lastDayOfMonth_(dt);
}
function _addDays_(dt, days){
  return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + days);
}

/**
 * 기간 계산: "완전한 개월 + 남은 일"
 * - “한 달을 꽉 채운 경우”를 1개월로 처리
 *   예) 2025-01-01~2025-01-31 => 1개월
 *       2025-01-15~2025-02-14 => 1개월
 * - 시작일 포함(1일로 카운트)
 * - 달은 실제 달력 일수 기준
 * - 시작일이 말일(EOM)이면: 1개월 종료를 다음달 말일까지로 인정(말일 정합)
 */
function _diffMonthsAndDays_(startDt, endDt){
  if (!startDt || !endDt) return null;
  if (endDt < startDt) return null;

  var startIsEOM = _isEndOfMonth_(startDt);

  function monthEndForCount(m){
    if (m <= 0) return _addDays_(startDt, -1); // 0개월의 "끝"은 시작일 전날(항상 참)
    var anchor = _addMonthsClamped_(startDt, m); // start + m개월(말일 보정)
    // 일반: anchor 전날까지가 m개월을 "꽉 채운" 종료일
    // 시작일이 말일: anchor 당일까지를 m개월 종료일로 인정(예: 1/31~2/28 => 1개월)
    return startIsEOM ? anchor : _addDays_(anchor, -1);
  }

  // 최대 개월수 상한
  var sy = startDt.getFullYear(), sm = startDt.getMonth();
  var ey = endDt.getFullYear(),   em = endDt.getMonth();
  var maxGuess = (ey - sy) * 12 + (em - sm) + 2;
  if (maxGuess < 0) maxGuess = 0;

  // 이분 탐색: endDt가 m개월 “종료일” 이상이면 m개월 성립
  var lo = 0, hi = maxGuess;
  while (lo < hi){
    var mid = Math.ceil((lo + hi) / 2);
    var mend = monthEndForCount(mid);
    if (endDt >= mend) lo = mid;
    else hi = mid - 1;
  }
  var months = lo;

  // months개월을 채운 종료일
  var periodEnd = monthEndForCount(months);
  var remainderStart = _addDays_(periodEnd, 1); // 다음날부터가 잔여일 시작

  var days = 0;
  if (months === 0){
    days = _diffDaysInclusive_(startDt, endDt); // 시작일 포함
  } else {
    if (endDt >= remainderStart) days = _diffDaysInclusive_(remainderStart, endDt);
    else days = 0;
  }

  return { months: months, days: days };
}

// ===== 프로젝트 기간 재계산 =====
function recalcProjectPeriod_(root){
  if (!root) return;

  var startEl = _findProjectFieldEl_(root, 'start_date');
  var endEl   = _findProjectFieldEl_(root, 'end_date');
  var perEl   = _findProjectFieldEl_(root, 'period');
  if (!startEl || !endEl || !perEl) return;

  var sdt = _parseYMD_(startEl.value);
  var edt = _parseYMD_(endEl.value);

  // 날짜가 없으면 공란
  if (!sdt || !edt || edt < sdt){
    _setProjectField_(root, 'period', '');
    return;
  }

  var r = _diffMonthsAndDays_(sdt, edt);
  if (!r) { _setProjectField_(root, 'period', ''); return; }

  function _formatPeriodLabel_(m, d){
    m = Number(m || 0);
    d = Number(d || 0);

    // ✅ 0개월 01일 => "1일"
    if (m <= 0) return (d > 0) ? (d + '일') : '';

    // ✅ 1개월 00일 => "1개월"
    if (d <= 0) return (m + '개월');

    // 개월+일 같이 표기할 때만 2자리(원하면 여기서 패딩 제거 가능)
    return m + '개월 ' + d + '일';
  }

var label = _formatPeriodLabel_(r.months, r.days);
_setProjectField_(root, 'period', label);

  if (typeof refreshFloatingInputs === 'function') {
    refreshFloatingInputs(perEl.closest('.inputgroup1, .inputgroup2') || perEl);
  }
}

/* =========================

  * ========================= */

  // 숫자 파싱(콤마/문자 제거)
  function _num_(v){
    var n = parseFloat(String(v || '').replace(/[^\d.-]/g, ''));
    return isNaN(n) ? 0 : n;
  }

  // "테이블 밖"의 Project 필드 찾기 (같은 data-field가 테이블에도 있어서 구분 필요)
  function _findProjectFieldEl_(root, field){
    if (!root) return null;
    var list = root.querySelectorAll('[data-field="' + field + '"]');
    for (var i = 0; i < list.length; i++){
      var el = list[i];
      if (!el.closest('table[data-entity]')) return el; // 테이블 내부 제외
    }

  }

      el.value = (value == null ? '' : String(value));

      // ✅ 여기!
      if (el.classList.contains('input-unit') || (el.dataset && el.dataset.unit)) {
        _applyUnitFormat_(el);
      }

      el.textContent = (value == null ? '' : String(value));
    }

  function recalcBudgetFromFinance_(root){
    if (!root) return;

    var tbl = root.querySelector('table[data-entity="Project_Finance"]');
    if (!tbl) return;

    // ✅ 금액이 실제로 입력된 행이 있는지 체크
    var hasAnyAmount = false;

    var sum = { grant:0, cash:0, spot:0, charge_cash:0, charge_spot:0, etc:0, total:0 };

    // 숫자 문자열(digits)만 남기기
    function _digits_(v){
      return String(v || '').replace(/[^\d]/g, '').trim();
    }

    var trs = tbl.querySelectorAll('tbody tr');
    trs.forEach(function(tr){
      var catEl = tr.querySelector('[data-field="budget_category"]');
      var amtEl = tr.querySelector('[data-field="budget_amount"]');

      var cat = catEl ? _trim_(catEl.value) : '';
      var rawAmt = amtEl ? amtEl.value : '';
      var digits = _digits_(rawAmt);

      // ✅ 금액이 비어있으면 계산대상 아님 (카테고리만 선택해도 무시)
      if (!digits) return;

      hasAnyAmount = true;

      var amt = parseFloat(digits); // 예산금액은 음수 없다고 보고 단순 처리
      if (isNaN(amt)) amt = 0;

      sum.total += amt;

      if (cat === '보조금') sum.grant += amt;
      else if (cat === '대응자금(현금)') sum.cash += amt;
      else if (cat === '대응자금(현물)') sum.spot += amt;
      else if (cat === '기업부담금(현금)') sum.charge_cash += amt;
      else if (cat === '기업부담금(현물)') sum.charge_spot += amt;
      else if (cat === '기타자금') sum.etc += amt;
      else sum.etc += amt; // 혹시 모를 예외 카테고리는 기타로 처리
    });

    // ✅ 금액 입력이 0건이면: 합계 필드 비우기(0원 표시 X)
    if (!hasAnyAmount){
      _setProjectField_(root, 'budget_grant', '');
      _setProjectField_(root, 'budget_match_cash', '');
      _setProjectField_(root, 'budget_match_spot', '');
      _setProjectField_(root, 'budget_total_grant_match', '');
      _setProjectField_(root, 'budget_charge_cash', '');
      _setProjectField_(root, 'budget_charge_spot', '');
      _setProjectField_(root, 'budget_etc', '');
      _setProjectField_(root, 'budget_total', '');
      return;
    }

    // ✅ 금액 입력이 1건이라도 있으면: 계산값 표시
    _setProjectField_(root, 'budget_grant', sum.grant);
    _setProjectField_(root, 'budget_match_cash', sum.cash);
    _setProjectField_(root, 'budget_match_spot', sum.spot);
    _setProjectField_(root, 'budget_total_grant_match', (sum.grant + sum.cash + sum.spot));
    _setProjectField_(root, 'budget_charge_cash', sum.charge_cash);
    _setProjectField_(root, 'budget_charge_spot', sum.charge_spot);
    _setProjectField_(root, 'budget_etc', sum.etc);
    _setProjectField_(root, 'budget_total', sum.total);
  }


  // 1) 입력 변경 시 자동 재계산 (행 추가/삭제에도 대응되게 이벤트 위임)
  if (!window.__pjtFinanceBudgetBound){
    window.__pjtFinanceBudgetBound = true;

    document.addEventListener('input', function(e){
      var t = e.target;
      if (!t) return;

      var root = t.closest('.pjt-modal-root');
      if (!root) return;

      var inFinance = t.closest('table[data-entity="Project_Finance"]');
      if (!inFinance) return;

      var f = t.getAttribute('data-field');
      if (f === 'budget_amount' || f === 'budget_category'){
        recalcBudgetFromFinance_(root);
      }
    }, true);

    document.addEventListener('change', function(e){
      var t = e.target;
      if (!t) return;

      var root = t.closest('.pjt-modal-root');
      if (!root) return;

      var inFinance = t.closest('table[data-entity="Project_Finance"]');
      if (!inFinance) return;

      var f = t.getAttribute('data-field');
      if (f === 'budget_amount' || f === 'budget_category'){
        recalcBudgetFromFinance_(root);
      }
    }, true);

    // 2) 행 추가/삭제 버튼 클릭 후에도 재계산 (DOM 변경 반영 위해 setTimeout)
    document.addEventListener('click', function(e){
      var btn = e.target && e.target.closest && e.target.closest('[data-tbl-action]');
      if (!btn) return;

      var root = btn.closest('.pjt-modal-root');
      if (!root) return;

      // 같은 sec 안에 Finance 테이블이 있을 때만
      var sec = btn.closest('.sec');
      if (!sec) return;
      if (!sec.querySelector('table[data-entity="Project_Finance"]')) return;

      setTimeout(function(){
        recalcBudgetFromFinance_(root);
      }, 0);
    }, true);

    // 3) 모달이 열릴 때(삽입될 때) 초기 1회 계산
    var mo = new MutationObserver(function(muts){
      muts.forEach(function(m){
        (m.addedNodes || []).forEach(function(n){
          if (!(n instanceof Element)) return;
          var root = n.matches('.pjt-modal-root') ? n : n.querySelector('.pjt-modal-root');
          if (!root) return;
          setTimeout(function(){ recalcBudgetFromFinance_(root); }, 0);
        });
      });
    });
    mo.observe(document.body, { childList:true, subtree:true });
  }

/* =========================
 * 창업성과(Project_Opi) 합계 실시간 계산
 * - 총지원수, 총매출, 총고용
 * - 지재권(국내출원/국내등록/PCT/해외출원/해외등록) 합계
 * - 값이 전부 비어있으면 합계도 "빈값"으로 둠(0 표시 안 함)
 * ========================= */

// 숫자 파싱(콤마/단위/문자 제거) -> number
function _num_(v){
  var n = parseFloat(String(v || '').replace(/[^\d.-]/g, ''));
  return isNaN(n) ? 0 : n;
}

// "값이 입력됐는지" 판단(숫자 0도 입력으로 간주하고 싶으면 정책에 맞게 바꿔도 됨)
function _hasAnyDigit_(v){
  return /\d/.test(String(v || ''));
}

// text-unit(div)도 meta의 formatUnitText로 "콤마+단위" 표시
function _setTextUnit_(el, value){
  if (!el) return;

  // 빈값 처리
  if (value == null || value === '') {
    el.textContent = '';
    return;
  }

  var unit = (el.dataset && el.dataset.unit) ? el.dataset.unit : '';
  // meta.html에 formatUnitText가 이미 전역으로 있음
  if (typeof formatUnitText === 'function') {
    el.textContent = formatUnitText(String(value), unit, true);
  } else {
    // fallback (unit만 붙임)
    el.textContent = String(value) + (unit || '');
  }
}

function _getRowFieldEl_(tr, field){
  return tr ? tr.querySelector('[data-field="' + field + '"]') : null;
}

function _getRowFieldValue_(tr, field){
  var el = _getRowFieldEl_(tr, field);
  if (!el) return '';
  // 너가 이미 만들어둔 값읽기(단위/콤마 제거 포함)
  return _readFieldValue_(el);
}

function _setRowField_(tr, field, value){
  var el = _getRowFieldEl_(tr, field);
  if (!el) return;

  var tag = (el.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') {
    el.value = (value == null ? '' : String(value));
    // input-unit이면 포맷 반영
    if ((el.classList && el.classList.contains('input-unit')) || (el.dataset && el.dataset.unit)) {
      if (typeof applyUnitDisplay === 'function') {
        applyUnitDisplay(el); // disabled여도 표시용 포맷 적용됨
      } else {
        // fallback: 이벤트로라도 한 번 굴리기(네가 만든 _applyUnitFormat_ 있으면 그걸 써도 됨)
        el.dispatchEvent(new Event('blur', { bubbles:true }));
      }
    }
  } else {
    // div.text-unit 같은 경우
    if ((el.classList && el.classList.contains('text-unit')) || (el.dataset && el.dataset.unit)) {
      _setTextUnit_(el, value);
    } else {
      el.textContent = (value == null ? '' : String(value));
    }
  }
}

/* =========================
 * 참여인력 상태(UI 전용)
 * - Project_Member_Ex / Project_Member_In
 * - 규칙: 오늘 <= 종료일  → 참여중
 *         오늘 >  종료일  → 참여종료
 * - 시작일이 있고 오늘 < 시작일이면(옵션) → 참여예정
 * - DB 저장(payload)에는 status 포함하지 않도록 별도 처리(아래 2번)
 * ========================= */

function _ymdToInt_(s){
  s = String(s || '').trim();
  if (!s) return null;
  // 공백 제거(예: '2025. 01. 01')
  s = s.replace(/\s+/g,'');
  // 허용: YYYY-MM-DD, YYYY.MM.DD, YYYY/MM/DD, YYYYMMDD, 'YYYY-MM-DD(수)', 'YYYY-MM-DD00:00:00'
  var m = s.match(/^(\d{4})[.\-\/]?(\d{1,2})[.\-\/]?(\d{1,2})/);
  if (!m) return null;
  var y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  if (!(y >= 1000 && y <= 9999)) return null;
  if (mo < 1 || mo > 12) return null;
  if (d < 1 || d > 31) return null;
  return (y * 10000) + (mo * 100) + d;
}
function _todayInt_(){
  var d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

function _calcMemberStatus_(startStr, endStr){
  var t = _todayInt_();
  var s = _ymdToInt_(startStr);
  var e = _ymdToInt_(endStr);

  // 날짜가 하나도 없으면 표시 안 함(빈 행/미입력)
  if (s == null && e == null) return '';

  // ✅ 옵션: 시작일이 있고 아직 시작 전이면 "참여예정"
  if (s != null && t < s) return '참여예정';

  // 종료일이 없으면 진행중으로 간주
  if (e == null) return '참여중';

  return (t <= e) ? '참여중' : '참여종료';
}

// ✅ 목록(탭)에서도 동일 로직을 쓰기 위해 전역으로 노출
// - 상세(모달) IIFE 밖(목록 렌더링 스크립트)에서도 접근 가능
// - 콘솔 디버깅에서도 바로 호출 가능
if (typeof window !== 'undefined') {
  window._ymdToInt_ = window._ymdToInt_ || _ymdToInt_;
  window._todayInt_ = window._todayInt_ || _todayInt_;
  window._calcMemberStatus_ = window._calcMemberStatus_ || _calcMemberStatus_;
}


function _updateMemberStatusRow_(tr){
  if (!tr) return;

  var startEl  = tr.querySelector('[data-field="start_date"]');
  var endEl    = tr.querySelector('[data-field="end_date"]');
  var statusEl = tr.querySelector('[data-field="status"]');
  if (!statusEl) return;

  var startStr = startEl ? String(startEl.value || '').trim() : '';
  var endStr   = endEl ? String(endEl.value || '').trim() : '';

  var status = _calcMemberStatus_(startStr, endStr);
  var tag = (statusEl.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') statusEl.value = status;
  else statusEl.textContent = status;

  // (선택) 상태별 클래스 부여하고 싶으면:
  // statusEl.classList.toggle('is-ended', status === '참여종료');
  // statusEl.classList.toggle('is-active', status === '참여중');
  // statusEl.classList.toggle('is-soon', status === '참여예정');
}

function _updateMemberStatusInRoot_(root){

    tbl.querySelectorAll('tbody tr').forEach(function(tr){

  // ===== Project(상단 폼) 수집 =====
  function collectProject_(bodyHost){
    var root = bodyHost.querySelector('.pjt-modal-root[data-entity="Project"]');
    if (!root) return {};

    var PJT_META_SKIP = { created_at:1, created_by:1, updated_at:1, updated_by:1 };

    var obj = {};
    var fields = root.querySelectorAll('[data-field]');

    fields.forEach(function(el){
      // 테이블 내부 필드는 Project 본체 수집에서 제외
      if (el.closest('table[data-entity]')) return;

      // UI 전용 필드 제외
      if (el.dataset && el.dataset.nosave === '1') return;

      var key = el.getAttribute('data-field');
      if (!key || PJT_META_SKIP[key]) return;

      obj[key] = _readFieldValue_(el);
    });

    return obj;
  }

  // ===== 테이블 수집(엔티티별 rows) =====
  function collectTableEntity_(tableEl){
    var entity = tableEl.getAttribute('data-entity');
    var PJT_META_SKIP = { created_at:1, created_by:1, updated_at:1, updated_by:1 };
    var rows = [];
    var trList = tableEl.querySelectorAll('tbody tr');

    trList.forEach(function(tr){
      var rowObj = {};
      var hasMeaning = false;

      var cols = tr.querySelectorAll('[data-field]');
      cols.forEach(function(el){
        if (el.dataset.nosave === '1') return;

        var key = el.getAttribute('data-field');
        if (!key) return;
        if (PJT_META_SKIP[key]) return;

        // UI 전용 필드 제외
        if ((entity === 'Project_Member_Ex' || entity === 'Project_Member_In') && key === 'status') return;

        var v = _readFieldValue_(el);
        rowObj[key] = v;

        // ✅ project_id / *_id 제외하고 값 있으면 의미있는 행
        if (!_isEmptyValue_(v) && key !== 'project_id' && key.indexOf('_id') === -1) {
          hasMeaning = true;
        }
        // 체크박스 true도 의미있는 값
        if (v === true) hasMeaning = true;
      });

      // ✅ 여기 추가: 빈 행은 제외
      if (!hasMeaning) return;

      rows.push(rowObj);
    });

    return { entity: entity, rows: rows };
  }

  function collectAllTables_(bodyHost){
    var map = {}; // { Project_Finance: [...], ... }
    var tables = bodyHost.querySelectorAll('table.tbl[data-entity]');
    tables.forEach(function(tbl){
      var res = collectTableEntity_(tbl);
      map[res.entity] = res.rows;

  function _normalizeDateTimeInputs_(scope){
    // input-date는 "YYYY-MM-DD 요" 포맷을 붙이므로 blur 한번 태워서 정리
    (scope || document).querySelectorAll('input.input-date').forEach(function(el){
      if (!el.value) return;
      try { el.dispatchEvent(new Event('blur')); } catch(e){}
    });

    // input-time도 blur로 HH:MM 정리
    (scope || document).querySelectorAll('input.input-time').forEach(function(el){
      if (!el.value) return;

  function _fillTable_(bodyHost, entity, rows){
    var table = bodyHost.querySelector('table.tbl[data-entity="' + entity + '"]');
    if (!table) return;

    var tbody = table.tBodies && table.tBodies[0];
    if (!tbody) return;

    rows = Array.isArray(rows) ? rows : [];

    // =====================================================
    // ✅ Project_Member_In: "데이터가 없습니다" 행 + 별도 템플릿 기반 렌더
    // - 신규등록/저장전 상태에서 tbody에 템플릿 1행이 없어도 동작해야 함
    // =====================================================
    if (entity === 'Project_Member_In'){
      // 1) tbody 초기화
      while (tbody.firstChild) tbody.removeChild(tbody.firstChild);

      // 2) 데이터 없으면 안내 문구만
      if (!rows.length){
        tbody.innerHTML =
          '<tr data-empty-row="1">' +
            '<td colspan="10" style="opacity:.7; padding:1rem;">데이터가 없습니다.</td>' +
          '</tr>';
        return;
      }

      // 3) 데이터 있으면 template로 행 생성
      var tpl = document.getElementById('tpl-project-member-in-row');
      if (!tpl || !tpl.content){
        tbody.innerHTML =
          '<tr data-empty-row="1">' +
            '<td colspan="10" style="opacity:.7; padding:1rem;">행 템플릿을 찾을 수 없습니다.</td>' +
          '</tr>';
        return;
      }

      for (var i=0; i<rows.length; i++){
        var row = rows[i] || {};
        var tr = tpl.content.firstElementChild.cloneNode(true);

        if (typeof clearRowValues === 'function') clearRowValues(tr, 'clear');

        Object.keys(row).forEach(function(k){
          if (typeof _setRowField_ === 'function') _setRowField_(tr, k, row[k]);
          else {
            var el = tr.querySelector('[data-field="' + k + '"]');
            if (!el) return;
            var tag = (el.tagName || '').toLowerCase();
            if (tag === 'input' || tag === 'select' || tag === 'textarea') el.value = (row[k] == null ? '' : String(row[k]));
            else el.textContent = (row[k] == null ? '' : String(row[k]));
          }
        });

        var eid = (row && row.employee_id) ? String(row.employee_id).trim() : '';
        if (eid) tr.setAttribute('data-emp-id', eid);

        tbody.appendChild(tr);
      }

      try { if (typeof initAnimatedCheckboxes === 'function') initAnimatedCheckboxes(table); } catch(e){}
      try { if (typeof initTableRowCheckboxes === 'function') initTableRowCheckboxes(table); } catch(e){}
      try { if (typeof _updateMemberStatusInRoot_ === 'function') _updateMemberStatusInRoot_(bodyHost.querySelector('.pjt-modal-root') || bodyHost); } catch(e){}

      return;
    }

    // =====================================================
    // ✅ 기본 엔티티 테이블 렌더(기존 방식 유지)
    // =====================================================
    var desired = rows.length > 0 ? rows.length : 1;

    var trs = Array.from(tbody.querySelectorAll('tr'));
    if (!trs.length) return;

    while (trs.length < desired) {
      if (typeof tblAddRowAuto === 'function') tblAddRowAuto(table, { cloneMode:'clear' });
      trs = Array.from(tbody.querySelectorAll('tr'));
      if (!trs.length) break;
    }
    while (trs.length > desired) {
      trs[trs.length - 1].remove();
      trs.pop();
    }

    if (rows.length === 0) {
      if (typeof clearRowValues === 'function') clearRowValues(trs[0], 'clear');
      return;
    }

    for (var j=0; j<rows.length; j++){
      var tr2 = trs[j];
      var row2 = rows[j] || {};

      if (typeof clearRowValues === 'function') clearRowValues(tr2, 'clear');

      Object.keys(row2).forEach(function(k){
        if (typeof _setRowField_ === 'function') _setRowField_(tr2, k, row2[k]);
        else {
          var el2 = tr2.querySelector('[data-field="' + k + '"]');
          if (el2) el2.value = (row2[k] == null ? '' : String(row2[k]));
        }
      });
    }
  }

  /* =========================

   * - 조회모드(view): 모든 input/select/textarea disabled, footer=수정만

  function _pjtGetUiState_(bodyHost){

    var root = bodyHost.querySelector('.pjt-modal-root');

    root.querySelectorAll('input, select, textarea, button[data-tbl-action]').forEach(function(el){

  function _pjtSetFormDisabled_(bodyHost, disabled){
    var root = bodyHost.querySelector('.pjt-modal-root');
    if (!root) return;

    root.querySelectorAll('input, select, textarea, button[data-tbl-action]').forEach(function(el){
      if (disabled) {

    return modalEl.querySelector(
      'button[data-action="'+action+'"], button[data-modal-action="'+action+'"]'
    );

  function _pjtShowFooterButton_(modalEl, action, yes){
    var btn = _pjtFindFooterButton_(modalEl, action);
    if (!btn) return;
    btn.hidden = !yes;
    btn.style.display = yes ? '' : 'none';

  function _pjtToggleFooter_(modalEl, mode, hasProjectId){
    if (mode === 'view'){
      _pjtShowFooterButton_(modalEl, 'export', !!hasProjectId);
      _pjtShowFooterButton_(modalEl, 'edit',   !!hasProjectId);
      _pjtShowFooterButton_(modalEl, 'save',   false);
      _pjtShowFooterButton_(modalEl, 'delete', false);
      _pjtShowFooterButton_(modalEl, 'cancel', false);
    } else { // edit
      _pjtShowFooterButton_(modalEl, 'export', false);
      _pjtShowFooterButton_(modalEl, 'edit',   false);
      _pjtShowFooterButton_(modalEl, 'save',   true);
      _pjtShowFooterButton_(modalEl, 'delete', !!hasProjectId);

  function _pjtGetProjectId_(bodyHost){
    var pidEl = bodyHost.querySelector('.pjt-modal-root [data-field="project_id"]');

  function _pjtSetMode_(modalEl, bodyHost, mode){
    var root = bodyHost.querySelector('.pjt-modal-root');
    if (!root) return;

    var st = _pjtGetUiState_(bodyHost);
    if (st) st.mode = mode;

    root.dataset.mode = mode; // 디버깅용
    var hasId = !!_pjtGetProjectId_(bodyHost);

    // ✅ 감사(audit) 필드: 신규등록(미저장)일 땐 숨김, 조회/수정(저장된 건)일 땐 표시
    root.querySelectorAll('[data-pjt-audit]').forEach(function(w){
      w.hidden = !hasId;
    });

    if (mode === 'view') _pjtSetFormDisabled_(bodyHost, true);
    else _pjtSetFormDisabled_(bodyHost, false);

    _pjtToggleFooter_(modalEl, mode, hasId);
  }

  function _pjtMakeSnapshotFromCurrent_(bodyHost){
    var pid = _pjtGetProjectId_(bodyHost);
    var p = collectPayload_(bodyHost); // {project,tables}
    return { ok:true, project_id: pid, project: p.project, tables: p.tables };

  function _pjtTryCloseModal_(modalEl){
    var closeBtn = modalEl.querySelector(
      '[data-modal-close], .btn-modal-close, .page-modal-close, .modal-close, button[aria-label="닫기"], button[aria-label="Close"]'
    );

  // =========================
  // 프로젝트 표시/삭제 관리 모달
  // =========================
  (function(){
    function _qs_(root, sel){ return root ? root.querySelector(sel) : null; }
    function _qsa_(root, sel){ return root ? Array.prototype.slice.call(root.querySelectorAll(sel)) : []; }
    function _trim_(v){ return String(v == null ? '' : v).trim(); }

    function _callGAS_(fnName, payload){
      return new Promise(function(resolve, reject){
        if (!google || !google.script || !google.script.run) return reject(new Error('google.script.run 사용 불가'));
        var runner = google.script.run
          .withSuccessHandler(function(res){ resolve(res); })
          .withFailureHandler(function(err){ reject(err); });

        if (!runner[fnName]) return reject(new Error(fnName + ' is not a function'));
        runner[fnName](payload);
      });
    }

    function _safeUiScope_(host){
      try{
        if (typeof initUiScope === 'function') initUiScope(host || document);
        if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(host || document);
        if (typeof initTooltipPortal === 'function') initTooltipPortal(host || document);
        if (typeof initIconTooltips === 'function') initIconTooltips(host || document);
      }catch(e){}
    }

    function _uniqYears_(rows){
      var map = {};
      (rows || []).forEach(function(r){
        var y = _trim_(r && r.year);
        if (!y) return;
        map[y] = true;
      });
      return Object.keys(map).sort(function(a,b){
        var ai = parseInt(a,10), bi = parseInt(b,10);
        if (!isNaN(ai) && !isNaN(bi) && ai !== bi) return bi - ai; // desc
        return (a > b ? 1 : -1);
      });
    }

    function _renderYearSelect_(sel, years, keep){
      if (!sel) return;
      var cur = (keep != null) ? String(keep) : String(sel.value || '');
      // ✅ 연도는 오름차순(예: 2021, 2022 ...)으로 정렬하되, 최상단은 "전체연도" 유지
      years = (years || []).slice().sort(function(a,b){
        var na = parseInt(String(a||'').trim(), 10);
        var nb = parseInt(String(b||'').trim(), 10);
        if (isFinite(na) && isFinite(nb)) return na - nb;
       return String(a||'').localeCompare(String(b||''), 'ko', { numeric:true });
      });
      sel.innerHTML = '<option value="">전체연도</option>' + years.map(function(y){
        return '<option value="' + y + '">' + y + '</option>';
      }).join('');
      if (cur && years.indexOf(cur) >= 0) sel.value = cur;
      else sel.value = '';
    }

    function _esc_(s){
      s = String(s == null ? '' : s);
      return s.replace(/[&<>"']/g, function(ch){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]);
      });
    }

    function _rowHtmlVisible_(r){
      var pid = _trim_(r.project_id);
      // ✅ 리렌더 전 사용자가 바꾼 값(__is_visible) 우선
      var isv = String(r.__is_visible != null ? r.__is_visible : (r.is_visible == null ? '0' : r.is_visible));
      if (isv !== '1') isv = '0';
      return (
        '<tr data-project-id="' + _esc_(pid) + '">' +
          '<td><div class="text-tbl">' + _esc_(r.year || '') + '</div></td>' +
          '<td><div class="text-tbl">' + _esc_(r.business_name || '') + '</div></td>' +
          '<td><div class="text-tbl">' + _esc_(r.start_date || '') + '</div></td>' +
          '<td><div class="text-tbl">' + _esc_(r.end_date || '') + '</div></td>' +
          '<td>' +
            '<select class="select-tbl" data-field="is_visible">' +
              '<option value="0"' + (isv === '0' ? ' selected' : '') + '>활성</option>' +
              '<option value="1"' + (isv === '1' ? ' selected' : '') + '>비활성</option>' +
            '</select>' +
          '</td>' +
        '</tr>'
      );
    }

    function _rowHtmlDeleted_(r){
      var pid = _trim_(r.project_id);
      // ✅ 리렌더 전 사용자가 바꾼 값(__restore) 우선
      var cur = String(r.__restore || 'deleted');
      if (cur !== 'restore' && cur !== 'hard') cur = 'deleted';
      return (
        '<tr data-project-id="' + _esc_(pid) + '">' +
          '<td><div class="text-tbl">' + _esc_(r.year || '') + '</div></td>' +
          '<td><div class="text-tbl">' + _esc_(r.business_name || '') + '</div></td>' +
          '<td><div class="text-tbl">' + _esc_(r.start_date || '') + '</div></td>' +
          '<td><div class="text-tbl">' + _esc_(r.end_date || '') + '</div></td>' +
          '<td>' +
            '<select class="select-tbl" data-field="restore">' +
              '<option value="deleted"' + (cur === 'deleted' ? ' selected' : '') + '>삭제</option>' +
              '<option value="restore"' + (cur === 'restore' ? ' selected' : '') + '>복구</option>' +
              '<option value="hard"'   + (cur === 'hard'   ? ' selected' : '') + '>완전삭제</option>' +
            '</select>' +
          '</td>' +
        '</tr>'
      );
    }

    // ✅ 공통정렬(year↑, start_date↑, business_name↑)
    function _cmpCommonProj_(a, b){
      function ny_(v){
        var n = parseInt(String(v == null ? '' : v).trim(), 10);
        return isFinite(n) ? n : 999999;
      }
      function nd_(v){
        // YYYY-MM-DD는 문자열 비교로 오름차순 정렬 가능
        return String(v == null ? '' : v).trim();
      }
      function nn_(v){ return String(v == null ? '' : v).trim(); }

      var ay = ny_(a && a.year), by = ny_(b && b.year);
      if (ay !== by) return ay - by;
      var ad = nd_(a && a.start_date), bd = nd_(b && b.start_date);
      if (ad !== bd) return (ad < bd ? -1 : 1);
      var an = nn_(a && a.business_name), bn = nn_(b && b.business_name);
      var c = an.localeCompare(bn, 'ko');
      if (c) return c;
      // tie-breaker
      return String((a && a.project_id) || '').localeCompare(String((b && b.project_id) || ''));
    }

    function _renderTables_(root, state){
      var tbodyV = _qs_(root, '[data-pjt-vis-tbody="visible"]');
      var tbodyD = _qs_(root, '[data-pjt-vis-tbody="deleted"]');

      var ySelV = _qs_(root, '[data-pjt-vis-year="visible"]');
      var ySelD = _qs_(root, '[data-pjt-vis-year="deleted"]');
      var sSelV = _qs_(root, '[data-pjt-vis-status="visible"]');
      var sSelD = _qs_(root, '[data-pjt-vis-status="deleted"]');

      var yv = _trim_(ySelV && ySelV.value);
      var yd = _trim_(ySelD && ySelD.value);
      var sv = _trim_(sSelV && sSelV.value); // '' | '0' | '1'
      var sd = _trim_(sSelD && sSelD.value); // '' | 'deleted' | 'restore'

      // ✅ 리렌더 전, 사용자가 바꾼 select 값을 DOM에서 읽어 보존
      var visMap = {};
      if (tbodyV){
        _qsa_(tbodyV, 'tr[data-project-id]').forEach(function(tr){
          var pid = _trim_(tr.getAttribute('data-project-id'));
          var sel = _qs_(tr, 'select[data-field="is_visible"]');
          if (!pid || !sel) return;
          var v = String(sel.value || '0'); if (v !== '1') v = '0';
          visMap[pid] = v;
        });
      }
      var resMap = {};
      if (tbodyD){
        _qsa_(tbodyD, 'tr[data-project-id]').forEach(function(tr){
          var pid = _trim_(tr.getAttribute('data-project-id'));
          var sel = _qs_(tr, 'select[data-field="restore"]');
          if (!pid || !sel) return;
          var v = String(sel.value || 'deleted'); if (v !== 'restore' && v !== 'hard') v = 'deleted';
          resMap[pid] = v;
        });
      }
      var vRows = (state.visibleRows || [])
        .map(function(r){
          // 보존값 주입
          var pid = _trim_(r && r.project_id);
          if (pid && visMap[pid] != null) r.__is_visible = visMap[pid];
          return r;
        })
        .slice()
        .sort(_cmpCommonProj_)
        .filter(function(r){
        if (!yv) return true;
        return String(r.year || '').trim() === yv;
        })
        .filter(function(r){
          if (!sv) return true;
          var isv = String(r.__is_visible != null ? r.__is_visible : (r.is_visible == null ? '0' : r.is_visible));
          if (isv !== '1') isv = '0';
          return isv === sv;
        });

      var dRows = (state.deletedRows || [])
        .map(function(r){
          var pid = _trim_(r && r.project_id);
          if (pid && resMap[pid] != null) r.__restore = resMap[pid];
          return r;
        })
        .slice()
        .sort(_cmpCommonProj_)
        .filter(function(r){
        if (!yd) return true;
        return String(r.year || '').trim() === yd;
        })
        .filter(function(r){
          if (!sd) return true;
          var cur = String(r.__restore || 'deleted');
          if (cur !== 'restore' && cur !== 'hard') cur = 'deleted';
          return cur === sd;
        });

      if (tbodyV){
        tbodyV.innerHTML = vRows.length
          ? vRows.map(_rowHtmlVisible_).join('')
          : '<tr><td colspan="5" style="opacity:.7; padding:1rem;">데이터가 없습니다.</td></tr>';
      }

      if (tbodyD){
        tbodyD.innerHTML = dRows.length
          ? dRows.map(_rowHtmlDeleted_).join('')
          : '<tr><td colspan="5" style="opacity:.7; padding:1rem;">데이터가 없습니다.</td></tr>';
      }

      _safeUiScope_(root);
    }

    function _collectPayload_(root){
      var visibles = [];
      _qsa_(root, '[data-pjt-vis-tbody="visible"] tr[data-project-id]').forEach(function(tr){
        var pid = _trim_(tr.getAttribute('data-project-id'));
        var sel = _qs_(tr, 'select[data-field="is_visible"]');
        if (!pid || !sel) return;
        var v = String(sel.value || '0');
        if (v !== '1') v = '0';
        visibles.push({ project_id: pid, is_visible: Number(v) });
      });

      var restoreIds = [];
      var hardDeleteIds = [];
      _qsa_(root, '[data-pjt-vis-tbody="deleted"] tr[data-project-id]').forEach(function(tr){
        var pid = _trim_(tr.getAttribute('data-project-id'));
        var sel = _qs_(tr, 'select[data-field="restore"]');
        if (!pid || !sel) return;
        var v = String(sel.value || '');
        if (v === 'restore') restoreIds.push(pid);
        else if (v === 'hard') hardDeleteIds.push(pid);
      });

      return { visibles: visibles, restoreIds: restoreIds, hardDeleteIds: hardDeleteIds };
    }

    function _bind_(modalEl, bodyHost){
      var root = bodyHost.querySelector('[data-pjt-vis-admin-root]') || bodyHost;
      if (!root) return;

      var state = { visibleRows: [], deletedRows: [] };
      modalEl.__pjtVisAdminState = state;

      var ySelV = _qs_(root, '[data-pjt-vis-year="visible"]');
      var ySelD = _qs_(root, '[data-pjt-vis-year="deleted"]');
      var sSelV = _qs_(root, '[data-pjt-vis-status="visible"]');
      var sSelD = _qs_(root, '[data-pjt-vis-status="deleted"]');

      function reload(){
        var keepV = ySelV ? ySelV.value : '';
        var keepD = ySelD ? ySelD.value : '';
        var keepSV = sSelV ? sSelV.value : '';
        var keepSD = sSelD ? sSelD.value : '';

        // loading state
        var tbodyV = _qs_(root, '[data-pjt-vis-tbody="visible"]');
        var tbodyD = _qs_(root, '[data-pjt-vis-tbody="deleted"]');
        if (tbodyV) tbodyV.innerHTML = '<tr><td colspan="5" style="opacity:.7; padding:1rem;">로딩 중...</td></tr>';
        if (tbodyD) tbodyD.innerHTML = '<tr><td colspan="5" style="opacity:.7; padding:1rem;">로딩 중...</td></tr>';

        return _callGAS_('PROJECT_adminListVisibility', {})
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.message) ? res.message : '조회 실패');

            state.visibleRows = res.visibleRows || [];
            state.deletedRows = res.deletedRows || [];

            _renderYearSelect_(ySelV, _uniqYears_(state.visibleRows), keepV);
            _renderYearSelect_(ySelD, _uniqYears_(state.deletedRows), keepD);
            if (sSelV) sSelV.value = keepSV;
            if (sSelD) sSelD.value = keepSD;

            _renderTables_(root, state);
            return res;
          })
          .catch(function(err){
            if (typeof showAlertError === 'function') {
              showAlertError((err && err.message) ? err.message : String(err), '조회 실패');
            }
            throw err;
          });
      }

      function save(){
        var payload = _collectPayload_(root);
        return _callGAS_('PROJECT_adminSaveVisibility', payload)
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.message) ? res.message : '저장 실패');
            if (typeof showAlertSuccess === 'function') {
              showAlertSuccess('저장되었습니다.');
            }
            return reload().then(function(){
              // ✅ 메인 프로젝트 목록도 최신화
              try { if (typeof window.Project_reloadList === 'function') window.Project_reloadList(); } catch(e){}
            });
          })
          .catch(function(err){
            if (typeof showAlertError === 'function') {
              showAlertError((err && err.message) ? err.message : String(err), '저장 실패');
            }
            throw err;
          });
      }

      // 연도 변경 시 즉시 렌더
      if (ySelV && !ySelV.__bound){
        ySelV.__bound = true;
        ySelV.addEventListener('change', function(){ _renderTables_(root, state); });
      }
      if (ySelD && !ySelD.__bound){
        ySelD.__bound = true;
        ySelD.addEventListener('change', function(){ _renderTables_(root, state); });
      }

      // ✅ 상태 필터 변경 시 즉시 렌더
      if (sSelV && !sSelV.__bound){
        sSelV.__bound = true;
        sSelV.addEventListener('change', function(){ _renderTables_(root, state); });
      }
      if (sSelD && !sSelD.__bound){
        sSelD.__bound = true;
        sSelD.addEventListener('change', function(){ _renderTables_(root, state); });
      }

      modalEl.__pjtVisAdminReload = reload;
      modalEl.__pjtVisAdminSave = save;

      _safeUiScope_(root);
      return reload();
    }

    // ===== 외부 엔트리 =====
    window.projectVisibilityAdminPageModal = function(){
      openPageModal({
        templateId: 'project-visibility-admin-page-modal',
        title: '프로젝트 설정',
        size: 'full',
        footerButtons: [
          { action:'save', text:'저장', icon:'fa-solid fa-floppy-disk', className:'btn-box btn-box-blue', close:false, autoAlert:false }
        ],
        onOpen: function(modalEl, bodyHost){
          try{
            _bind_(modalEl, bodyHost);
          } catch(e){
            if (typeof showAlertError === 'function') showAlertError((e && e.message) ? e.message : String(e), '오류');
          }
        },
        onAction: function(action, e, modalEl, bodyHost, done){
          if (action === 'save'){
            var p = (modalEl && modalEl.__pjtVisAdminSave) ? modalEl.__pjtVisAdminSave() : Promise.resolve();
            Promise.resolve(p).then(function(){
              done({ ok:true, autoAlert:false });
            }).catch(function(err){
              // __pjtVisAdminSave 내부에서 알림 처리하므로 여기서는 조용히 실패만 전달
              done({ ok:false, autoAlert:false });
            });
            return false;
          }
          // cancel은 기본 동작(닫기)
        }
      });
    };
  })();

function _cssEscape_(v){
  v = String(v == null ? '' : v);
  if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(v);
  // fallback: 특수문자 escape
  return v.replace(/[^a-zA-Z0-9_\-]/g, function(ch){
    return '\\' + ch.charCodeAt(0).toString(16) + ' ';
  });
}

/** 사번(employee_id) 정렬용 비교기 */
function _cmpEmpId_(a, b){
  a = _normStr_(a);
  b = _normStr_(b);
  // 숫자 사번이면 숫자 비교
  var na = parseInt(a, 10);
  var nb = parseInt(b, 10);
  var aNum = (String(na) === a);
  var bNum = (String(nb) === b);
  if (aNum && bNum) return na - nb;
  // 혼합이면 문자열(숫자 자연정렬)
  try {
    return a.localeCompare(b, 'ko', { numeric:true, sensitivity:'base' });
  } catch(e){
    return a < b ? -1 : (a > b ? 1 : 0);
  }
}


function _normStr_(v){ return String(v == null ? '' : v).trim(); }

function _normYmd_(v){
  v = _normStr_(v);
  if (!v) return '';
  // "YYYY-MM-DD" / "YYYY.MM.DD" / "YYYYMMDD" 대응
  var m = v.match(/^(\d{4})\D?(\d{2})\D?(\d{2})/);
  if (!m) return '';
  return m[1] + '-' + m[2] + '-' + m[3];
}

function _ymdToDate_(ymd){
  ymd = _normYmd_(ymd);
  if (!ymd) return null;
  var m = ymd.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return null;
  var y = parseInt(m[1],10), mo = parseInt(m[2],10), d = parseInt(m[3],10);
  var dt = new Date(y, mo-1, d);
  if (dt.getFullYear() !== y || (dt.getMonth()+1) !== mo || dt.getDate() !== d) return null;
  return dt;
}

function _todayYmd_(){
  var d = new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + dd;
}

// inclusive 월/일 차이(종료일 포함) → {months,days,text}
function _diffMonthsDaysInclusiveObj_(startYmd, endYmd){
  startYmd = _normYmd_(startYmd);
  endYmd   = _normYmd_(endYmd);

  var s = _ymdToDate_(startYmd);
  var e = _ymdToDate_(endYmd);
  if (!s || !e) return { months:0, days:0, text:'' };

  // 종료일 포함
  var e2 = new Date(e.getTime());
  e2.setDate(e2.getDate() + 1);

  // months 최대한 땡기기
  var months = (e2.getFullYear() - s.getFullYear()) * 12 + (e2.getMonth() - s.getMonth());
  var anchor = new Date(s.getTime());
  anchor.setMonth(anchor.getMonth() + months);

  // month overflow 보정
  while (anchor.getDate() !== s.getDate() && anchor > s) anchor.setDate(anchor.getDate()-1);

  if (anchor > e2){
    months -= 1;
    anchor = new Date(s.getTime());
    anchor.setMonth(anchor.getMonth() + months);
    while (anchor.getDate() !== s.getDate() && anchor > s) anchor.setDate(anchor.getDate()-1);
  }

  var days = Math.floor((e2 - anchor) / 86400000);

  var text = '';
  if (months > 0) text += months + '개월';
  if (days > 0) text += (text ? ' ' : '') + days + '일';
  if (!text) text = '0일';

  return { months:months, days:days, text:text };
}

// 'N개월 M일' / 'N개월' / 'M일' -> {months, days}
function _parseMdText_(v){
  var s = String(v == null ? '' : v).trim();
  if (!s || s === '-') return { months: 0, days: 0 };

  var mo = 0, d = 0;
  var m1 = s.match(/(\d+)\s*개월/);
  if (m1) mo = parseInt(m1[1], 10) || 0;
  var m2 = s.match(/(\d+)\s*일/);
  if (m2) d = parseInt(m2[1], 10) || 0;

  if (!m1 && !m2) return { months: 0, days: 0 };
  if (mo === 0 && d === 0) return { months: 0, days: 0 };
  return { months: mo, days: d };
}

function _groupBy_(rows, key){
  var out = {};
  (rows || []).forEach(function(r){
    if (!r) return;
    var k = _normStr_(r[key]);
    if (!k) return;
    (out[k] = out[k] || []).push(r);
  });
  return out;
}

function _pickLatestByStart_(rows){
  rows = rows || [];
  var best = null;
  var bestYmd = '';
  rows.forEach(function(r){
    var s = _normYmd_(r && r.start_date);
    if (!s) return;
    if (!best || s > bestYmd){
      best = r;
      bestYmd = s;
    }
  });
  return best;
}

// ✅ 오늘 적용 직위: start <= today <= end(없으면 무기한), 여러개면 start가 가장 최신
function _pickPositionNow_(posRows, todayYmd){
  todayYmd = _normYmd_(todayYmd);
  var todayD = _ymdToDate_(todayYmd);
  if (!todayD) return '';

  var currentPos = '';
  var currentStart = null;

  (posRows || []).forEach(function(r){
    var s = _ymdToDate_(r && r.start_date);
    if (!s) return;
    if (s > todayD) return;

    var e = _ymdToDate_(r && r.end_date);
    if (e && todayD > e) return;

    if (!currentStart || s > currentStart){
      currentStart = s;
      currentPos = _normStr_(r && r.name);
    }
  });

  return currentPos;
}

// ✅ 고용상태(오늘 기준): 재직 / 퇴직 / 재직예정
function _calcStatusNow_(agrRows, todayYmd){
  todayYmd = _normYmd_(todayYmd);
  if (!todayYmd) return '';

  var hasAny = false;
  var hasFuture = false;
  var hasPastOrNow = false;
  var isActive = false;

  (agrRows || []).forEach(function(r){
    var s = _normYmd_(r && r.start_date);
    var e = _normYmd_(r && r.end_date);
    if (!s) return;
    hasAny = true;

    if (s > todayYmd){
      hasFuture = true;
      return;
    }

    hasPastOrNow = true;
    if (!e || todayYmd <= e){
      isActive = true;
    }
  });

  if (!hasAny) return '';
  if (isActive) return '재직';
  if (hasFuture && !hasPastOrNow) return '재직예정';
  return '퇴직';
}

// ✅ 총근무연차: (재직기간 + (적용)경력기간) 합산 → N년차
function _calcWorkingYearcount_(agrRows, expRows, todayYmd){
  todayYmd = _normYmd_(todayYmd);

  // (1) 재직기간(오늘까지): 최신 계약 start~min(today,end)
  var tenureMo = 0, tenureDa = 0;
  var isTenureValid = false;

  var a = _pickLatestByStart_(agrRows || []);
  if (a){
    var s = _normYmd_(a.start_date);
    var e = _normYmd_(a.end_date);

    if (s && todayYmd){
      isTenureValid = (s <= todayYmd); // 미래 시작이면 총근무 비움
      if (isTenureValid){
        var endForNow = (!e || e >= todayYmd) ? todayYmd : e;
        var oTenure = _diffMonthsDaysInclusiveObj_(s, endForNow);
        tenureMo = oTenure ? (oTenure.months || 0) : 0;
        tenureDa = oTenure ? (oTenure.days   || 0) : 0;
      }
    }
  }

  if (!isTenureValid){
    return { yearcount:'' };
  }

  // (2) (적용)경력기간 합산: period만 사용
  var moSum = 0, dSum = 0;
  (expRows || []).forEach(function(r){
    var cat = _normStr_(r && r.category);
    if (!cat || !/\(적용\)/.test(cat)) return;
    var md = _parseMdText_(r && r.period);
    if (!md) return;
    moSum += (md.months || 0);
    dSum  += (md.days   || 0);
  });

  if (dSum >= 30){
    moSum += Math.floor(dSum / 30);
    dSum = dSum % 30;
  }

  // (3) 합산
  var totalMo = (tenureMo || 0) + (moSum || 0);
  var totalDa = (tenureDa || 0) + (dSum || 0);
  if (totalDa >= 30){
    totalMo += Math.floor(totalDa / 30);
    totalDa = totalDa % 30;
  }

  var units = (totalMo * 30) + totalDa;
  var year = Math.floor((Math.max(units, 1) - 1) / 360) + 1;
  var yearcount = (year + '년차');

  return { yearcount: yearcount };
}

function _renderPickTable_(bodyHost, data){

  rows = rows.slice().sort(function(a,b){ return _cmpEmpId_(a && a.employee_id, b && b.employee_id); });
  var posByEmp = _groupBy_((data && data.positionRows) || [], 'employee_id');
  var agrByEmp = _groupBy_((data && data.agreementRows) || [], 'employee_id');
  var expByEmp = _groupBy_((data && data.experienceRows) || [], 'employee_id');

  var todayYmd = _todayYmd_();

  rows.forEach(function(e){

    var agr = agrByEmp[id] || [];
    var exp = expByEmp[id] || [];

    e.__pick_position_now = _pickPositionNow_(pos, todayYmd);
    e.__pick_status_now   = _calcStatusNow_(agr, todayYmd);
    e.__pick_working_yearcount = _calcWorkingYearcount_(agr, exp, todayYmd).yearcount || '';
  });

  function esc_(s){
    return String(s==null?'':s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  function rowHtml_(e){
    var eid = _normStr_(e && e.employee_id);
    var added = !!(bodyHost && bodyHost.__pickExistingEmpIds && bodyHost.__pickExistingEmpIds.has(eid));
    var name = _normStr_(e && e.name);
    var company = _normStr_(e && e.company);
    var dept = _normStr_(e && e.department);
    var pos = _normStr_(e && e.__pick_position_now);
    var yc  = _normStr_(e && e.__pick_working_yearcount);
    var cat = _normStr_(e && e.category);          // 고용구분
    var st  = _normStr_(e && e.__pick_status_now); // 고용상태(계산)
    var mg  = _normStr_(e && e.manage);            // 관리주체

    return '' +
      '<tr data-emp-id="'+esc_(eid)+'">' +
       (added
         ? '<td style="text-align:center;"><div class="text-tbl" style="opacity:.45;">-</div></td>'
         : '<td style="text-align:center;"><input type="checkbox" class="chk-anim emp-pick-chk" aria-label="선택" data-emp-id="'+esc_(eid)+'"></td>'
       ) +
        '<td><div class="text-tbl">'+esc_(eid)+'</div></td>' +
        '<td><div class="text-tbl">'+esc_(name)+'</div></td>' +
        '<td><div class="text-tbl">'+esc_(company)+'</div></td>' +
        '<td><div class="text-tbl">'+esc_(dept)+'</div></td>' +
        '<td><div class="text-tbl">'+esc_(pos)+'</div></td>' +
        '<td><div class="text-tbl">'+esc_(yc)+'</div></td>' +
        '<td><div class="text-tbl">'+esc_(cat)+'</div></td>' +
        '<td><div class="text-tbl">'+esc_(st)+'</div></td>' +
        '<td><div class="text-tbl">'+esc_(mg)+'</div></td>' +
      '</tr>';
  }

  if (!rows.length){
    tbody.innerHTML = '<tr><td colspan="10" style="opacity:.7; padding:1rem;">표시할 소속인력이 없습니다.</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(rowHtml_).join('');
  // ✅ 커스텀 체크박스/테이블 체크 동기화 재초기화(meta.html)
  try { if (typeof initAnimatedCheckboxes === 'function') initAnimatedCheckboxes(table); } catch(e){}
  try { if (typeof initTableRowCheckboxes === 'function') initTableRowCheckboxes(table); } catch(e){}

  // ✅ 검색 + 3필터(고용구분/고용상태/관리주체)
  var qEl   = bodyHost.querySelector('[data-pick-q]');
  var catEl = bodyHost.querySelector('[data-pick-cat]');
  var stEl  = bodyHost.querySelector('[data-pick-status]');
  var mgEl  = bodyHost.querySelector('[data-pick-manage]');

  function applyPickFilter_(){
    var q   = _normStr_(qEl ? qEl.value : '').toLowerCase();
    var cat = _normStr_(catEl ? catEl.value : '');     // 교원/직원
    var st  = _normStr_(stEl ? stEl.value : '');       // 재직/퇴직
    var mg  = _normStr_(mgEl ? mgEl.value : '');       // 관리주체

    tbody.querySelectorAll('tr[data-emp-id]').forEach(function(tr){
      // 행에서 값 읽기(현재 렌더는 td 순서가 고정이므로 index로 읽음)
      // [0]=chk, [1]=사번, [2]=성명, [3]=회사, [4]=부서, [5]=직위, [6]=총근무연차, [7]=고용구분, [8]=고용상태, [9]=관리주체
      var tds = tr.children || [];
      var rowCat = _normStr_(tds[7] ? tds[7].textContent : '');
      var rowSt  = _normStr_(tds[8] ? tds[8].textContent : '');
      var rowMg  = _normStr_(tds[9] ? tds[9].textContent : '');

      var ok = true;

      // 검색
      if (q){
        ok = (tr.textContent || '').toLowerCase().indexOf(q) >= 0;
        if (!ok){ tr.style.display = 'none'; return; }
      }

      // 고용구분
      if (cat && rowCat !== cat) ok = false;

      // 고용상태(재직/퇴직만)
      if (st && rowSt !== st) ok = false;

      // 관리주체
      if (mg && rowMg !== mg) ok = false;

      tr.style.display = ok ? '' : 'none';
    });
  }

  if (qEl)   qEl.oninput = applyPickFilter_;
  if (catEl) catEl.onchange = applyPickFilter_;
  if (stEl)  stEl.onchange  = applyPickFilter_;
  if (mgEl)  mgEl.onchange  = applyPickFilter_;
}

function _getEmpMap_(pickData){

  (pickData && pickData.employeeRows || []).forEach(function(e){

    if (id) map[id] = e;
  });
  return map;
}

function _renderPickPreview_(bodyHost, pickData){
  var tb = bodyHost.querySelector('[data-pick-memin-tbody]');
  if (!tb) return;

  var set = _ensurePickSelectedSet_(bodyHost);
  var order = Array.isArray(bodyHost.__pickSelectedOrder) ? bodyHost.__pickSelectedOrder.slice() : [];
  var ids = order.length
    ? order.filter(function(id){ return set.has(id); })
    : Array.from(set);
  // ✅ 사번 오름차순 정렬
  ids.sort(function(a,b){ return _cmpEmpId_(a, b); });

  if (!ids.length){
    tb.innerHTML = '<tr><td colspan="10" style="opacity:.7; padding:1rem;">선택된 참여인력이 없습니다.</td></tr>';
    return;
  }

  var empMap = _getEmpMap_(pickData);
  var draft = bodyHost.__pickDraft || (bodyHost.__pickDraft = {});

  function esc_(s){
    return String(s==null?'':s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  function escAttr_(s){ return esc_(s).replace(/"/g,'&quot;'); }

  tb.innerHTML = ids.map(function(eid){
    var e = empMap[eid] || {};
    var d = draft[eid] || {};
    var vStart = (d.start_date || '');
    var vEnd   = (d.end_date || '');
    var vRole  = (d.role || '');

    return '' +
      '<tr data-emp-id="'+esc_(eid)+'">' +
        '<td style="text-align:center;"><input type="checkbox" class="chk-anim pick-prev-chk" aria-label="선택" data-emp-id="'+esc_(eid)+'"></td>' +
        '<td><div class="text-tbl">'+esc_(eid)+'</div></td>' +
        '<td><div class="text-tbl">'+esc_(_normStr_(e.name))+'</div></td>' +
        '<td><div class="text-tbl">'+esc_(_normStr_(e.company))+'</div></td>' +
        '<td><div class="text-tbl">'+esc_(_normStr_(e.department))+'</div></td>' +
        '<td><div class="text-tbl">'+esc_(_normStr_(e.__pick_position_now))+'</div></td>' +
        '<td><input type="text" class="input-tbl input-date" data-prev-start placeholder="0000-00-00" style="min-width:110px;" value="'+escAttr_(vStart)+'"></td>' +
        '<td><input type="text" class="input-tbl input-date" data-prev-end placeholder="0000-00-00" style="min-width:110px;" value="'+escAttr_(vEnd)+'"></td>' +
        '<td><div class="text-tbl" data-prev-status></div></td>' +
        '<td><input type="text" class="input-tbl" data-prev-role placeholder="수행업무" style="min-width:160px;" value="'+escAttr_(vRole)+'"></td>' +
      '</tr>';
  }).join('');

  // 체크박스/툴 재초기화
  try { if (typeof initAnimatedCheckboxes === 'function') initAnimatedCheckboxes(bodyHost); } catch(e){}
  try { if (typeof initTableRowCheckboxes === 'function') initTableRowCheckboxes(bodyHost); } catch(e){}

  // ✅ input-date / inputgroup 등 커스텀 UI 즉시 반영(meta.html)
  try { if (window.initInputDateFields) window.initInputDateFields(bodyHost); } catch(e){}
  try { if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(bodyHost); } catch(e){}
  try { if (typeof initUiScope === 'function') initUiScope(bodyHost); } catch(e){}

  // 입력값을 draft로 저장 + 상태 계산
  tb.querySelectorAll('tr[data-emp-id]').forEach(function(tr){
    var eid = _normStr_(tr.getAttribute('data-emp-id'));
    if (!eid) return;

    function refresh_(){
      var s = tr.querySelector('[data-prev-start]')?.value || '';
      var e = tr.querySelector('[data-prev-end]')?.value || '';
      var st = (typeof _calcMemberStatus_ === 'function') ? _calcMemberStatus_(s, e) : '';
      var stEl = tr.querySelector('[data-prev-status]');
      if (stEl) stEl.textContent = st;
    }

    function syncDraft_(){
      draft[eid] = draft[eid] || {};
      draft[eid].start_date = _normStr_(tr.querySelector('[data-prev-start]') && tr.querySelector('[data-prev-start]').value);
      draft[eid].end_date   = _normStr_(tr.querySelector('[data-prev-end]') && tr.querySelector('[data-prev-end]').value);
      draft[eid].role       = _normStr_(tr.querySelector('[data-prev-role]') && tr.querySelector('[data-prev-role]').value);
    }

    tr.addEventListener('input', function(ev){
      var t = ev.target;
      if (!t) return;
      if (t.matches('[data-prev-start], [data-prev-end], [data-prev-role]')) syncDraft_();
      if (t.matches('[data-prev-start], [data-prev-end]')) refresh_();
    });
    syncDraft_();
    refresh_();
  });
}

function _bindPickMoveButtons_(parentRoot, modalEl, bodyHost){
  var downBtn = bodyHost.querySelector('[data-pick-move="down"]');
  var upBtn   = bodyHost.querySelector('[data-pick-move="up"]');
  if (!downBtn && !upBtn) return;

  function getPickData_(){ return bodyHost.__pickEmployeeData; }

  function getCheckedIdsInList_(){
    var ids = [];
    bodyHost.querySelectorAll('input.emp-pick-chk:checked').forEach(function(chk){
      var eid = _normStr_(chk.getAttribute('data-emp-id'));
      if (eid) ids.push(eid);
    });
    return ids;
  }
  function getCheckedIdsInPreview_(){
    var ids = [];
    bodyHost.querySelectorAll('input.pick-prev-chk:checked').forEach(function(chk){
      var eid = _normStr_(chk.getAttribute('data-emp-id'));
      if (eid) ids.push(eid);
    });
    return ids;
  }


  // ✅ down/up 버튼 클릭에서 공용으로 쓰는 재렌더 헬퍼
  function rerender_(){
    var pickData = getPickData_();
    if (!pickData || !pickData.ok) return;
    bodyHost.__pickExistingEmpIds = new Set(Array.from(_ensurePickSelectedSet_(bodyHost)));
    _renderPickTable_(bodyHost, pickData);
    _renderPickPreview_(bodyHost, pickData);

    // ✅ (중요) 전체선택 체크박스는 thead DOM이 유지되므로 수동으로 해제 필요
    try{
      // 소속인력(상단) 전체선택 해제
      var empAll = bodyHost.querySelector('table[data-pick-table="employee"] thead input[type="checkbox"]');
      if (empAll) empAll.checked = false;

      // 참여인력(하단) 전체선택 해제
      var memAll = bodyHost.querySelector('input[data-pick-memin-all]') ||
                   bodyHost.querySelector('table[data-pick-table="member-in"] thead input[type="checkbox"]');
      if (memAll) memAll.checked = false;

      // 혹시 남아있는 체크도 같이 해제(안전)
      bodyHost.querySelectorAll('input.emp-pick-chk:checked, input.pick-prev-chk:checked')
        .forEach(function(chk){ chk.checked = false; });
    }catch(e){}
  }
  
  if (downBtn){
    downBtn.addEventListener('click', function(){
      var pickData = getPickData_();
      if (!pickData || !pickData.ok){
        showAlertWarn('목록을 먼저 불러온 뒤 선택해주세요.', '안내');
        return;
      }
      var ids = getCheckedIdsInList_();
      if (!ids.length){
        showAlertWarn('이동할 소속인력을 먼저 체크해주세요.', '안내');
        return;
      }
      var set = _ensurePickSelectedSet_(bodyHost);
      var order = bodyHost.__pickSelectedOrder || (bodyHost.__pickSelectedOrder = []);
      var draft = bodyHost.__pickDraft || (bodyHost.__pickDraft = {});
      ids.forEach(function(id){
        if (!id) return;
        if (!set.has(id)){
          set.add(id);
          if (order.indexOf(id) < 0) order.push(id);
        }
        draft[id] = draft[id] || { start_date:'', end_date:'', role:'' };
      });
      rerender_();
    });
  }

  if (upBtn){
    upBtn.addEventListener('click', function(){
      var pickData = getPickData_();
      if (!pickData || !pickData.ok) return;
      var ids = getCheckedIdsInPreview_();
      if (!ids.length){
        showAlertWarn('참여인력 테이블에서 제거할 항목을 체크해주세요.', '안내');
        return;
      }
      var set = _ensurePickSelectedSet_(bodyHost);
      var order = bodyHost.__pickSelectedOrder || (bodyHost.__pickSelectedOrder = []);
      var draft = bodyHost.__pickDraft || (bodyHost.__pickDraft = {});
      ids.forEach(function(id){
        set.delete(id);
        var idx = order.indexOf(id);
        if (idx >= 0) order.splice(idx, 1);
        if (draft[id]) delete draft[id];
      });
      rerender_();
    });
  }
}


function _loadAllEmployeesForPick_(cb){
  cb = (typeof cb === 'function') ? cb : function(){};

  if (!(google && google.script && google.script.run)){
    cb({ ok:false, message:'google.script.run을 찾을 수 없습니다.' });
    return;
  }

  var page = 1;
  var pageSize = 500;
  var acc = null;

  function merge_(base, add){
    if (!base) return add;
    base.employeeRows   = (base.employeeRows   || []).concat(add.employeeRows   || []);
    base.positionRows   = (base.positionRows   || []).concat(add.positionRows   || []);
    base.agreementRows  = (base.agreementRows  || []).concat(add.agreementRows  || []);
    base.experienceRows = (base.experienceRows || []).concat(add.experienceRows || []);
    return base;
  }

  function next_(){
    google.script.run
      .withSuccessHandler(function(res){
        if (!res || !res.ok){
          cb(res || { ok:false, message:'EMPLOYEE_listTabs 실패' });
          return;
        }

        acc = merge_(acc, res);

        var total = parseInt(res.total || 0, 10) || 0;
        var got = (acc.employeeRows || []).length;

        if (total && got < total){
          page += 1;
          next_();
          return;
        }

        cb(acc);
      })
      .withFailureHandler(function(err){
        cb({ ok:false, message:(err && err.message) ? err.message : String(err) });
      })
      .EMPLOYEE_listTabs({ page: page, pageSize: pageSize });
  }

  next_();
}

function _addSelectedEmployeesToProject_(parentRoot, pickBodyHost, pickData){
  if (!parentRoot) return { ok:false, message:'parentRoot가 없습니다.' };

  var table = parentRoot.querySelector('table[data-entity="Project_Member_In"]');
  var tbody = table ? table.querySelector('tbody') : null;
  if (!table || !tbody) return { ok:false, message:'참여인력(Project_Member_In) 테이블을 찾을 수 없습니다.' };

  // ✅ 1순위: 미리보기(↓로 이동된) 선택 셋
  var selectedSet = pickBodyHost.__pickSelectedEmpIds;
  var selectedIds = selectedSet ? Array.from(selectedSet) : [];

  // ✅ 2순위: (미리보기 미사용 시) 상단목록 체크
  if (!selectedIds.length){
    pickBodyHost.querySelectorAll('input.emp-pick-chk:checked').forEach(function(chk){
      var eid = _normStr_(chk.getAttribute('data-emp-id'));
      if (eid) selectedIds.push(eid);
    });
  }

  if (!selectedIds.length){
    return { ok:false, message:'선택된 소속인력이 없습니다.' };
  }

  // 기존 employee_id set
  var exists = new Set();
  tbody.querySelectorAll('tr').forEach(function(tr){
    var el = tr.querySelector('[data-field="employee_id"]');
    var v = el ? _normStr_(el.textContent || el.value) : '';
    if (v) exists.add(v);
  });

  // row template
  var tplRow =
    tbody.querySelector('tr[data-row-template="1"]') ||
    tbody.querySelector('tr[data-template="1"]') ||
    tbody.querySelector('tr');
  if (!tplRow) return { ok:false, message:'참여인력 테이블의 템플릿 행을 찾을 수 없습니다.' };

  // map employee by id
  var map = {};
  (pickData.employeeRows || []).forEach(function(e){
    var id = _normStr_(e && e.employee_id);
    if (id) map[id] = e;
  });

  var added = 0;

  selectedIds.forEach(function(eid){
    eid = _normStr_(eid);
    if (!eid || exists.has(eid)) return;

    // ✅ 미리보기 입력값(start/end/role) 가져오기(있으면)
    var prevTr = pickBodyHost.querySelector('tbody[data-pick-memin-tbody] tr[data-emp-id="'+_cssEscape_(eid)+'"]');
    var prevStart = prevTr ? _normStr_(prevTr.querySelector('[data-prev-start]')?.value) : '';
    var prevEnd   = prevTr ? _normStr_(prevTr.querySelector('[data-prev-end]')?.value) : '';
    var prevRole  = prevTr ? _normStr_(prevTr.querySelector('[data-prev-role]')?.value) : '';

    var e = map[eid] || {};
    var tr = tplRow.cloneNode(true);

    // 체크박스 해제
    var rowChk = tr.querySelector('input[type="checkbox"].chk-anim');
    if (rowChk) rowChk.checked = false;

    // hidden PK / project_id
    var pkEl = tr.querySelector('[data-field="member_in_id"]');
    if (pkEl) pkEl.value = '';
    var pidEl = tr.querySelector('[data-field="project_id"]');
    if (pidEl){
      var pidSrc = parentRoot.querySelector('[data-field="project_id"]');
      pidEl.value = pidSrc ? _normStr_(pidSrc.value || pidSrc.textContent) : '';
    }

    function setText_(field, val){
      var el = tr.querySelector('[data-field="'+field+'"]');
      if (!el) return;
      if (el.tagName && el.tagName.toLowerCase() === 'input') el.value = val;
      else el.textContent = val;
    }

    setText_('employee_id', eid);
    setText_('name', _normStr_(e.name));
    setText_('company', _normStr_(e.company));
    setText_('department', _normStr_(e.department));
    setText_('position', _normStr_(e.__pick_position_now));
    setText_('status', '');

    // 날짜/role은 비움
    var sEl = tr.querySelector('[data-field="start_date"]');
    if (sEl) sEl.value = prevStart;

    var eEl = tr.querySelector('[data-field="end_date"]');
    if (eEl) eEl.value = prevEnd;

    var rEl = tr.querySelector('[data-field="role"]');
    if (rEl) rEl.value = prevRole;

    tbody.appendChild(tr);

    // ✅ 저장 전에도 모달에서 확실히 "추가됨" 판정되도록 박제/캐시
    tr.setAttribute('data-emp-id', eid);
    parentRoot.__memberInEmpIdSet = parentRoot.__memberInEmpIdSet || new Set();
    parentRoot.__memberInEmpIdSet.add(eid);

    exists.add(eid);
    added += 1;
  });

  // ✅ parent 테이블 체크박스/행선택 유틸 재초기화(있을 때만)
  try { if (typeof initAnimatedCheckboxes === 'function') initAnimatedCheckboxes(table); } catch(e){}
  try { if (typeof initTableRowCheckboxes === 'function') initTableRowCheckboxes(table); } catch(e){}

  // ✅ UI 스코프 재초기화(툴팁/필터 등)
  try { if (typeof initUiScope === 'function') initUiScope(bodyHost); } catch(e){}

  // ✅ 상태 계산(있을 때만)
  try { if (typeof _updateMemberStatusInRoot_ === 'function') _updateMemberStatusInRoot_(parentRoot); } catch(e){}

  return { ok:true, added: added };
}

function _pickReadPlain_(el){
  if (!el) return '';
  var tag = (el.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return _normStr_(el.value);
  return _normStr_(el.textContent);
}

// ✅ 현재 화면의 Project_Member_In 테이블 + 캐시에서 employee_id Set 만들기
function _collectMemberInEmpIds_(parentRoot){
  var set = new Set();

  try{
    // 1) 화면에 보이는 Project_Member_In 테이블 DOM 기준
    var t = parentRoot && parentRoot.querySelector('table[data-entity="Project_Member_In"]');
    var tb = t ? t.querySelector('tbody') : null;
    if (tb){
      tb.querySelectorAll('tr').forEach(function(tr){
        // (a) 행 자체에 data-emp-id가 있으면 우선 사용
        var v = _normStr_(tr.getAttribute('data-emp-id'));
        if (!v){
          // (b) data-field="employee_id"에서 value/text 읽기
          var el = tr.querySelector('[data-field="employee_id"]');
          v = _pickReadPlain_(el);
        }
        // (c) 혹시 구조가 div 안에 text-tbl로 들어간 경우까지 보정
        if (!v){
          var el2 = tr.querySelector('[data-field="employee_id"] .text-tbl');
          v = _pickReadPlain_(el2);
        }
        if (v) set.add(v);
      });
    }

    // 2) (옵션) 저장 전 추가 캐시가 있으면 합산
    if (parentRoot && parentRoot.__memberInEmpIdSet){
      parentRoot.__memberInEmpIdSet.forEach(function(v){ if (v) set.add(v); });
    }
  }catch(e){}

  return set;
}

function _seedPickFromParent_(parentRoot, bodyHost, pickData){
  _ensurePickSelectedSet_(bodyHost);
  bodyHost.__pickSelectedEmpIds.clear();
  bodyHost.__pickSelectedOrder = [];
  bodyHost.__pickDraft = {};
  try{
    var table = parentRoot && parentRoot.querySelector('table[data-entity="Project_Member_In"]');
    var tbody = table ? table.querySelector('tbody') : null;
    if (!tbody) return;
    tbody.querySelectorAll('tr').forEach(function(tr){
      if (tr.getAttribute('data-empty-row') === '1') return;
      var eidEl = tr.querySelector('[data-field="employee_id"]');
      var eid = _normStr_(eidEl ? (eidEl.value || eidEl.textContent) : '');
      if (!eid) return;
      bodyHost.__pickSelectedEmpIds.add(eid);
      bodyHost.__pickSelectedOrder.push(eid);
      var sEl = tr.querySelector('[data-field="start_date"]');
      var eEl = tr.querySelector('[data-field="end_date"]');
      var rEl = tr.querySelector('[data-field="role"]');
      bodyHost.__pickDraft[eid] = {
        start_date: _normStr_(sEl ? sEl.value : ''),
        end_date:   _normStr_(eEl ? eEl.value : ''),
        role:       _normStr_(rEl ? rEl.value : '')
      };
    });
  }catch(e){}
  bodyHost.__pickExistingEmpIds = new Set(Array.from(bodyHost.__pickSelectedEmpIds));
}

function _applyPickMemberInToParent_(parentRoot, bodyHost, pickData){
  if (!parentRoot) return { ok:false, message:'parentRoot가 없습니다.' };
  var table = parentRoot.querySelector('table[data-entity="Project_Member_In"]');
  var tbody = table ? table.querySelector('tbody') : null;
  if (!table || !tbody) return { ok:false, message:'참여인력(Project_Member_In) 테이블을 찾을 수 없습니다.' };
  _ensurePickSelectedSet_(bodyHost);
  var set   = bodyHost.__pickSelectedEmpIds || new Set();
  var order = Array.isArray(bodyHost.__pickSelectedOrder) ? bodyHost.__pickSelectedOrder : [];
  var draft = bodyHost.__pickDraft || {};
  var ids = order.length ? order.filter(function(id){ return set.has(id); }) : Array.from(set);
  while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
  if (!ids.length){
    tbody.innerHTML =
      '<tr data-empty-row="1"><td colspan="10" style="opacity:.7; padding:1rem;">데이터가 없습니다.</td></tr>';
    return { ok:true, count:0 };
  }
  var tpl = document.getElementById('tpl-project-member-in-row');
  if (!tpl || !tpl.content) return { ok:false, message:'tpl-project-member-in-row 템플릿을 찾을 수 없습니다.' };
  var empMap = _getEmpMap_(pickData);
  var pidEl = parentRoot.querySelector('[data-field="project_id"]');
  var pid = pidEl ? _normStr_(pidEl.value || pidEl.textContent) : '';
  var added = 0;
  ids.forEach(function(eid){
    eid = _normStr_(eid);
    if (!eid) return;
    var emp = empMap[eid] || {};
    var d = draft[eid] || {};
    var tr = tpl.content.firstElementChild.cloneNode(true);
    tr.setAttribute('data-emp-id', eid);
    var cb = tr.querySelector('input[type="checkbox"].chk-anim');
    if (cb) cb.checked = false;
    var pkEl = tr.querySelector('[data-field="member_in_id"]');
    if (pkEl) pkEl.value = '';
    var pid2 = tr.querySelector('[data-field="project_id"]');
    if (pid2) pid2.value = pid;
    function setText_(field, val){
      var el = tr.querySelector('[data-field="'+field+'"]');
      if (!el) return;
      var tag = (el.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'select' || tag === 'textarea') el.value = (val == null ? '' : String(val));
      else el.textContent = (val == null ? '' : String(val));
    }
    setText_('employee_id', eid);
    setText_('name', _normStr_(emp.name));
    setText_('company', _normStr_(emp.company));
    setText_('department', _normStr_(emp.department));
    setText_('position', _normStr_(emp.__pick_position_now));
    setText_('start_date', _normStr_(d.start_date));
    setText_('end_date',   _normStr_(d.end_date));
    setText_('role',       _normStr_(d.role));
    var st = (typeof _calcMemberStatus_ === 'function') ? _calcMemberStatus_(d.start_date, d.end_date) : '';
    setText_('status', st);
    tbody.appendChild(tr);
    added += 1;
  });
  try { if (typeof initAnimatedCheckboxes === 'function') initAnimatedCheckboxes(table); } catch(e){}
  try { if (typeof initTableRowCheckboxes === 'function') initTableRowCheckboxes(table); } catch(e){}
  try { if (typeof _updateMemberStatusInRoot_ === 'function') _updateMemberStatusInRoot_(parentRoot); } catch(e){}
  return { ok:true, count: added };
}


function _initMemberInPickModal_(parentRoot, modalEl, bodyHost){
  var table = bodyHost.querySelector('table[data-pick-table="employee"]');
