  /* =========================================================
   * ✅ 목록 필터/요약(탭 프리로드 데이터 기반)
   * - 페이지 진입 시 1회 서버 로드(res)
   * - 필터 변경 시: 추가 서버 로드 없이 client-side 필터링 + 요약 갱신
   * ========================================================= */
  function _normStr_(s){ return String(s == null ? '' : s).trim(); }
  function _normLower_(s){ return _normStr_(s).toLowerCase(); }


// ✅ 날짜 비교 유틸 (YYYY-MM-DD → yyyymmdd 정수)
// - 문자열 비교 오류 방지
// - '2025-01-01 (수)' 같은 형태도 앞의 날짜만 파싱
function _ymdToInt_(s){
  s = String(s || '').trim();
  if (!s) return null;
  // 공백 제거(예: '2025. 01. 01')
  s = s.replace(/\s+/g,'');
  // 허용: YYYY-MM-DD, YYYY.MM.DD, YYYY/MM/DD, YYYYMMDD, 'YYYY-MM-DD(수)', 'YYYY-MM-DD00:00:00'
  var m = s.match(/^(\d{4})[.\-\/]?(\d{1,2})[.\-\/]?(\d{1,2})/);
  if (!m) return null;
  var y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  if (!(y >= 1000 && y <= 9999)) return null;
  if (mo < 1 || mo > 12) return null;
  if (d < 1 || d > 31) return null;
  return (y * 10000) + (mo * 100) + d;
}


  function _num_(v){
    if (v == null || v === '') return 0;
    if (typeof v === 'number' && isFinite(v)) return v;
    var s = String(v);
    // 1) 숫자/부호/소수점만 남기기
    s = s.replace(/[^0-9\-\.]/g, '');
    if (!s) return 0;
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  function _fmtInt_(n){
    n = Math.round(_num_(n));
    try { return n.toLocaleString('ko-KR'); } catch(e){ return String(n); }
  }

  function _fmtMoney_(n){
    return _fmtInt_(n) + '원';
  }

  function _fmtCount_(n, unit){
    return _fmtInt_(n) + (unit || '');
  }

  function _getFilterWrap_(pageRoot){
    return pageRoot ? pageRoot.querySelector('#project-filter-list .wrap-filter') : null;
  }

  function _collectSelectedMap_(wrap){
    var map = {};
    if (!wrap) return map;
    wrap.querySelectorAll('.wf-chip.is-active').forEach(function(chip){
      var k = chip.dataset.key || 'chip';
      var v = (chip.dataset.value || chip.textContent || '').trim();
      if (!k || !v) return;
      if (!map[k]) map[k] = {};
      map[k][v] = true;
    });
    return map;
  }

  function _rebuildChips_(panelEl, key, values, selectedMap, opt){
    if (!panelEl) return;
    var wrap = panelEl.querySelector('.wf-chips');
    if (!wrap) return;

    values = Array.isArray(values) ? values.slice() : [];
    values = values
      .map(function(v){ return _normStr_(v); })
      .filter(function(v){ return !!v; });

    // 중복 제거
    var seen = {};
    var uniq = [];
    values.forEach(function(v){
      if (seen[v]) return;
      seen[v] = true;
      uniq.push(v);
    });

    // 정렬
    if (opt && opt.sort === 'num') {
      uniq.sort(function(a,b){ return _num_(a) - _num_(b); });
    } else {
      uniq.sort(function(a,b){ return (a > b ? 1 : (a < b ? -1 : 0)); });
    }

    // 너무 많으면 컷(성능/UX)
    var limit = (opt && opt.limit) ? parseInt(opt.limit, 10) : 200;
    if (!isNaN(limit) && limit > 0 && uniq.length > limit) uniq = uniq.slice(0, limit);

    wrap.innerHTML = '';
    var frag = document.createDocumentFragment();
    uniq.forEach(function(v){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'wf-chip';
      btn.dataset.key = key;
      btn.dataset.value = v;

      // 표시 텍스트 가공
      if (opt && typeof opt.label === 'function') btn.textContent = opt.label(v);
      else btn.textContent = v;

      if (selectedMap && selectedMap[key] && selectedMap[key][v]) btn.classList.add('is-active');
      frag.appendChild(btn);
    });
    wrap.appendChild(frag);
  }

  function decorateDerivedFields_(data){
    data = data || {};

    // 예산/회계: 은행+계좌번호 조합
    (data.financeRows || []).forEach(function(r){
      if (!r) return;
      var bank = _normStr_(r.account_bank);
      var num  = _normStr_(r.account_number);
      var combo = (bank && num) ? (bank + ' ' + num) : (bank || num);
      r.account_combo = _normStr_(combo);
    });

    // 참여인력: 상태(UI 계산)
    var allM = []
      .concat(data.memberExRows || [])
      .concat(data.memberInRows || []);
    allM.forEach(function(r){
      if (!r) return;
      if (typeof _calcMemberStatus_ === 'function') {
        r.status = _calcMemberStatus_(r.start_date, r.end_date);
      }
    });

    // ✅ 참여인력(내부): 사번+성명 조합(필터칩/필터링용)
    (data.memberInRows || []).forEach(function(r){
      if (!r) return;
      var eid = _normStr_(r.employee_id);
      var nm  = _normStr_(r.name);
      r.employee_combo = _normStr_((eid + ' ' + nm).trim());
    });
  }

  function populateFilterOptionsFromData_(pageRoot, data){
    var wrap = _getFilterWrap_(pageRoot);
    if (!wrap) return;

    // 기존 선택 유지
    var selectedMap = _collectSelectedMap_(wrap);

    data = data || {};
    var pRows = data.projectRows || [];
    var fRows = data.financeRows || [];
    var mExRows = data.memberExRows || [];
    var mInRows = data.memberInRows || [];

    // 연도
    var years = pRows.map(function(p){ return _normStr_(p.year); }).filter(function(v){ return !!v; });
    _rebuildChips_(wrap.querySelector('.wf-panel[data-major="info"][data-sub="year"]'), 'year', years, selectedMap, {
      sort: 'num'
    });

    // 사업명
    var names = pRows.map(function(p){ return _normStr_(p.business_name); }).filter(function(v){ return !!v; });
    _rebuildChips_(wrap.querySelector('.wf-panel[data-major="info"][data-sub="name"]'), 'business_name', names, selectedMap, {
      limit: 200
    });

    // 예산/회계(중복제거 리스트업)
    _rebuildChips_(wrap.querySelector('.wf-panel[data-major="finance"][data-sub="source"]'), 'budget_source',
      fRows.map(function(r){ return r && r.budget_source; }), selectedMap, { limit: 200 });

    _rebuildChips_(wrap.querySelector('.wf-panel[data-major="finance"][data-sub="system"]'), 'budget_system',
      fRows.map(function(r){ return r && r.budget_system; }), selectedMap, { limit: 200 });

    _rebuildChips_(wrap.querySelector('.wf-panel[data-major="finance"][data-sub="accounting_name"]'), 'accounting_name',
      fRows.map(function(r){ return r && r.accounting_name; }), selectedMap, { limit: 200 });

    _rebuildChips_(wrap.querySelector('.wf-panel[data-major="finance"][data-sub="account"]'), 'account_combo',
      fRows.map(function(r){ return r && (r.account_combo || ((r.account_bank && r.account_number) ? (r.account_bank + ' ' + r.account_number) : (r.account_bank || r.account_number))); }), selectedMap, { limit: 200 });

    // 참여인력(중복제거 리스트업)
    var memberCompanies = (mExRows || []).map(function(r){ return r && r.company; });
    _rebuildChips_(wrap.querySelector('.wf-panel[data-major="member"][data-sub="company"]'), 'company',
      memberCompanies, selectedMap, { limit: 200 });

    var memberNames     = (mExRows || []).map(function(r){ return r && r.name; });
    _rebuildChips_(wrap.querySelector('.wf-panel[data-major="member"][data-sub="name"]'), 'name',
      memberNames, selectedMap, { limit: 200 });

    // ✅ 참여인력(내부): 사번+성명(employee_combo)
    var memberInCombos = (mInRows || []).map(function(r){ return r && r.employee_combo; });
    _rebuildChips_(wrap.querySelector('.wf-panel[data-major="member_in"][data-sub="employee"]'), 'employee_combo',
      memberInCombos, selectedMap, { limit: 200 });

    // ✅ indicator/wf-state 갱신(emitChange 유도)
    if (window.FilterWrap && typeof window.FilterWrap.setSub === 'function') {
      try {
        var st = wrap.__wfState || {};
        window.FilterWrap.setSub(wrap, st.sub || 'all');
      } catch(e){}
    }
  }

  function _mergeSelectedInto_(dst, src){
    Object.keys(src || {}).forEach(function(k){
      if (!dst[k]) dst[k] = [];
      (src[k] || []).forEach(function(v){
        v = _normStr_(v);
        if (!v) return;
        if (dst[k].indexOf(v) < 0) dst[k].push(v);
      });
    });
  }

  function _readCriteria_(pageRoot){
    var wrap = _getFilterWrap_(pageRoot);
    var out = {
      info:{}, finance:{}, program:{}, kpi:{},
      member:{},        // 외부 참여인력
      member_in:{},     // ✅ 내부 참여인력
      inputs:{ info:{}, finance:{}, program:{}, kpi:{}, member:{}, member_in:{} }
    };
    if (!wrap || !window.FilterWrap || typeof window.FilterWrap.getState !== 'function') return out;

    var st = window.FilterWrap.getState(wrap) || {};
    var byPanel = st.selectedByPanel || {};
    Object.keys(byPanel).forEach(function(k){
      var p = byPanel[k] || {};
      var m = p.major || 'info';
      if (!out[m]) out[m] = {};
      _mergeSelectedInto_(out[m], p.selected || {});

      // 입력값(data-wf-field)
      var inputs = p.inputs || {};
      if (!out.inputs[m]) out.inputs[m] = {};
      Object.keys(inputs).forEach(function(ik){
        var v = inputs[ik];
        if (v == null) return;
        var sv = _normStr_(v);
        if (!sv) return;
        out.inputs[m][ik] = sv;
      });
    });
    return out;
  }

  function _inSet_(v, arr){
    if (!arr || !arr.length) return true;
    v = _normStr_(v);
    return arr.indexOf(v) >= 0;
  }

  function _matchDateMin_(dateStr, fromStr){
    var d = _ymdToInt_(dateStr);
    if (d == null) return false;
    if (!fromStr) return true;
    var f = _ymdToInt_(fromStr);
    if (f == null) return true;
    return d >= f;
  }

  function _matchDateMax_(dateStr, toStr){
    var d = _ymdToInt_(dateStr);
    if (d == null) return false;
    if (!toStr) return true;
    var t = _ymdToInt_(toStr);
    if (t == null) return true;
    return d <= t;
  }

  function _rowMatches_(row, crit, inputCrit){
    row = row || {};
    crit = crit || {};

    // 선택(칩)
    var keys = Object.keys(crit);
    for (var i=0; i<keys.length; i++){
      var k = keys[i];
      if (!_inSet_(row[k], crit[k])) return false;
    }

    // 입력(data-wf-field) — 현재는 날짜 범위(start/end)만 지원
    inputCrit = inputCrit || {};
    if (inputCrit.start_date){
      if (!_matchDateMin_(row.start_date, inputCrit.start_date)) return false;
    }
    if (inputCrit.end_date){
      if (!_matchDateMax_(row.end_date, inputCrit.end_date)) return false;
    }
    return true;
  }

  function _filterRowsByPid_(rows, pidSet){
    rows = rows || [];
    var out = [];
    for (var i=0; i<rows.length; i++){
      var r = rows[i];
      var pid = _normStr_(r && r.project_id);
      if (pid && pidSet[pid]) out.push(r);
    }
    return out;
  }

  function applyFiltersAndRender_(pageRoot){
    var base = pageRoot.__projectDataBase;
    if (!base) return;

    var crit = _readCriteria_(pageRoot);

    // 1) 프로젝트(기본정보) 기준 필터
    var baseProjects = base.projectRows || [];
    var pidSet = {};
    var projects = [];
    for (var i=0; i<baseProjects.length; i++){
      var p = baseProjects[i] || {};
      if (!_rowMatches_(p, crit.info, crit.inputs.info)) continue;
      var pid = _normStr_(p.project_id);
      if (!pid) continue;
      pidSet[pid] = true;
      projects.push(p);
    }

    // 2) 하위탭 필터가 있으면 "해당 탭 row가 존재하는 프로젝트"로 교집합
    var financeRowsAll = _filterRowsByPid_(base.financeRows || [], pidSet);
    var programRowsAll = _filterRowsByPid_(base.programRows || [], pidSet);
    var kpiRowsAll     = _filterRowsByPid_(base.kpiRows || [], pidSet);

    // finance
    var financeRows = financeRowsAll;
    var financeHas = Object.keys(crit.finance || {}).length > 0;
    if (financeHas){
      financeRows = financeRowsAll.filter(function(r){ return _rowMatches_(r, crit.finance, crit.inputs.finance); });
      var pset2 = {};
      financeRows.forEach(function(r){ var pid=_normStr_(r && r.project_id); if(pid) pset2[pid]=true; });
      pidSet = pset2;
      projects = projects.filter(function(p){ return pidSet[_normStr_(p && p.project_id)]; });
      programRowsAll = _filterRowsByPid_(programRowsAll, pidSet);
      kpiRowsAll     = _filterRowsByPid_(kpiRowsAll, pidSet);
    }

    // program
    var programRows = programRowsAll;
    var programHas = Object.keys(crit.program || {}).length > 0;
    if (programHas){
      programRows = programRowsAll.filter(function(r){ return _rowMatches_(r, crit.program, crit.inputs.program); });
      var pset3 = {};
      programRows.forEach(function(r){ var pid=_normStr_(r && r.project_id); if(pid) pset3[pid]=true; });
      // 교집합
      var newSet = {};
      Object.keys(pidSet).forEach(function(pid){ if(pset3[pid]) newSet[pid]=true; });
      pidSet = newSet;
      projects = projects.filter(function(p){ return pidSet[_normStr_(p && p.project_id)]; });
      financeRowsAll = _filterRowsByPid_(financeRowsAll, pidSet);
      kpiRowsAll     = _filterRowsByPid_(kpiRowsAll, pidSet);
      if (!financeHas) financeRows = financeRowsAll; // finance 필터가 없으면 project 교집합 반영
    }

    // kpi
    var kpiRows = kpiRowsAll;
    var kpiHas = Object.keys(crit.kpi || {}).length > 0;
    if (kpiHas){
      kpiRows = kpiRowsAll.filter(function(r){ return _rowMatches_(r, crit.kpi, crit.inputs.kpi); });
      var pset4 = {};
      kpiRows.forEach(function(r){ var pid=_normStr_(r && r.project_id); if(pid) pset4[pid]=true; });
      var newSet2 = {};
      Object.keys(pidSet).forEach(function(pid){ if(pset4[pid]) newSet2[pid]=true; });
      pidSet = newSet2;
      projects = projects.filter(function(p){ return pidSet[_normStr_(p && p.project_id)]; });
      financeRowsAll = _filterRowsByPid_(financeRowsAll, pidSet);
      programRowsAll = _filterRowsByPid_(programRowsAll, pidSet);
      if (!financeHas) financeRows = financeRowsAll;
      if (!programHas) programRows = programRowsAll;
    }

    // 최종: 다른 탭들도 project 교집합 반영
    if (!financeHas) financeRows = financeRowsAll;
    if (!programHas) programRows = programRowsAll;
    if (!kpiHas)     kpiRows     = kpiRowsAll;

    // member (외부 참여인력 기준 필터)
    var memberExRowsAll = _filterRowsByPid_(base.memberExRows || [], pidSet);
    var memberInRowsAll = _filterRowsByPid_(base.memberInRows || [], pidSet);

    var memberExRows = memberExRowsAll;
    var memberInRows = memberInRowsAll;

    var memberHas = Object.keys(crit.member || {}).length > 0;
    if (memberHas){
      // 1) 외부 참여인력 row만 필터 조건 매칭
      var memberExRowsMatched = memberExRowsAll.filter(function(r){
        return _rowMatches_(r, crit.member, crit.inputs.member);
      });

      // 2) 매칭된 "외부 참여인력"이 존재하는 프로젝트만 남김
      var psetM = {};
      memberExRowsMatched.forEach(function(r){
        var pid = _normStr_(r && r.project_id);
        if (pid) psetM[pid] = true;
      });

      var newSetM = {};
      Object.keys(pidSet).forEach(function(pid){
        if (psetM[pid]) newSetM[pid] = true;
      });
      pidSet = newSetM;

      // 3) 교집합 적용: 프로젝트/다른 탭 데이터
      projects = projects.filter(function(p){ return pidSet[_normStr_(p && p.project_id)]; });

      financeRowsAll = _filterRowsByPid_(financeRowsAll, pidSet);
      programRowsAll = _filterRowsByPid_(programRowsAll, pidSet);
      kpiRowsAll     = _filterRowsByPid_(kpiRowsAll, pidSet);

      if (!financeHas) financeRows = financeRowsAll;
      if (!programHas) programRows = programRowsAll;
      if (!kpiHas)     kpiRows     = kpiRowsAll;

      // 4) 표시용 참여인력:
      // - 외부: "필터에 매칭된 row"만 + 교집합 프로젝트만
      memberExRows = _filterRowsByPid_(memberExRowsMatched, pidSet);
      // - 내부: "교집합 프로젝트"에 속한 row 전부 (조건 매칭 X)
      memberInRows = _filterRowsByPid_(memberInRowsAll, pidSet);
    }

    // ✅ member_in (내부 참여인력 기준 필터)
    var memberInHas = Object.keys(crit.member_in || {}).length > 0;
    if (memberInHas){
      // 1) 내부 참여인력 row만 필터 조건 매칭
      var memberInRowsMatched = memberInRowsAll.filter(function(r){
        return _rowMatches_(r, crit.member_in, crit.inputs.member_in);
      });

      // 2) 매칭된 "내부 참여인력"이 존재하는 프로젝트만 남김
      var psetMI = {};
      memberInRowsMatched.forEach(function(r){
        var pid = _normStr_(r && r.project_id);
        if (pid) psetMI[pid] = true;
      });

      var newSetMI = {};
      Object.keys(pidSet).forEach(function(pid){
        if (psetMI[pid]) newSetMI[pid] = true;
      });
      pidSet = newSetMI;

      // 3) 교집합 적용: 프로젝트/다른 탭 데이터
      projects = projects.filter(function(p){ return pidSet[_normStr_(p && p.project_id)]; });
      financeRowsAll = _filterRowsByPid_(financeRowsAll, pidSet);
      programRowsAll = _filterRowsByPid_(programRowsAll, pidSet);
      kpiRowsAll     = _filterRowsByPid_(kpiRowsAll, pidSet);

      if (!financeHas) financeRows = financeRowsAll;
      if (!programHas) programRows = programRowsAll;
      if (!kpiHas)     kpiRows     = kpiRowsAll;

      // 4) 표시용 참여인력:
      // - 내부: "필터 매칭 row"만
      memberInRows = _filterRowsByPid_(memberInRowsMatched, pidSet);
      // - 외부: 교집합 프로젝트의 row 전부(조건 매칭 X)  (이미 memberHas가 있으면 그 로직이 우선)
      if (!memberHas){
        memberExRows = _filterRowsByPid_(memberExRowsAll, pidSet);
      }
    }

    var opiRows = _filterRowsByPid_(base.opiRows || [], pidSet);
    // ✅ 외부(member) / 내부(member_in) 둘 다 필터가 없을 때만 참여인력 탭을 '전체'로 설정
    // 내부 필터만 켠 경우에도 여기서 덮어쓰지 않게 해야 참여인력(외부/내부) 2개 테이블이 함께 필터링됨
    var memberInHas = Object.keys(crit.member_in || {}).length > 0;
    if (!memberHas && !memberInHas){
     memberExRows = memberExRowsAll;
      memberInRows = memberInRowsAll;
    }

    // 3) 렌더
    renderProjectInfoList_(pageRoot, projects);
    renderProjectFinanceList_(pageRoot, financeRows);
    renderProjectProgramList_(pageRoot, programRows);
    renderProjectKpiList_(pageRoot, kpiRows);
    renderProjectOpiList_(pageRoot, opiRows);
    renderProjectMemberList_(pageRoot, memberExRows, memberInRows);

    // ✅ ACL(조회 버튼 등) - 동적 렌더 후 적용
    try{
      if (window.ACL_applyToScope) window.ACL_applyToScope(pageRoot);
    }catch(e){}

    // 4) 요약
    updateSummary_(pageRoot, {
      projectRows: projects,
      financeRows: financeRows,
      programRows: programRows,
      kpiRows: kpiRows,
      opiRows: opiRows,
      memberExRows: memberExRows,
      memberInRows: memberInRows
    });
  }

  function _sumBy_(rows, field){
    var s = 0;
    (rows || []).forEach(function(r){ s += _num_(r && r[field]); });
    return s;
  }

  function _countBy_(rows, field){
    var m = {};
    (rows || []).forEach(function(r){
      var k = _normStr_(r && r[field]);
      if (!k) return;
      m[k] = (m[k] || 0) + 1;
    });
    return m;
  }

  function _setGridValueByLabel_(grid, label, valueText){
    if (!grid) return;
    var items = grid.querySelectorAll('.sum-item');
    for (var i=0; i<items.length; i++){
      var it = items[i];
      var lb = it.querySelector('.sum-item-label');
      if (!lb) continue;
      if (_normStr_(lb.textContent) !== _normStr_(label)) continue;
      var val = it.querySelector('.sum-item-value');
      if (val) val.textContent = valueText;
      return;
    }
  }

  function updateSummary_(pageRoot, data){
    data = data || {};

    var projectRows   = data.projectRows   || [];
    var financeRows   = data.financeRows   || [];
    var programRows   = data.programRows   || [];
    var kpiRows       = data.kpiRows       || [];
    var opiRows       = data.opiRows       || [];
    var memberExRows  = data.memberExRows  || [];
    var memberInRows  = data.memberInRows  || [];

    // ========= helpers =========
    function _fmtCount_(n, unit){
      n = _num_(n);
      if (!n) return '-';
      return _fmtInt_(n) + (unit || '');
    }
    function _fmtMoney_(n){
      n = _num_(n);
      if (!n) return '-';
      return _fmtInt_(n) + '원';
    }

    function _findGridByContains_(sumRoot, tokens){
      tokens = (tokens || []).map(function(t){ return _normStr_(t); }).filter(Boolean);
      var grids = sumRoot.querySelectorAll('.sum-grid');
      for (var i=0; i<grids.length; i++){
        var t = grids[i].querySelector('.sum-title span');
        var title = _normStr_(t && t.textContent);
        if (!title) continue;

        var ok = true;
        for (var j=0; j<tokens.length; j++){
          if (title.indexOf(tokens[j]) < 0) { ok = false; break; }
        }
        if (ok) return grids[i];
      }
      return null;
    }

    function _fillCountGrid_(grid, totalLabel, totalValue, countMap, unit){
      if (!grid) return;
      var items = grid.querySelectorAll('.sum-item');
      for (var i=0; i<items.length; i++){
        var lb = items[i].querySelector('.sum-item-label');
        var label = _normStr_(lb && lb.textContent);
        if (!label) continue;

        if (label === totalLabel) _setGridValueByLabel_(grid, label, _fmtCount_(totalValue, unit));
        else _setGridValueByLabel_(grid, label, _fmtCount_((countMap && countMap[label]) || 0, unit));
      }
    }

    function _sumBudgetFromFinance_(rows){
      // rows: financeRows (filtered)
      var s = {
        total:0,
        grant:0, match_cash:0, match_spot:0,
        charge_cash:0, charge_spot:0,
        etc:0
      };

      (rows || []).forEach(function(r){
        var cat = _normStr_(r && r.budget_category);
        var amt = _num_(r && r.budget_amount);

        if (!amt) return;

        s.total += amt;

        if (cat === '보조금') s.grant += amt;
        else if (cat === '대응자금(현금)') s.match_cash += amt;
        else if (cat === '대응자금(현물)') s.match_spot += amt;
        else if (cat === '기업부담금(현금)') s.charge_cash += amt;
        else if (cat === '기업부담금(현물)') s.charge_spot += amt;
        else if (cat === '기타자금') s.etc += amt;
        else s.etc += amt; // 예외 카테고리는 기타로
      });

      s.grant_match = s.grant + s.match_cash + s.match_spot;
      return s;
    }

    function _fillBudgetMoneyGrid_(grid, budgetSum){
      if (!grid) return;

      _setGridValueByLabel_(grid, '총예산', _fmtMoney_(budgetSum.total));
      _setGridValueByLabel_(grid, '보조금+대응자금', _fmtMoney_(budgetSum.grant_match));
      _setGridValueByLabel_(grid, '보조금', _fmtMoney_(budgetSum.grant));
      _setGridValueByLabel_(grid, '대응자금(현금)', _fmtMoney_(budgetSum.match_cash));
      _setGridValueByLabel_(grid, '대응자금(현물)', _fmtMoney_(budgetSum.match_spot));
      _setGridValueByLabel_(grid, '기업부담금(현금)', _fmtMoney_(budgetSum.charge_cash));
      _setGridValueByLabel_(grid, '기업부담금(현물)', _fmtMoney_(budgetSum.charge_spot));
      _setGridValueByLabel_(grid, '기타자금', _fmtMoney_(budgetSum.etc));
    }

    function _uniqAccountsAgg_(rows){
      var map = {}; // key -> status
      (rows || []).forEach(function(r){
        var bank = _normStr_(r && r.account_bank);
        var num  = _normStr_(r && r.account_number);
        var key = (bank && num) ? (bank + '|' + num) : (bank || num);
        key = _normStr_(key);
        if (!key) return;

        map[key] = _normStr_(r && r.account_status);
      });

      var keys = Object.keys(map);
      var statusCnt = {};
      keys.forEach(function(k){
        var st = map[k] || '';
        if (!st) return;
        statusCnt[st] = (statusCnt[st] || 0) + 1;
      });

      return { total: keys.length, statusCnt: statusCnt };
    }

    function _opiSum_(rows, field){
      var s = 0;
      (rows || []).forEach(function(r){ s += _num_(r && r[field]); });
      return s;
    }

    function _normMemberStatus_(s){
      s = _normStr_(s);
      if (!s) return '';
      if (s === '예정') return '참여예정';
      if (s === '중' || s === '진행') return '참여중';
      if (s === '종료') return '참여종료';
      return s;
    }

    // ========= filter rows by visible projects =========
    var pidSet = {};
    (projectRows || []).forEach(function(p){
      var pid = _normStr_(p && p.project_id);
      if (pid) pidSet[pid] = true;
    });

    function _filterByPid_(rows){
      if (!rows || !rows.length) return [];
      // 프로젝트가 0개면 요약도 0으로 보는게 자연스러워서 빈 배열로 처리
      if (!Object.keys(pidSet).length) return [];
      return rows.filter(function(r){
        var pid = _normStr_(r && r.project_id);
        return !!pidSet[pid];
      });
    }

    var fRows  = _filterByPid_(financeRows);
    var prRows = _filterByPid_(programRows);
    var kRows  = _filterByPid_(kpiRows);
    var oRows  = _filterByPid_(opiRows);
    var meRows = _filterByPid_(memberExRows);
    var miRows = _filterByPid_(memberInRows);

    // ========= common aggregates =========
    var pTotal = (projectRows || []).length;
    var pNatureCnt = _countBy_(projectRows, 'nature');
    var pTypeCnt   = _countBy_(projectRows, 'type');
    var pProcCnt   = _countBy_(projectRows, 'process');

    var budgetSum = _sumBudgetFromFinance_(fRows);

    var finAccCatCnt = _countBy_(fRows, 'accounting_category');
    var accAgg = _uniqAccountsAgg_(fRows);

    var progTotal = prRows.length;
    var progCatCnt = _countBy_(prRows, 'category');
    var progNatureCnt = _countBy_(prRows, 'nature');

    var kpiTotal = kRows.length;
    var kpiCatCnt = _countBy_(kRows, 'category');

    // OPI 합계(프로젝트별 1행)
    var opi_support_total      = _opiSum_(oRows, 'support_total');
    var opi_support_prefounder = _opiSum_(oRows, 'support_prefounder');
    var opi_support_founder    = _opiSum_(oRows, 'support_founder');

    var opi_startup_new  = _opiSum_(oRows, 'startup_new');
    var opi_startup_ma   = _opiSum_(oRows, 'startup_m&a');

    var opi_rev_total    = _opiSum_(oRows, 'revenue_total');
    var opi_rev_dom      = _opiSum_(oRows, 'revenue_domestic');
    var opi_rev_ov       = _opiSum_(oRows, 'revenue_overseas');

    var opi_emp_total    = _opiSum_(oRows, 'employment_total');
    var opi_emp_exist    = _opiSum_(oRows, 'employment_exist');
    var opi_emp_new      = _opiSum_(oRows, 'employment_new');

    var opi_inv_cnt      = _opiSum_(oRows, 'investment_count');
    var opi_inv_amt      = _opiSum_(oRows, 'investment_amount');

    // IP
    var ip = {
      domestic_app: _opiSum_(oRows, 'ip_domestic_app'),
      domestic_app_p: _opiSum_(oRows, 'ip_domestic_app_pantent'),
      domestic_app_u: _opiSum_(oRows, 'ip_domestic_app_utility'),
      domestic_app_t: _opiSum_(oRows, 'ip_domestic_app_trademark'),
      domestic_app_d: _opiSum_(oRows, 'ip_domestic_app_design'),

      domestic_reg: _opiSum_(oRows, 'ip_domestic_reg'),
      domestic_reg_p: _opiSum_(oRows, 'ip_domestic_reg_pantent'),
      domestic_reg_u: _opiSum_(oRows, 'ip_domestic_reg_utility'),
      domestic_reg_t: _opiSum_(oRows, 'ip_domestic_reg_trademark'),
      domestic_reg_d: _opiSum_(oRows, 'ip_domestic_reg_design'),
      domestic_reg_c: _opiSum_(oRows, 'ip_domestic_reg_copyright'),

      pct: _opiSum_(oRows, 'ip_pct'),
      pct_p: _opiSum_(oRows, 'ip_pct_pantent'),

      overseas_app: _opiSum_(oRows, 'ip_overseas_app'),
      overseas_app_p: _opiSum_(oRows, 'ip_overseas_app_pantent'),
      overseas_app_u: _opiSum_(oRows, 'ip_overseas_app_utility'),
      overseas_app_t: _opiSum_(oRows, 'ip_overseas_app_trademark'),
      overseas_app_d: _opiSum_(oRows, 'ip_overseas_app_design'),
      overseas_app_c: _opiSum_(oRows, 'ip_overseas_app_copyright'),

      overseas_reg: _opiSum_(oRows, 'ip_overseas_reg'),
      overseas_reg_p: _opiSum_(oRows, 'ip_overseas_reg_pantent'),
      overseas_reg_u: _opiSum_(oRows, 'ip_overseas_reg_utility'),
      overseas_reg_t: _opiSum_(oRows, 'ip_overseas_reg_trademark'),
      overseas_reg_d: _opiSum_(oRows, 'ip_overseas_reg_design'),
      overseas_reg_c: _opiSum_(oRows, 'ip_overseas_reg_copyright')
    };

    // Members
    var memTotal = meRows.length + miRows.length;
    var memAgencyCnt = _countBy_(meRows, 'agency_category');
    memAgencyCnt['전담조직'] = (memAgencyCnt['전담조직'] || 0) + miRows.length;

    var memStatusCnt = {};
    (meRows || []).concat(miRows || []).forEach(function(r){
      var st = _normMemberStatus_(r && r.status);
      if (!st) return;
      memStatusCnt[st] = (memStatusCnt[st] || 0) + 1;
    });

    // ========= dispatch per tab wrap-sum =========
    var sumRoots = pageRoot.querySelectorAll('.wrap-sum');
    if (!sumRoots || !sumRoots.length) return;

    sumRoots.forEach(function(sumRoot){
      var panel = sumRoot.closest('.sec-panel');
      var key = panel ? _normStr_(panel.getAttribute('data-panel')) : '';

      // 공통: 예산금액 grid는 기본정보/예산탭 둘 다 있음
      function _updateBudgetGridInThisRoot_(){
        var g = _findGridByContains_(sumRoot, ['프로젝트', '예산']);
        if (g) _fillBudgetMoneyGrid_(g, budgetSum);
      }

      if (key === 'project-info-list'){
        // 프로젝트 성격
        _fillCountGrid_(_findGridByContains_(sumRoot, ['프로젝트', '성격']), '프로젝트', pTotal, pNatureCnt, '개');
        // 프로젝트 운영방식/수행단계: 합쳐진 1개 sum-grid를 row 단위로 채움
        var gTypeProc = _findGridByContains_(sumRoot, ['운영방식', '수행단계']);
        if (gTypeProc){
          var rowsTP = gTypeProc.querySelectorAll('.sum-row');

          // 1번째 row = 운영방식
          if (rowsTP[0]) _fillCountGrid_(rowsTP[0], '프로젝트', pTotal, pTypeCnt, '개');

          // 2번째 row = 수행단계
          if (rowsTP[1]) _fillCountGrid_(rowsTP[1], '프로젝트', pTotal, pProcCnt, '개');
        }

        _updateBudgetGridInThisRoot_();
        return;
      }

      if (key === 'project-finance-list'){
        _updateBudgetGridInThisRoot_();

        // 예산수(회계구분)
        _fillCountGrid_(_findGridByContains_(sumRoot, ['회계구분']), '예산', fRows.length, finAccCatCnt, '개');

        // 계좌수(상태)
        var gAcc = _findGridByContains_(sumRoot, ['계좌상태']);
        if (gAcc){
          _setGridValueByLabel_(gAcc, '계좌', _fmtCount_(accAgg.total, '개'));
          var items = gAcc.querySelectorAll('.sum-item');
          for (var i=0; i<items.length; i++){
            var lb = items[i].querySelector('.sum-item-label');
            var label = _normStr_(lb && lb.textContent);
            if (!label || label === '계좌') continue;
            _setGridValueByLabel_(gAcc, label, _fmtCount_((accAgg.statusCnt[label] || 0), '개'));
          }
        }
        return;
      }

      if (key === 'project-program-list'){
        _fillCountGrid_(_findGridByContains_(sumRoot, ['프로그램', '구분']), '프로그램', progTotal, progCatCnt, '개');
        _fillCountGrid_(_findGridByContains_(sumRoot, ['프로그램', '성격']), '프로그램', progTotal, progNatureCnt, '개');
        return;
      }

      if (key === 'project-kpi-list'){
        _fillCountGrid_(_findGridByContains_(sumRoot, ['핵심성과', '구분']), '핵심성과', kpiTotal, kpiCatCnt, '개');
        return;
      }

      if (key === 'project-opi-list'){
        // 창업지원
        var gSup = _findGridByContains_(sumRoot, ['창업지원']);
        if (gSup){
          _setGridValueByLabel_(gSup, '지원', _fmtCount_(opi_support_total, '명'));
          _setGridValueByLabel_(gSup, '예비창업자', _fmtCount_(opi_support_prefounder, '명'));
          _setGridValueByLabel_(gSup, '기창업자', _fmtCount_(opi_support_founder, '명'));
        }

        // 신규창업/M&A
        var gSt = _findGridByContains_(sumRoot, ['창업지원']);
        if (gSt){
          _setGridValueByLabel_(gSt, '신규창업', _fmtCount_(opi_startup_new, '개'));
          _setGridValueByLabel_(gSt, 'M&A', _fmtCount_(opi_startup_ma, '개'));
        }

        // 매출
        var gRev = _findGridByContains_(sumRoot, ['매출']);
        if (gRev){
          _setGridValueByLabel_(gRev, '매출', _fmtMoney_(opi_rev_total));
          _setGridValueByLabel_(gRev, '국내매출', _fmtMoney_(opi_rev_dom));
          _setGridValueByLabel_(gRev, '수출(해외매출)', _fmtMoney_(opi_rev_ov));
        }

        // 고용
        var gEmp = _findGridByContains_(sumRoot, ['고용']);
        if (gEmp){
          _setGridValueByLabel_(gEmp, '고용', _fmtCount_(opi_emp_total, '명'));
          _setGridValueByLabel_(gEmp, '기존고용', _fmtCount_(opi_emp_exist, '명'));
          _setGridValueByLabel_(gEmp, '신규고용', _fmtCount_(opi_emp_new, '명'));
        }

        // 투자
        var gInv = _findGridByContains_(sumRoot, ['투자']);
        if (gInv){
          _setGridValueByLabel_(gInv, '투자유치수', _fmtCount_(opi_inv_cnt, '개'));
          _setGridValueByLabel_(gInv, '투자유치액', _fmtMoney_(opi_inv_amt));
        }

        // 지식재산권 (라벨 중복 -> sum-row 인덱스로 세팅)
        var gIp = _findGridByContains_(sumRoot, ['지식재산권']);
        if (gIp){
          var rows = gIp.querySelectorAll('.sum-row');

          function _setRow_(rowIdx, values){
            if (!rows[rowIdx]) return;
            var items = rows[rowIdx].querySelectorAll('.sum-item');
            for (var i=0; i<items.length && i<values.length; i++){
              var vEl = items[i].querySelector('.sum-item-value');
              if (vEl) vEl.textContent = _fmtCount_(values[i], '개');
            }
          }

          // [0] 국내출원: total, 특허, 실용, 상표, 디자인
          _setRow_(0, [ip.domestic_app, ip.domestic_app_p, ip.domestic_app_u, ip.domestic_app_t, ip.domestic_app_d]);

          // [1] 국내등록: total, 특허, 실용, 상표, 디자인, 저작권
          _setRow_(1, [ip.domestic_reg, ip.domestic_reg_p, ip.domestic_reg_u, ip.domestic_reg_t, ip.domestic_reg_d, ip.domestic_reg_c]);

          // [2] PCT국제출원: total, 특허
          _setRow_(2, [ip.pct, ip.pct_p]);

          // [3] 해외출원: total, 특허, 실용, 상표, 디자인, 저작권
          _setRow_(3, [ip.overseas_app, ip.overseas_app_p, ip.overseas_app_u, ip.overseas_app_t, ip.overseas_app_d, ip.overseas_app_c]);

          // [4] 해외등록: total, 특허, 실용, 상표, 디자인, 저작권
          _setRow_(4, [ip.overseas_reg, ip.overseas_reg_p, ip.overseas_reg_u, ip.overseas_reg_t, ip.overseas_reg_d, ip.overseas_reg_c]);
        }

        return;
      }

      if (key === 'project-member-list'){
        // 운영기관 기준
        var gOrg = _findGridByContains_(sumRoot, ['운영기관']);
        if (gOrg){
          _setGridValueByLabel_(gOrg, '참여인력', _fmtCount_(memTotal, '명'));
          _setGridValueByLabel_(gOrg, '총괄기관', _fmtCount_((memAgencyCnt['총괄기관'] || 0), '명'));
          _setGridValueByLabel_(gOrg, '전담기관', _fmtCount_((memAgencyCnt['전담기관'] || 0), '명'));
          _setGridValueByLabel_(gOrg, '주관기관', _fmtCount_((memAgencyCnt['주관기관'] || 0), '명'));
          _setGridValueByLabel_(gOrg, '전담조직', _fmtCount_((memAgencyCnt['전담조직'] || 0), '명'));
        }

        // 참여상태 기준
        var gSt2 = _findGridByContains_(sumRoot, ['참여상태']);
        if (gSt2){
          _setGridValueByLabel_(gSt2, '참여인력', _fmtCount_(memTotal, '명'));
          _setGridValueByLabel_(gSt2, '참여예정', _fmtCount_((memStatusCnt['참여예정'] || 0), '명'));
          _setGridValueByLabel_(gSt2, '참여중', _fmtCount_((memStatusCnt['참여중'] || 0), '명'));
          _setGridValueByLabel_(gSt2, '참여종료', _fmtCount_((memStatusCnt['참여종료'] || 0), '명'));
        }

        return;
      }
    });
  }



  function loadProjectTabs_(pageRoot){
    var hasGAS = (typeof google !== 'undefined' && google.script && google.script.run);
    if (!hasGAS) {
      console.warn('google.script.run 없음(웹앱에서 실행 필요)');
      return;
    }

    google.script.run
      .withSuccessHandler(function(res){
        res = res || { ok:false, message:'PROJECT_listTabs 응답이 없습니다.' };
        if (!res.ok){
          showAlertError(res.message || '목록 조회 실패', '오류');
          return;
        }

        // ✅ 파생필드(계좌 조합/참여인력 상태) 계산
        if (typeof decorateDerivedFields_ === 'function') {
          try { decorateDerivedFields_(res); } catch(e){}
        }

        // ✅ 탭 프리로드 데이터 저장 → 필터/요약/탭렌더는 여기서 모두 처리
        pageRoot.__projectDataBase = res;
        populateFilterOptionsFromData_(pageRoot, res);
        applyFiltersAndRender_(pageRoot);
      })
      .withFailureHandler(function(err){
        showAlertError((err && err.message) ? err.message : String(err), '목록 조회 실패');
      })
      .PROJECT_listTabs({ page:1, pageSize:200 });
  }

  // ✅ index.html에서 호출할 init
  function Project_init(scope){
    var container = scope || document;
    var pageRoot = container.querySelector('.page-root');
    if (!pageRoot) return;
    if (pageRoot.__projectInited) return;
    pageRoot.__projectInited = true;

    // 보기 버튼(돋보기) → 상세 모달
    pageRoot.addEventListener('click', function(e){
      var btn = e.target.closest('button[data-action="view-project"]');
      if (!btn) return;
      var pid = (btn.dataset.projectId || '').trim();
      if (!pid) return;
      if (typeof window.projectDetailPageModal === 'function') {
        window.projectDetailPageModal(pid);
      }
    });

    // 외부(저장 성공 후)에서 재로드 할 수 있게 노출
    window.Project_reloadList = function(){ loadProjectTabs_(pageRoot); };

    // ✅ 필터 변경 → 서버 추가호출 없이 즉시 목록/요약 갱신
    var filterWrap = _getFilterWrap_(pageRoot);
    if (filterWrap && !filterWrap.__pjtFilterBound){
      filterWrap.__pjtFilterBound = true;
      var t = null;
      filterWrap.addEventListener('filterwrap:change', function(){
        if (t) clearTimeout(t);
        t = setTimeout(function(){
          if (!pageRoot.__projectDataBase) return;
          applyFiltersAndRender_(pageRoot);
        }, 120);
      });
    }

    loadProjectTabs_(pageRoot);
  }

  window.Project_init = Project_init;
})();
</script>
