<style>
  #dashboard-root .page-body { gap: 0.5rem; }
  .dash-filter-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(120px, 1fr));
    gap: 0.5rem;
    align-items: end;
  }
  .dash-kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0.5rem;
  }
  .dash-kpi-item {
    border: var(--bd-size) var(--bd-color-wrap);
    border-radius: var(--bd-radius);
    background: var(--bg-color-accent);
    padding: 0.5rem 0.6rem;
  }
  .dash-kpi-label { font-size: var(--t-size1); color: var(--t-color-1); font-weight: var(--t-weight2); }
  .dash-kpi-value { margin-top: 0.2rem; font-size: var(--t-size3); font-weight: var(--t-weight3); color: var(--t-color-on); }
  .dash-kpi-sub { margin-top: 0.15rem; font-size: var(--t-size); color: var(--t-color-1); }

  .dash-grid-2 {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 0.5rem;
    min-height: 0;
  }
  .dash-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.5rem;
    min-height: 0;
  }
  .dash-stack-wrap {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.35rem;
    border: var(--bd-size) var(--bd-color-wrap);
    border-radius: var(--bd-radius);
    background: var(--bg-color-accent);
    padding: 0.5rem;
  }
  .dash-stack-row { display: flex; align-items: center; gap: 0.45rem; }
  .dash-stack-label { flex: 0 0 130px; font-size: var(--t-size1); font-weight: var(--t-weight2); color: var(--t-color); }
  .dash-stack-bar {
    flex: 1 1 auto;
    height: 10px;
    background: #d8e3eb;
    border-radius: 999px;
    overflow: hidden;
  }
  .dash-stack-fill { height: 100%; border-radius: 999px; }
  .dash-stack-value { flex: 0 0 96px; text-align: right; font-size: var(--t-size1); font-weight: var(--t-weight2); color: var(--t-color-1); }
  .dash-calendar {
    border: var(--bd-size) var(--bd-color-wrap);
    border-radius: var(--bd-radius);
    background: var(--bg-color-accent);
    padding: 0.5rem;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 0.25rem;
  }
  .dash-cal-cell {
    border-radius: var(--bd-radius-1);
    min-height: 50px;
    background: rgba(255,255,255,0.72);
    border: 1px solid rgba(173,181,189,0.55);
    padding: 0.2rem 0.3rem;
    font-size: var(--t-size);
    color: var(--t-color-1);
  }
  .dash-cal-cell.is-head {
    min-height: auto;
    text-align: center;
    font-weight: var(--t-weight2);
    background: #edf5fb;
  }
  .dash-tag {
    display: inline-block;
    padding: 0.05rem 0.4rem;
    border-radius: 999px;
    font-size: var(--t-size-1);
    font-weight: var(--t-weight2);
    background: rgba(42,143,155,0.15);
    color: var(--accent-color-2);
  }

  @media (max-width: 1280px) {
    .dash-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dash-grid-2 { grid-template-columns: 1fr; }
    .dash-grid-3 { grid-template-columns: 1fr; }
    .dash-filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>

<script>
  function Dashboard_init(scope) {
    var root = scope && scope.querySelector ? scope.querySelector('#dashboard-root') : document.getElementById('dashboard-root');
    if (!root) return;

    var modeEl = root.querySelector('#dash-view-mode');
    var yearEl = root.querySelector('#dash-year');
    var monthEl = root.querySelector('#dash-month');
    var baseDateEl = root.querySelector('#dash-base-date');
    if (!modeEl || !yearEl || !monthEl || !baseDateEl) return;

    var now = new Date();
    var thisYear = now.getFullYear();
    var thisMonth = now.getMonth() + 1;

    yearEl.innerHTML = '';
    for (var y = thisYear - 3; y <= thisYear + 1; y++) {
      var yOpt = document.createElement('option');
      yOpt.value = String(y);
      yOpt.textContent = String(y) + '년';
      if (y === thisYear) yOpt.selected = true;
      yearEl.appendChild(yOpt);
    }

    monthEl.innerHTML = '';
    var allOpt = document.createElement('option');
    allOpt.value = 'all';
    allOpt.textContent = '전체';
    monthEl.appendChild(allOpt);
    for (var m = 1; m <= 12; m++) {
      var mOpt = document.createElement('option');
      mOpt.value = String(m);
      mOpt.textContent = String(m) + '월';
      if (m === thisMonth) mOpt.selected = true;
      monthEl.appendChild(mOpt);
    }

    function getLastDay(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function setBaseDate() {
      var mode = modeEl.value;
      var y = Number(yearEl.value);
      var mRaw = monthEl.value;
      var m = mRaw === 'all' ? null : Number(mRaw);
      var dateText = '';

      if (mode === 'year') {
        dateText = String(y) + '-12-31';
      } else {
        if (!m) {
          m = thisMonth;
          monthEl.value = String(m);
        }
        var d = getLastDay(y, m);
        var mm = m < 10 ? '0' + m : String(m);
        var dd = d < 10 ? '0' + d : String(d);
        dateText = String(y) + '-' + mm + '-' + dd;
      }
      baseDateEl.value = dateText;
      monthEl.disabled = (mode === 'year');
    }

    modeEl.addEventListener('change', setBaseDate);
    yearEl.addEventListener('change', setBaseDate);
    monthEl.addEventListener('change', setBaseDate);
    setBaseDate();
  }
</script>
