// ======================================================
// ✅ 테이블과 동일한 필터를 요약에도 적용하기 위한 공통 함수
function getFilteredLeaveApplyRows_(srcRows){
  var rows = Array.isArray(srcRows) ? srcRows.slice() : [];

  // ✅ 어떤 스코프에서 호출되든 동작하도록 전역 루트를 기준으로 읽는다
  var rootEl = window._leaveRoot || document.getElementById('leave-root') || document;

  // 1) 직원필터
  var selEmpId = '';
  try{
    if (rootEl && rootEl.__leaveSelectedEmp && rootEl.__leaveSelectedEmp.employee_id){
      selEmpId = String(rootEl.__leaveSelectedEmp.employee_id).trim();
    }else if (window._leaveSelectedEmp && window._leaveSelectedEmp.employee_id){
      selEmpId = String(window._leaveSelectedEmp.employee_id).trim();
    }
  }catch(e){}
  if (selEmpId){
    rows = rows.filter(function(r){ return String((r && r.employee_id) || '').trim() === selEmpId; });
  }

  // 2) 상태필터(전체/신청/승인/미승인)
  var stat = '전체';
  try{
    var sel = rootEl.querySelector ? rootEl.querySelector('[data-leave-info-status-filter]') : null;
    stat = sel ? String(sel.value || '전체').trim() : '전체';
  }catch(e){}
  if (stat && stat !== '전체'){
    rows = rows.filter(function(r){ return String((r && r.status) || '').trim() === stat; });
  }

  return rows;
}

function parseUsageToMinutes_(daysTxt){
  daysTxt = String(daysTxt || '').trim();
  var md = daysTxt.match(/(\d+)\s*일/);
  var mh = daysTxt.match(/(\d+)\s*시간/);
  var d = md ? Number(md[1]) : 0;
  var h = mh ? Number(mh[1]) : 0;
  if (!isFinite(d)) d = 0;
  if (!isFinite(h)) h = 0;
  // 1일 = 8시간 기준
  return (d * 8 * 60) + (h * 60);
}
function fmtMinutesToDayHour_(mins){
  mins = Math.max(0, Math.floor(mins || 0));
  var dayMin = 8 * 60;
  var d = Math.floor(mins / dayMin);
  var h = Math.floor((mins % dayMin) / 60);
  // ✅ 표시 규칙:
  // - 0일 0시간 => '-'
  // - 10일 0시간 => '10일'
  // - 0일 3시간 => '3시간'
  // - 10일 3시간 => '10일 3시간'
  if (d === 0 && h === 0) return '-';
  if (h === 0) return d + '일';
  if (d === 0) return h + '시간';
  return d + '일 ' + h + '시간';
}
function setSum_(key, txt){
  try{
    var rootEl = window._leaveRoot || document;
    var el = rootEl.querySelector('[data-leave-sum="' + key + '"]');
    if (el) el.textContent = String(txt == null ? '' : txt);
  }catch(e){}
}
function updateLeaveSummary_(){
  var __rootEl = window._leaveRoot || document.getElementById('leave-root') || document;
  if (window._leaveMainBatchLoading || (!!__rootEl && __rootEl.__leaveMainBatchLoading === true)){
    window._leaveSummaryDirty = true;
    return;
  }
  try{ syncGrantUnofficialDaysFromCache_(); }catch(e){}
  // ✅ 테이블과 동일한 필터(직원 + 상태) 적용
  var rows = getFilteredLeaveApplyRows_(_leaveApplyAll);
  // ✅ 직원 선택 시 요약카드도 해당 직원 기준으로 집계
  try{
    var selEmpId = root && root.__leaveSelectedEmp ? String(root.__leaveSelectedEmp.employee_id || '').trim() : '';
    if (selEmpId){
      rows = rows.filter(function(r){ return String((r && r.employee_id) || '').trim() === selEmpId; });
    }
  }catch(e){}
  var reqMin = 0, apprMin = 0;
  var cReq = 0, cAppr = 0, cRej = 0;
  rows.forEach(function(r){
    var st = String((r && r.status) || '').trim();
    var m = parseUsageToMinutes_(r ? r.days : '');
    if (st === '신청'){ reqMin += m; cReq++; }
    else if (st === '승인'){ apprMin += m; cAppr++; }
    else if (st === '미승인'){ cRej++; }
  });
  var grantMin = (Number(_grantUnofficialDays) || 0) * 8 * 60;
  var remainMin = grantMin - apprMin;
  // ✅ 발생연차: 'N일'만 표시(시간 없음)
  var g = Number(_grantUnofficialDays) || 0;
  setSum_('grant', (g ? (g + '일') : '0일'));
  setSum_('used_req', fmtMinutesToDayHour_(reqMin));
  setSum_('used_appr', fmtMinutesToDayHour_(apprMin));
  setSum_('remain', fmtMinutesToDayHour_(remainMin));
  // ✅ 건수: 0건이면 '-'
  setSum_('cnt_req',  cReq  ? (cReq  + '건') : '-');
  setSum_('cnt_appr', cAppr ? (cAppr + '건') : '-');
  setSum_('cnt_rej',  cRej  ? (cRej  + '건') : '-');
}

function syncGrantUnofficialDaysFromCache_(){
  // ✅ 현재 선택 연도는 DOM(select)에서 읽는다 (파일 구조: [data-leave-year-select])
  var rootEl = window._leaveRoot || document.getElementById('leave-root') || document;
  var yearLabel = '';
  try{
    var ys = rootEl.querySelector ? rootEl.querySelector('[data-leave-year-select]') : null;
    yearLabel = ys ? String(ys.value || '').trim() : '';
  }catch(e){}
  // (fallback) 혹시 기존 전역 변수가 있으면 그걸 사용
  if (!yearLabel){
    try{ yearLabel = (typeof _leaveApplyYear !== 'undefined' && _leaveApplyYear) ? String(_leaveApplyYear).trim() : ''; }catch(e){}
  }
  // 캐시가 현재 연도랑 다르면(아직 로드 안됨) 우선 0 처리
  if (!yearLabel || String(window._leaveGrantYear||'') !== String(yearLabel||'')){
    _grantUnofficialDays = 0;
    window._grantUnofficialDays = _grantUnofficialDays;
    return;
  }

  var eid = '';
  try{ eid = (typeof getSelectedEmpId_ === 'function') ? getSelectedEmpId_() : ''; }catch(e){}
  if (eid){
    _grantUnofficialDays = Number((window._leaveGrantMap||{})[eid] || 0) || 0;
  }else{
    _grantUnofficialDays = Number(window._leaveGrantTotal || 0) || 0;

// ✅ 연도별 Leave(발생연차) 캐시 로드: 연도당 1회만 서버 호출
function loadGrantCacheForYear_(yearLabel){
  yearLabel = String(yearLabel || '').trim();
  var y = parseYearNum_(yearLabel);
  if (!isFinite(y)){
    window._leaveGrantYear = '';
    window._leaveGrantMap = {};
    window._leaveGrantTotal = 0;
    syncGrantUnofficialDaysFromCache_();
    updateLeaveSummary_();
    return;
  }

  // 이미 같은 연도 캐시가 있으면 즉시 동기화
  if (String(window._leaveGrantYear||'') === yearLabel && window._leaveGrantMap){
    syncGrantUnofficialDaysFromCache_();
    updateLeaveSummary_();
    return;
  }

  // 캐시 초기화(로딩 중)
  window._leaveGrantYear = yearLabel;
  window._leaveGrantMap = {};
  window._leaveGrantTotal = 0;
  syncGrantUnofficialDaysFromCache_();
  updateLeaveSummary_();

  google.script.run
    .withSuccessHandler(function(res){
      var ok = !!(res && (res.ok === true || res.success === true));
      if (!ok){
        window._leaveGrantMap = {};
        window._leaveGrantTotal = 0;
        syncGrantUnofficialDaysFromCache_();
        updateLeaveSummary_();
        return;
      }
      var map = {};
      var total = 0;
      (res.rows || []).forEach(function(r){
        var eid = String((r && r.employee_id) || '').trim();
        if (!eid) return;
        var n = Number((r && r.unofficial_days) || 0) || 0;
        map[eid] = n;
        total += n;
      });
      // 백엔드가 total을 주면 그걸 우선
      if (res.total_unofficial_days != null){
        var t = Number(res.total_unofficial_days);
        if (isFinite(t)) total = t;
      }
      window._leaveGrantMap = map;
      window._leaveGrantTotal = total;
      syncGrantUnofficialDaysFromCache_();
      updateLeaveSummary_();
    })
    .withFailureHandler(function(){
      window._leaveGrantMap = {};
      window._leaveGrantTotal = 0;
      syncGrantUnofficialDaysFromCache_();
      updateLeaveSummary_();
    })
    .LEAVE_listLeaveGrantsByYear(_leaveToWire_({ year: yearLabel }));
}

// (호환) 기존 호출명 유지: 이제는 캐시 기반으로 즉시 동기화만 수행
function loadGrantUnofficialDaysForYear_(yearLabel){
  loadGrantCacheForYear_(yearLabel);       // ✅ 연도당 1회 서버 호출
  syncGrantUnofficialDaysFromCache_();     // ✅ 직원 클릭 시 즉시 반영
  updateLeaveSummary_();
}

function uiHide(el){
  if(!el) return;
  el.style.setProperty('display', 'none', 'important');
}
function uiShow(el){
  if(!el) return;
  // 다시 보이게 할 땐 display를 지워서(d-flex의 flex가 살아나게)
  el.style.removeProperty('display');
}
</script>
