<template id="leave-apply-page-modal">
  <div class="d-flex flex-column gap-2" data-leave-apply-root>
    <div class="d-flex align-items-center" style="font-size: var(--t-size1); font-weight: var(--t-weight2);">
      <div style="color: var(--accent-color)">연차신청직원&nbsp;:&ensp;</div>
      <div style="color: var(--accent-color)">00000 가나다</div>
    </div>

    <div class="d-flex align-items-center gap-1">
      <div class="inputgroup1">
        <select data-la-type>
          <option value=""></option>
          <option value="일">일</option>
          <option value="시간">시간</option>
        </select>
        <label>연차구분</label>
      </div>
      <div class="inputgroup1">
        <input type="text" class="input-date" autocomplete="off" data-la-date disabled>
        <label>일자</label>
      </div>
      <div class="inputgroup1">
        <input type="text" class="input-time" autocomplete="off" data-la-start disabled>
        <label>시작시간</label>
      </div>
      <div class="inputgroup1">
        <input type="text" class="input-time" autocomplete="off" data-la-end disabled>
        <label>종료시간</label>
      </div>
      <div class="inputgroup1">
        <input type="text" data-la-usage disabled>
        <label>사용일수</label>
      </div>
    </div>
  </div>
</template>


<script>
  // =========================================================
  // ✅ google.script.run payload 안전화
  // - Apps Script iFrame 런타임에서 비직렬화 객체(DOM/Event/Set 등)가 섞이면
  //   'Uncaught ps' 같은 내부 오류가 날 수 있어서, 전송 전 JSON-safe로 정규화
  // =========================================================
  function _leaveToWire_(obj){
    try{
      return JSON.parse(JSON.stringify(obj == null ? {} : obj));
    }catch(e){
      // 마지막 안전장치: 최소 필드만
      return {};
    }
  }

  // =========================================================
  // ✅ 전역 fallback (protected function / 다른 스코프에서 호출될 때 ReferenceError 방지)
  // - Leave_init 내부에만 있던 변수/함수를 전역에서도 안전하게 접근 가능하게 만듦
  // =========================================================
  if (typeof window._leaveApplyAll === 'undefined') window._leaveApplyAll = [];
  if (typeof window._grantUnofficialDays === 'undefined') window._grantUnofficialDays = 0;
  // 전역 변수로도 제공 (어딘가에서 var _leaveApplyAll 직접 참조하는 경우 대응)
  if (typeof _leaveApplyAll === 'undefined') var _leaveApplyAll = window._leaveApplyAll;
  if (typeof _grantUnofficialDays === 'undefined') var _grantUnofficialDays = window._grantUnofficialDays;

  // parseYearNum_가 로컬에만 있으면 protected function에서 못 찾음 → 전역 fallback 제공
  if (typeof parseYearNum_ !== 'function'){
    function parseYearNum_(v){
      if (v == null) return NaN;
      var s = String(v).trim();
      var m = s.match(/(\d{4})/);
      return m ? Number(m[1]) : Number(s);
    }
  }

  function LeaveApply_init(scopeEl){
    if (!scopeEl) return;

    var root  = scopeEl.querySelector('[data-leave-apply-root]') || scopeEl;
    var sel   = root.querySelector('[data-la-type]');
    var date  = root.querySelector('[data-la-date]');
    var sTime = root.querySelector('[data-la-start]');
    var eTime = root.querySelector('[data-la-end]');
    var usage = root.querySelector('[data-la-usage]');
    if (!sel || !date || !sTime || !eTime || !usage) return;

    // ===== helpers =====
    function isValidDateStr(v){
      v = String(v || '').trim();
      
      // 1) YYYY-MM-DD...
      var m =
        v.match(/^(\d{4})-(\d{2})-(\d{2})/) ||
        // 2) YYYY.MM.DD...
        v.match(/^(\d{4})\.(\d{2})\.(\d{2})/) ||
        // 3) YYYYMMDD...
        v.match(/^(\d{4})(\d{2})(\d{2})/);

      if (!m) return false;

      var y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
      if (mo < 1 || mo > 12) return false;

      var dt = new Date(y, mo - 1, d);
      return dt.getFullYear() === y && (dt.getMonth() + 1) === mo && dt.getDate() === d;
    }
    
    function toMin(hhmm){
      hhmm = String(hhmm || '').trim();
      var m = /^(\d{1,2}):(\d{2})$/.exec(hhmm);
      if (!m) return NaN;
      var h = Number(m[1]), mm = Number(m[2]);
      if (h < 0 || h > 23 || mm < 0 || mm > 59) return NaN;
      return h * 60 + mm;
    }

    function fmtMinutes(min){
      min = Math.max(0, Math.floor(min || 0));
      var h = Math.floor(min / 60);
      var m = min % 60;
      if (h === 0 && m === 0) return '0시간';
      if (m === 0) return h + '시간';
      if (h === 0) return m + '분';
      return h + '시간 ' + m + '분';
    }

    // 09:00~12:00, 13:00~18:00만 인정 (12~13 제외)
    function calcWorkMinutes(startMin, endMin){
      if (!isFinite(startMin) || !isFinite(endMin)) return 0;
      if (endMin <= startMin) return 0;

      var intervals = [
        [9*60, 12*60],
        [13*60, 18*60]
      ];

      var sum = 0;
      for (var i=0; i<intervals.length; i++){
        var a = intervals[i][0], b = intervals[i][1];
        var overlap = Math.min(endMin, b) - Math.max(startMin, a);
        if (overlap > 0) sum += overlap;
      }
      return sum;
    }

    function setDisabled(el, disabled){
      if (!el) return;
      el.disabled = !!disabled;
      if (disabled) el.value = ''; // 비활성화 시 값도 정리(원하면 제거 가능)
    }

    function recalc(){
      var type = sel.value;

      if (type === '일'){
        usage.value = isValidDateStr(date.value) ? '1일' : '0일';
        if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(root);
        return;
      }

      if (type === '시간'){
        var sm = toMin(sTime.value);
        var em = toMin(eTime.value);
        var mins = calcWorkMinutes(sm, em);
        usage.value = fmtMinutes(mins);
        if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(root);
        return;
      }

      usage.value = '';
      if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(root);
    }

    function applyMode(){
      var type = sel.value;

      if (type === '일'){
        setDisabled(date, false);
        setDisabled(sTime, true);
        setDisabled(eTime, true);
        usage.value = '';
        recalc();
        return;
      }

      if (type === '시간'){
        setDisabled(date, false);    // ✅ 일자/시간 활성
        setDisabled(sTime, false);
        setDisabled(eTime, false);
        recalc();                    // 초기 0시간 표시
        return;
      }

      // 미선택
      setDisabled(date, true);
      setDisabled(sTime, true);
      setDisabled(eTime, true);
      usage.value = '';
    }

    // ===== bind (중복 바인딩 방지) =====
    if (root.__leaveApplyBound) return;
    root.__leaveApplyBound = true;

    sel.addEventListener('change', function(){
      applyMode();
      if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(root);
    });

    [date, sTime, eTime].forEach(function(el){
      el.addEventListener('input', recalc);
      el.addEventListener('change', recalc);
    });

    // 최초 상태 반영
    applyMode();
    if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(root);
  }
</script>

<script>
/*연차신청 페이지모달*/
function leaveApplyPageModal() {
  // ✅ 승인관리 상태에서 연차신청 클릭 시 승인모드 해제
  try{ leaveToggleApprovalMode(false); }catch(e){}

  // ✅ 선택 직원 확인
  var leaveRoot = document.getElementById('leave-root');
  var selEmp = leaveRoot ? (leaveRoot.__leaveSelectedEmp || null) : null;
  if (!selEmp || !selEmp.employee_id){
    if (typeof showAlertWarn === 'function') showAlertWarn('직원을 선택해 주세요.', '연차신청');
    return;
  }

  // ✅ 선택 직원의 부여/잔여 연차가 0일이면 신청 모달 진입 차단
  try{
    function _dayNumFromTxt_(txt){
      txt = String(txt || '').trim();
      var m = txt.match(/(-?\d+)\s*일/);
      return m ? Number(m[1]) : NaN;
    }
    var btn = leaveRoot.querySelector('button.wrap-list-item[data-employee-id="' + String(selEmp.employee_id).trim() + '"]');
    var grantTxt = '';
    var remainTxt = '';
    if (btn){
      grantTxt = String(btn.dataset.grantTxt || '').trim();
      remainTxt = String(btn.dataset.remainTxt || '').trim();
      if (!grantTxt || !remainTxt){
        var subEl = btn.querySelector('.wrap-list-sub');
        var subTxt = String((subEl && subEl.textContent) || '').trim();
        var mg = subTxt.match(/부여\s*([^·]+)/);
        var mr = subTxt.match(/잔여\s*([^·]+)/);
        grantTxt = grantTxt || (mg ? String(mg[1]).trim() : '');
        remainTxt = remainTxt || (mr ? String(mr[1]).trim() : '');
      }
    }
    var grantDay = _dayNumFromTxt_(grantTxt);
    var remainDay = _dayNumFromTxt_(remainTxt);
    if (isFinite(grantDay) && grantDay <= 0){
      if (typeof showAlertWarn === 'function') {
        showAlertWarn('부여연차가 0일로 신청이 불가합니다.', '연차신청');
      }
      return;
    }
    if (isFinite(remainDay) && remainDay <= 0){
      if (typeof showAlertWarn === 'function') {
        showAlertWarn('잔여연차가 0일로 신청할 수 없습니다.', '연차신청');
      }
      return;
    }
  }catch(e){}

  var _applyModalEl = null;
  var _isApplySaving = false;
  openPageModal({
    title: '연차신청',
    size: 'md',
    templateId: 'leave-apply-page-modal',
    // ✅ 닫기(취소) 버튼 제거: 저장만 노출
    footerButtons: [
      { action:'save', text:'저장', icon:'fa-floppy-disk', className:'btn-box btn-box-blue', confirm:false, autoAlert:false, close:false }
    ],
    onOpen: function(modalEl, bodyHost){
      _applyModalEl = modalEl;

      // ✅ 상단 "연차신청직원 : 00000 가나다" 세팅
      try{
        var root = bodyHost.querySelector('[data-leave-apply-root]') || bodyHost;
        // 템플릿 상단의 두번째 <div>(사번/성명 표시 영역)를 찾아 업데이트
        var headRow = root.closest('[data-leave-apply-root]') ? root.parentElement : bodyHost;
        // 가장 안전: 템플릿 첫 줄의 "연차신청직원" 라인에서 마지막 div를 찾음
        var labelLine = bodyHost.querySelector('[data-leave-apply-root]')?.previousElementSibling;
        // 위가 실패하면 템플릿 내 첫번째 d-flex에서 마지막 div 찾기
        var topLine = bodyHost.querySelector('.d-flex.align-items-center');
        if (topLine){
          var dvs = topLine.querySelectorAll('div');
          if (dvs && dvs.length){
            dvs[dvs.length - 1].textContent = selEmp.employee_id + ' ' + (selEmp.name || '');
          }
        }
      }catch(e){}

      // ✅ 선택 직원 값을 bodyHost에 보관(저장 시 사용)
      bodyHost.__leaveApplyEmp = { employee_id: selEmp.employee_id, name: selEmp.name || '' };

      LeaveApply_init(bodyHost);
    },
    onSave: function (e, modalEl, bodyHostArg, done) {
      var bodyHost = bodyHostArg || document.querySelector('#appPageModal [data-role="page-modal-body"]');
      if (!bodyHost){
        if (typeof done === 'function') done({ ok:false, error:'모달 컨텍스트를 찾을 수 없습니다.' });
        return false;
      }

      var __doneCalled = false;
      function _done_(res, opt){
        if (__doneCalled) return;
        __doneCalled = true;
        if (typeof done === 'function') done(res, opt);
      }

      var emp = bodyHost.__leaveApplyEmp || null;
      if (!emp || !emp.employee_id){
        if (typeof showAlertWarn === 'function') showAlertWarn('직원을 선택해 주세요.', '연차신청');
        _done_({ ok:false, error:'직원을 선택해 주세요.' });
        return false;
      }

      var root = bodyHost.querySelector('[data-leave-apply-root]') || bodyHost;
      var sel   = root.querySelector('[data-la-type]');
      var date  = root.querySelector('[data-la-date]');
      var sTime = root.querySelector('[data-la-start]');
      var eTime = root.querySelector('[data-la-end]');
      var usage = root.querySelector('[data-la-usage]');

      var category = sel ? String(sel.value || '').trim() : '';
      var dateVal  = date ? String(date.value || '').trim() : '';
      var stVal    = sTime ? String(sTime.value || '').trim() : '';
      var etVal    = eTime ? String(eTime.value || '').trim() : '';
      var usageVal = usage ? String(usage.value || '').trim() : '';

      function normDate_(v){
        v = String(v || '').trim();
        // input-date 커스텀으로 "YYYY-MM-DD 요일"이 될 수 있으므로 앞의 날짜만 사용
        var m = v.match(/(\d{4})-(\d{2})-(\d{2})/);
        if (m) return m[1] + '-' + m[2] + '-' + m[3];
        m = v.match(/(\d{4})\.(\d{2})\.(\d{2})/);
        if (m) return m[1] + '-' + m[2] + '-' + m[3];
        m = v.match(/(\d{4})(\d{2})(\d{2})/);
        if (m) return m[1] + '-' + m[2] + '-' + m[3];
        return v;
      }

      function isValidDateStr(v){
        v = String(v || '').trim();
        var m = v.match(/^(\d{4})-(\d{2})-(\d{2})/) || v.match(/^(\d{4})\.(\d{2})\.(\d{2})/) || v.match(/^(\d{4})(\d{2})(\d{2})/);
        if (!m) return false;
        var y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
        if (mo < 1 || mo > 12) return false;
        var dt = new Date(y, mo-1, d);
        return dt.getFullYear()===y && (dt.getMonth()+1)===mo && dt.getDate()===d;
      }
      function extractYear_(v){
        var m = String(v || '').trim().match(/(\d{4})/);
        return m ? Number(m[1]) : NaN;
      }
      function timeToMin_(hhmm){
        var s = String(hhmm || '').trim();
        var m = s.match(/^(\d{1,2}):(\d{2})$/);
        if (!m) return NaN;
        var h = Number(m[1]), mm = Number(m[2]);
        if (!isFinite(h) || !isFinite(mm)) return NaN;
        if (h < 0 || h > 23 || mm < 0 || mm > 59) return NaN;
        return h * 60 + mm;
      }

      // ✅ 필수값 검증
      if (!category){
        if (typeof showAlertWarn === 'function') showAlertWarn('연차구분을 선택해 주세요.', '연차신청');
        _done_({ ok:false, error:'연차구분을 선택해 주세요.' });
        return false;
      }
      dateVal = normDate_(dateVal); // ✅ 요일 제거 후 저장/검증
      if (!isValidDateStr(dateVal)){
        if (typeof showAlertWarn === 'function') showAlertWarn('일자를 입력해 주세요. (yyyy-mm-dd)', '연차신청');
        _done_({ ok:false, error:'일자를 입력해 주세요. (yyyy-mm-dd)' });
        return false;
      }

      // ✅ 연차일자는 현재 연차적용연도와 동일한 연도만 허용
      try{
        var yearSelEl = (leaveRoot && leaveRoot.querySelector) ? leaveRoot.querySelector('[data-leave-year-select]') : null;
        var selectedYear = extractYear_(yearSelEl ? yearSelEl.value : '');
        var dateYear = extractYear_(dateVal);
        if (isFinite(selectedYear) && isFinite(dateYear) && selectedYear !== dateYear){
          if (typeof showAlertWarn === 'function') {
            showAlertWarn('연차일자는 적용연도(' + selectedYear + '년)만 저장할 수 있습니다.', '연차신청');
          }
          _done_({ ok:false, error:'연차일자는 적용연도(' + selectedYear + '년)만 저장할 수 있습니다.' });
          return false;
        }
      }catch(e){}

      if (category === '시간'){
        if (!stVal || !etVal){
          if (typeof showAlertWarn === 'function') showAlertWarn('시작시간/종료시간을 입력해 주세요.', '연차신청');
          _done_({ ok:false, error:'시작시간/종료시간을 입력해 주세요.' });
          return false;
        }
        // ✅ 시간 연차는 09:00~18:00 범위만 허용 + 시작<종료
        var stMin = timeToMin_(stVal);
        var etMin = timeToMin_(etVal);
        var minFrom = 9 * 60;
        var minTo = 18 * 60;
        if (!isFinite(stMin) || !isFinite(etMin)){
          if (typeof showAlertWarn === 'function') showAlertWarn('시간은 HH:mm 형식으로 입력해 주세요.', '연차신청');
          _done_({ ok:false, error:'시간은 HH:mm 형식으로 입력해 주세요.' });
          return false;
        }
        if (stMin < minFrom || stMin > minTo || etMin < minFrom || etMin > minTo){
          if (typeof showAlertWarn === 'function') showAlertWarn('시간연차는 09:00~18:00 범위에서만 신청할 수 있습니다.', '연차신청');
          _done_({ ok:false, error:'시간연차는 09:00~18:00 범위에서만 신청할 수 있습니다.' });
          return false;
        }
        if (stMin >= etMin){
          if (typeof showAlertWarn === 'function') showAlertWarn('종료시간은 시작시간보다 늦어야 합니다.', '연차신청');
          _done_({ ok:false, error:'종료시간은 시작시간보다 늦어야 합니다.' });
          return false;
        }
      }else{
        // '일'이면 시간은 비워 저장
        stVal = '';
        etVal = '';
      }

      // ✅ days 정규화: "0일" 또는 "n시간" 또는 "1일"
      function normalizeDays_(cat, usageTxt){
        usageTxt = String(usageTxt || '').trim();
        if (cat === '일'){
          // usage가 '1일' 또는 '0일'로 들어옴
          return usageTxt || '0일';
        }
        // '시간': usage가 "0시간" 또는 "2시간 30분" 같은 형태일 수 있음
        // -> DB요구: 0시간/1시간..8시간, 8시간 이상이면 1일
        var mh = usageTxt.match(/(\d+)\s*시간/);
        var mm = usageTxt.match(/(\d+)\s*분/);
        var h = mh ? Number(mh[1]) : 0;
        var m = mm ? Number(mm[1]) : 0;
        if (!isFinite(h)) h = 0;
        if (!isFinite(m)) m = 0;
        var totalMin = (h * 60) + m;
        if (totalMin <= 0) return '0시간';
        if (totalMin >= 8*60) return '1일';
        // 분이 있으면 올림해서 시간으로 저장(요구사항: 시간 단위)
        var hh = Math.ceil(totalMin / 60);
        if (hh >= 8) return '1일';
        return hh + '시간';
      }
      var daysTxt = normalizeDays_(category, usageVal);

	      var payload = {
	        employee_id: emp.employee_id,
	        category: category,
	        date: dateVal, // ✅ 항상 yyyy-mm-dd만 저장
	        start_time: stVal,
	        end_time: etVal,
	        days: daysTxt
	      };

      function _closeApplyModal_(done){
        try{
          if (!_applyModalEl || !window.bootstrap){
            if (typeof done === 'function') done();
            return;
          }
          var inst = window.bootstrap.Modal.getInstance(_applyModalEl) || window.bootstrap.Modal.getOrCreateInstance(_applyModalEl);
          if (!_applyModalEl.classList.contains('show')){
            if (typeof done === 'function') done();
            return;
          }
          var once = function(){
            try{ _applyModalEl.removeEventListener('hidden.bs.modal', once); }catch(e){}
            if (typeof done === 'function') done();
          };
          _applyModalEl.addEventListener('hidden.bs.modal', once);
          inst.hide();
        }catch(e){
          if (typeof done === 'function') done();
        }
      }

	      function _setApplyFlowLoading_(on){
	        var rootEl = window._leaveRoot || document.getElementById('leave-root') || document.body || document;
	        try{
	          if (window.UI_Loading){
            if (on) UI_Loading.show(rootEl, { key:'leave-apply-flow', text:'' });
            else UI_Loading.hide(rootEl, { key:'leave-apply-flow' });
          }
        }catch(e){}
	      }

	      function _afterApplyDoneSuccess_(){
	        _setApplyFlowLoading_(false);
          _isApplySaving = false;
          _closeApplyModal_(function(){
            if (typeof showAlertSuccess === 'function') showAlertSuccess('신청되었습니다.', '연차신청');
            _done_({ ok:true }, { close:false });
          });
	      }
	      function _afterApplyDoneError_(msg){
	        _setApplyFlowLoading_(false);
          _isApplySaving = false;
	        if (typeof showAlertError === 'function') {
	          showAlertError(String(msg || '저장 후 화면 갱신에 실패했습니다.'), '연차신청');
	        }
          _done_({ ok:false, error:String(msg || '저장 후 화면 갱신에 실패했습니다.') });
	      }
      function _reloadMainAndThenAlert_(){
        try{
          var rootEl = window._leaveRoot || document.getElementById('leave-root') || null;
          var ys = (rootEl && rootEl.querySelector) ? rootEl.querySelector('[data-leave-year-select]') : null;
          if (!rootEl || !ys){
            _afterApplyDoneSuccess_();
            return;
          }

          var reloadToken = 'apply-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
          try{
            rootEl.__leaveSilentReload = true;
            rootEl.__leaveReloadToken = reloadToken;
          }catch(e){}

          var done = false;
          var timer = null;
          function finish_(ok, msg){
            if (done) return;
            done = true;
            try{ rootEl.removeEventListener('leave:main-loaded', onLoaded_); }catch(e){}
            try{ if (timer) clearTimeout(timer); }catch(e){}
            if (ok === false) _afterApplyDoneError_(msg);
            else _afterApplyDoneSuccess_();
          }
          function onLoaded_(ev){
            var d = (ev && ev.detail) ? ev.detail : {};
            if (String(d.reloadToken || '') !== reloadToken) return;
            finish_(d.success !== false, d.error || '');
          }

          try{ rootEl.addEventListener('leave:main-loaded', onLoaded_); }catch(e){}
	          timer = setTimeout(function(){ finish_(false, '화면 갱신 완료를 확인하지 못했습니다.'); }, 12000);
	          ys.dispatchEvent(new Event('change'));
	        }catch(e){
	          _afterApplyDoneError_((e && e.message) ? e.message : String(e));
	        }
	      }

        function _runApply_(){
          if (_isApplySaving){
            _done_({ ok:false, error:'이미 저장 중입니다.' });
            return;
          }
          _isApplySaving = true;
          _setApplyFlowLoading_(true);
          google.script.run
            .withSuccessHandler(function(res){
              var ok = !!(res && (res.ok === true || res.success === true));
              if (!ok){
                _setApplyFlowLoading_(false);
                _isApplySaving = false;
                var em = (res && (res.error || res.message)) || '저장에 실패했습니다.';
                if (typeof showAlertError === 'function') showAlertError(em, '연차신청');
                return;
              }
              // ✅ 저장 + 메인 재조회 완료까지 하나의 로딩으로 유지한 뒤 성공 알림 표시
              _reloadMainAndThenAlert_();
            })
            .withFailureHandler(function(err){
              _setApplyFlowLoading_(false);
              _isApplySaving = false;
              if (typeof showAlertError === 'function') {
                showAlertError((err && err.message) ? err.message : String(err), '연차신청');
              }
            })
            .LEAVE_applyLeave(_leaveToWire_(payload));
        }

        var confirmMsg = '연차신청을 저장하시겠습니까?';
        if (typeof showConfirmInfo === 'function'){
          showConfirmInfo(confirmMsg, '연차신청', _runApply_, function(){});
        }else if (typeof showConfirm === 'function'){
          showConfirm(confirmMsg, '연차신청', 'info', _runApply_, function(){});
        }else{
          if (confirm(confirmMsg)) _runApply_();
        }

	      // ✅ async 저장이므로 모달 자동닫힘 방지
	      return false;
	    }
	  });
}

/*연차설정 페이지모달*/
function leaveSetPageModal() {
  var _leaveSetBodyHost = null;
  var _leaveSetModalEl  = null; // ✅ 저장버튼 enable/disable 제어용
  var _isLeaveSetSaving = false;
  function _setLeaveSetFlowLoading_(on){
    var scope = _leaveSetBodyHost || (_leaveSetModalEl || document.body || document);
    try{
      if (window.UI_Loading){
        if (on) UI_Loading.show(scope, { key:'leave-set-flow', text:'' });
        else UI_Loading.hide(scope, { key:'leave-set-flow' });
      }
    }catch(e){}
  }
  function _reloadLeaveMainAfterSet_(){
    return new Promise(function(resolve){
      try{
        var mainRoot = window._leaveRoot || document.getElementById('leave-root') || null;
        var mainYearSel = mainRoot ? mainRoot.querySelector('[data-leave-year-select]') : null;
        if (!mainRoot || !mainYearSel){
          resolve({ ok:true });
          return;
        }
        var reloadToken = 'set-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        var done = false;
        var timer = null;
        function finish_(ok, msg){
          if (done) return;
          done = true;
          try{ mainRoot.removeEventListener('leave:main-loaded', onLoaded_); }catch(e){}
          try{ if (timer) clearTimeout(timer); }catch(e){}
          resolve({ ok: ok !== false, error: msg || '' });
        }
        function onLoaded_(ev){
          var d = (ev && ev.detail) ? ev.detail : {};
          if (String(d.reloadToken || '') !== reloadToken) return;
          finish_(d.success !== false, d.error || '');
        }
        mainRoot.addEventListener('leave:main-loaded', onLoaded_);
        timer = setTimeout(function(){ finish_(false, '메인페이지 갱신 완료를 확인하지 못했습니다.'); }, 12000);

        function dispatchMainReload_(){
          try{
            mainRoot.__leaveSilentReload = true;
            mainRoot.__leaveReloadToken = reloadToken;
          }catch(e){}
          mainYearSel.dispatchEvent(new Event('change'));
        }

        // ✅ 저장 후 메인 연차적용연도 옵션도 서버에서 재조회
        google.script.run
          .withSuccessHandler(function(res){
            var ok = !!(res && (res.ok === true || res.success === true));
            var years = ok ? (res.years || []) : [];
            if (ok && years.length){
              var prev = String(mainYearSel.value || '').trim();
              mainYearSel.innerHTML = '';
              years.forEach(function(y){
                var opt = document.createElement('option');
                opt.value = String(y);
                opt.textContent = String(y);
                mainYearSel.appendChild(opt);
              });

              var picked = '';
              if (years.indexOf(prev) >= 0){
                picked = prev;
              }else{
                var nowY = (new Date()).getFullYear();
                var nowLabel = String(nowY) + '년';
                if (years.indexOf(nowLabel) >= 0) picked = nowLabel;
                else picked = String(years[years.length - 1] || '');
              }
              mainYearSel.value = picked;
            }

            // has-value 동기화
            try{
              var has = !!String(mainYearSel.value || '').trim();
              mainYearSel.classList.toggle('has-value', has);
              var grp = mainYearSel.closest('.inputgroup1, .inputgroup2');
              if (grp) grp.classList.toggle('has-value', has);
              if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(grp || mainYearSel);
            }catch(e){}

            dispatchMainReload_();
          })
          .withFailureHandler(function(){
            // 연도 옵션 재조회 실패 시에도 데이터 재조회는 진행
            dispatchMainReload_();
          })
          .LEAVE_listYears(_leaveToWire_({ only_active:true }));
      }catch(e){
        resolve({ ok:false, error: (e && e.message) ? e.message : String(e) });
      }
    });
  }
  openPageModal({
    title: '연차설정',
    size: 'full',
    templateId: 'leave-set-page-modal',
    // ✅ 취소버튼 제거: 저장만 노출
    footerButtons: [
      { action:'save', text:'저장', icon:'fa-floppy-disk', className:'btn-box btn-box-blue', confirm:false, autoAlert:false, close:false }
    ],
    onOpen: function(modalEl, bodyHost){
      _leaveSetBodyHost = bodyHost;
      _leaveSetModalEl  = modalEl;
      LeaveSet_init(bodyHost);
    },
    onSave: function () {
      // ✅ 저장버튼 비활성화(중복 저장 방지) + 완료 시 반드시 복구
      var _btnSave = null;
      try{
        _btnSave = (_leaveSetModalEl && _leaveSetModalEl.querySelector)
          ? (_leaveSetModalEl.querySelector('button[data-action="save"], button[data-pm-action="save"], .modal-footer button.btn-primary') 
             || document.querySelector('#appPageModal .modal-footer button[data-action="save"], #appPageModal .modal-footer button[data-pm-action="save"], #appPageModal .modal-footer button.btn-primary'))
          : null;
      }catch(e){}
      function _setSaveDisabled_(v){
        try{
          if (_btnSave){
            _btnSave.disabled = !!v;
            _btnSave.classList.toggle('disabled', !!v);
          }
        }catch(e){}
      }

      _setSaveDisabled_(true);

      // ✅ async 저장: false를 리턴해서 모달 자동닫힘 방지
      var payload = (typeof LeaveSet_collectSavePayload_ === 'function')
        ? LeaveSet_collectSavePayload_()
        : null;

      if (!payload || !payload.year){
        if (typeof showAlertWarn === 'function') showAlertWarn('적용연도를 선택해 주세요.', '연차설정');
        _setSaveDisabled_(false);
        return false;
      }
      if (!payload.rows || payload.rows.length === 0){
        if (typeof showAlertWarn === 'function') showAlertWarn('저장할 연차정보가 없습니다.', '연차설정');
        _setSaveDisabled_(false);
        return false;
      }

      function _runSave_(){
        if (_isLeaveSetSaving) return;
        _isLeaveSetSaving = true;
        _setLeaveSetFlowLoading_(true);
        google.script.run
          .withSuccessHandler(function(res){
            var ok = !!(res && (res.ok === true || res.success === true));
            if (!ok){
              _setLeaveSetFlowLoading_(false);
              _isLeaveSetSaving = false;
              _setSaveDisabled_(false);
              var em = (res && (res.error || res.message)) || '저장에 실패했습니다.';
              if (typeof showAlertError === 'function') showAlertError(em, '연차설정');
              return;
            }

            var modalReloadPromise = Promise.resolve({ ok:true });
            try{
              if (_leaveSetBodyHost && _leaveSetBodyHost.__leaveSetApi && typeof _leaveSetBodyHost.__leaveSetApi.reload === 'function'){
                modalReloadPromise = _leaveSetBodyHost.__leaveSetApi.reload();
              }else{
                var bh = document.querySelector('#appPageModal [data-role="page-modal-body"]');
                if (bh && bh.__leaveSetApi && typeof bh.__leaveSetApi.reload === 'function') {
                  modalReloadPromise = bh.__leaveSetApi.reload();
                }
              }
            }catch(e){
              modalReloadPromise = Promise.resolve({ ok:false, error:(e && e.message) ? e.message : String(e) });
            }

            Promise.all([ modalReloadPromise, _reloadLeaveMainAfterSet_() ])
              .then(function(results){
                var r1 = results[0] || {};
                var r2 = results[1] || {};
                var ok1 = !(r1 && r1.ok === false);
                var ok2 = !(r2 && r2.ok === false);

                _setLeaveSetFlowLoading_(false);
                _isLeaveSetSaving = false;
                _setSaveDisabled_(false);

                if (!ok1 || !ok2){
                  var em = (r1 && r1.error) || (r2 && r2.error) || '저장 후 화면 갱신에 실패했습니다.';
                  if (typeof showAlertError === 'function') showAlertError(em, '연차설정');
                  return;
                }
                if (typeof showAlertSuccess === 'function') showAlertSuccess('저장되었습니다.', '연차설정');
              })
              .catch(function(err){
                _setLeaveSetFlowLoading_(false);
                _isLeaveSetSaving = false;
                _setSaveDisabled_(false);
                if (typeof showAlertError === 'function') {
                  showAlertError((err && err.message) ? err.message : String(err), '연차설정');
                }
              });
          })
          .withFailureHandler(function(err){
            _setLeaveSetFlowLoading_(false);
            _isLeaveSetSaving = false;
            _setSaveDisabled_(false);
            if (typeof showAlertError === 'function') {
              showAlertError((err && err.message) ? err.message : String(err), '연차설정');
            }
          })
          .LEAVE_saveLeaveSettings(_leaveToWire_(payload));
      }

      var confirmMsg = '연차설정을 저장하시겠습니까?';
      if (typeof showConfirmInfo === 'function'){
        showConfirmInfo(confirmMsg, '연차설정', _runSave_, function(){ _setSaveDisabled_(false); });
      }else if (typeof showConfirm === 'function'){
        showConfirm(confirmMsg, '연차설정', 'info', _runSave_, function(){ _setSaveDisabled_(false); });
      }else{
        if (confirm(confirmMsg)) _runSave_();
        else _setSaveDisabled_(false);
      }

      return false;
    }
  });
}

// Leave Page Init
// =========================================================
function Leave_init(container){
  // leave 페이지 진입 시 기본 승인모드 UI 잠금
  try{ leaveInitApprovalUI(); }catch(e){}

  var root = null;
  if (container && container.querySelector){
    root = container.querySelector('#leave-root') || container;
    // ✅ 전역 루트(요약카드/유틸 함수에서 참조)
    window._leaveRoot = root;
  }else{
    root = document.getElementById('leave-root');
  }
  if (!root) return Promise.resolve();

  // =========================================================
  // ✅ 1회 부팅 로딩(빈 UI 노출 방지): meta 공용 UI_Loading 사용
  // =========================================================
  var _bootDone = false;
  function _showBootLoading_(){
    if (_bootDone) return;
    try{
      if (window.UI_Loading) UI_Loading.show(container || root, { key:'leave-boot', boot:true, text:'' });
    }catch(e){}
  }
  function _hideBootLoading_(){
    if (_bootDone) return;
    _bootDone = true;
    try{
      if (window.UI_Loading) UI_Loading.hide(container || root, { key:'leave-boot' });

    // - UX 요구: 스피너 중에도 기본 UI(테이블/요약/목록)는 계속 보이게 유지
    // - 따라서 영역 숨김(_hideMainParts_)은 사용하지 않음
    try{
      window._leaveMainBatchLoading = true;
      window._leaveSummaryDirty = false;
      if (root) root.__leaveMainBatchLoading = true;
    }catch(e){}
    if (!silent){
      if (useMainLoading) _setMainLoading_(true);
    }

    // 내부 상태 초기화
    // silent면 로딩 텍스트 노출/선택초기화는 UX상 깜빡임이라 스킵

    _leaveApplyAll = [];

    // 로딩 표시는 스피너(UI_Loading)만 사용

    return fetchMainBundleForYear_(y).then(function(bundle){
      // ✅ 연도 변경 중간에 이전 요청이 늦게 끝나면 무시
      if (seq !== _mainBatchSeq) return { ok:false, stale:true };

      var okBundle = !!(bundle && (bundle.ok === true || bundle.success === true));
      var resEmp = okBundle ? { ok:true, rows:(bundle.employees || []) } : { ok:false };
      var resApply = okBundle ? { ok:true, rows:(bundle.leaveApplies || []) } : { ok:false };
      var grantObj = okBundle ? (bundle.grants || {}) : {};
      var resGrant = okBundle ? { ok:true, rows:(grantObj.rows || []), total_unofficial_days: grantObj.total_unofficial_days } : { ok:false };

      // 1) 직원명단
      var okEmp = !!(resEmp && (resEmp.ok === true || resEmp.success === true));
      var empRows = okEmp ? (resEmp.rows || []) : [];
      renderEmployees_(empRows);

      // 2) 연차정보(테이블 + 요약카드 계산용 캐시)

      _leaveApplyAll = okApply ? (resApply.rows || []) : [];
      window._leaveApplyAll = _leaveApplyAll;
      renderLeaveApplyRows_(_leaveApplyAll);

      // 3) 발생연차 캐시(요약카드용)
      var okGrant = !!(resGrant && (resGrant.ok === true || resGrant.success === true));
      if (!okGrant){

        window._leaveGrantTotal = 0;

        var map = {};

        (resGrant.rows || []).forEach(function(r){

          if (!eid) return;
          var n = Number((r && r.unofficial_days) || 0) || 0;

          total += n;
        });
        if (resGrant.total_unofficial_days != null){
          var t = Number(resGrant.total_unofficial_days);
          if (isFinite(t)) total = t;
        }
        window._leaveGrantMap = map;
        window._leaveGrantTotal = total;

      try{ syncGrantUnofficialDaysFromCache_(); }catch(e){}
      try{
        window._leaveMainBatchLoading = false;
        if (root) root.__leaveMainBatchLoading = false;
      }catch(e){}
      updateLeaveSummary_(); // ✅ 최종 1회 갱신

  // - Employee name은 서버에서 매핑하여 내려준다.
  // ======================================================
  function _dowKo_(d){
    // 0:일 ~ 6:토
    var w = ['일','월','화','수','목','금','토'];
    return w[d] || '';
  }

  function fmtDateWithDow_(dateStr){
    // dateStr: "YYYY-MM-DD"
    dateStr = String(dateStr || '').trim();
    var m = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return dateStr;
    var y = Number(m[1]), mo = Number(m[2]), da = Number(m[3]);
    var dt = new Date(y, mo-1, da);
    if (!isFinite(dt.getTime())) return dateStr;
    return m[1] + '-' + m[2] + '-' + m[3] + ' ' + _dowKo_(dt.getDay());
  }

  function fmtKoreanDateTimeToDateDow_(v){
    // "2026. 2. 11 오후 9:01:54" -> "2026-02-11 수"
    v = String(v || '').trim();
    var m = v.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
    if (!m) return v;
    var y = Number(m[1]), mo = Number(m[2]), da = Number(m[3]);
    if (!isFinite(y) || !isFinite(mo) || !isFinite(da)) return v;
    var mm = String(mo).padStart(2,'0');
    var dd = String(da).padStart(2,'0');
    return fmtDateWithDow_(y + '-' + mm + '-' + dd);
  }

  // ✅ 신청일자/처리일자 표시용: 어떤 타입이 오든 "YYYY-MM-DD 요일"로 통일
  function fmtAnyToDateDow_(v){
    if (v == null) return '';
    // Date 객체
    if (Object.prototype.toString.call(v) === '[object Date]' && !isNaN(v.getTime())){
      var yy = v.getFullYear();
      var mm = String(v.getMonth()+1).padStart(2,'0');
      var dd = String(v.getDate()).padStart(2,'0');
      return fmtDateWithDow_(yy + '-' + mm + '-' + dd);
    }
    var s = String(v).trim();
    if (!s) return '';

    // ISO 날짜/일시: "2026-02-11" or "2026-02-11 09:01:54"
    var mi = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (mi) return fmtDateWithDow_(mi[1] + '-' + mi[2] + '-' + mi[3]);

    // 한글 일시: "2026. 2. 11 오후 9:01:54"
    var mk = s.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
    if (mk) return fmtKoreanDateTimeToDateDow_(s);

    return s;
  }

      showInfoStatusRow_('데이터 없음');

    }

    // 정렬: 1) 일자 오름차순(1/1, 1/2, ...)  2) 사번 오름차순(1,2,3,...)
    list.sort(function(a,b){
      var ad = String((a && a.date) || '');
      var bd = String((b && b.date) || '');
      if (ad !== bd) return ad.localeCompare(bd); // ✅ date ASC

      // employee_id는 숫자 정렬 우선(문자면 문자열 정렬 fallback)
      var ae = String((a && a.employee_id) || '').trim();
      var be = String((b && b.employee_id) || '').trim();
      var an = Number(ae), bn = Number(be);
      if (isFinite(an) && isFinite(bn) && an !== bn) return an - bn; // ✅ employee_id ASC
      if (ae !== be) return ae.localeCompare(be);

      // (선택) 동일 일자+사번이면 신청일자(created_at) 오름차순으로 고정
      var ac = String((a && a.created_at) || '');
      var bc = String((b && b.created_at) || '');
      return ac.localeCompare(bc);
  });

    var approvalOn = !!(root.__leaveApprovalMode === true);

    list.forEach(function(r){
      var tr = document.createElement('tr');

      function tdText_(txt){

      tr.appendChild(tdText_(r.start_time || ''));
      tr.appendChild(tdText_(r.end_time || ''));
      tr.appendChild(tdText_(r.days || ''));

      // 상태(승인모드에서만 변경)
      var tdStat = document.createElement('td');
      var sel = document.createElement('select');
      sel.className = 'select-tbl';

        var o = document.createElement('option');
        o.value = v;
        o.textContent = v;
        sel.appendChild(o);
      });
      sel.value = String(r.status || '신청');
      // ✅ 상태저장용: 렌더 시점 상태를 저장(체크박스와 무관하게 변경여부 비교)
      tr.dataset.origStatus = sel.value;
      sel.disabled = !approvalOn;
      tdStat.appendChild(sel);
      tr.appendChild(tdStat);

      // ✅ 신청일자: "일자"와 동일한 형식(YYYY-MM-DD 요일)
      tr.appendChild(tdText_(fmtDateWithDow_(r.created_at || '')));
      tr.appendChild(tdText_(r.created_by || ''));
      // ✅ 처리일자: "일자"와 동일한 형식(YYYY-MM-DD 요일)
      tr.appendChild(tdText_(fmtDateWithDow_(r.applied_at || '')));
      tr.appendChild(tdText_(r.applied_by || ''));

      infoTbody.appendChild(tr);

      // ✅ DB로 렌더된 행도 커스텀 체크박스 초기화(표시/애니메이션)
      try{
        if (typeof initAnimatedCheckboxes === 'function') initAnimatedCheckboxes(tr);
      }catch(e){}
    });

    // ✅ 헤더/행 체크박스(전체선택 등) 동작 재연결 + 커스텀 표시 초기화
    try{ if (window.initTableRowCheckboxes) window.initTableRowCheckboxes(infoTbl); }catch(e){}
    try{ if (typeof initAnimatedCheckboxes === 'function') initAnimatedCheckboxes(infoTbl); }catch(e){}

    if (cbAllInfo) cbAllInfo.disabled = !approvalOn;
    refreshSelectTbl_();
  }

  function loadLeaveAppliesForYear_(yearLabel){
    if (!infoTbody) return;
    _leaveApplyYear = String(yearLabel || '').trim();
    _leaveApplyAll = [];
    // 로딩 표시는 스피너(UI_Loading)만 사용

    google.script.run
      .withSuccessHandler(function(res){
        var ok = !!(res && (res.ok === true || res.success === true));
        if (!ok){
          var em = (res && (res.error || res.message)) || '연차정보를 불러오지 못했습니다.';
          if (typeof showAlertError === 'function') showAlertError(em, '연차');
          renderLeaveApplyRows_([]);
          _leaveApplyAll = [];
          updateLeaveSummary_();
          return;
        }
        _leaveApplyAll = (res.rows || []);
        window._leaveApplyAll = _leaveApplyAll; // ✅ 전역 갱신
        renderLeaveApplyRows_(_leaveApplyAll);
        updateLeaveSummary_();
      })
      .withFailureHandler(function(err){
        if (typeof showAlertError === 'function') {
          showAlertError((err && err.message) ? err.message : String(err), '연차');
        }
        renderLeaveApplyRows_([]);
        _leaveApplyAll = [];
        updateLeaveSummary_();
      })
      .LEAVE_listLeaveApplies(_leaveToWire_({ year: yearLabel }));
  }

  function loadEmployeesForYear_(yearLabel){
    var yNum = parseYearNum_(yearLabel);
    if (!isFinite(yNum)){
      showEmpStatus_('데이터 없음');
      return;
    }

    // 로딩 표시는 스피너(UI_Loading)만 사용
    try{ setSelectedEmployee_('', ''); }catch(e){}
    try{ leaveToggleApprovalMode(false); }catch(e){}
    google.script.run
      .withSuccessHandler(function(res){
        var ok = !!(res && (res.ok === true || res.success === true));
        if (!ok){
          var em = (res && (res.error || res.message)) || '직원명단을 불러오지 못했습니다.';
          if (typeof showAlertError === 'function') showAlertError(em, '연차');
          renderEmployees_([]);
          return;
        }
        renderEmployees_(res.rows || []);
      })
      .withFailureHandler(function(err){
        if (typeof showAlertError === 'function') {
          showAlertError((err && err.message) ? err.message : String(err), '연차');
        }
        renderEmployees_([]);
      })
      .LEAVE_listLeaveEmployees({ year: yearLabel });
  }

  function loadYears_(){
    return new Promise(function(resolve){
      yearSel.innerHTML = '';
      // 로딩 표시는 스피너(UI_Loading)만 사용
      google.script.run
        .withSuccessHandler(function(res){
          var ok = !!(res && (res.ok === true || res.success === true));
          if (!ok){
            var em = (res && (res.error || res.message)) || '적용연도를 불러오지 못했습니다.';
            if (typeof showAlertError === 'function') showAlertError(em, '연차');
            yearSel.innerHTML = '<option value="">-</option>';
            showEmpStatus_('데이터 없음');
            _hideBootLoading_();
            resolve({ ok:false });
            return;
          }

          var years = res.years || [];
          if (!years.length){
            yearSel.innerHTML = '<option value="">-</option>';
            showEmpStatus_('데이터 없음');
            _hideBootLoading_();
            resolve({ ok:false, empty:true });
            return;
          }

          years.forEach(function(y){
            var opt = document.createElement('option');
            opt.value = String(y);
            opt.textContent = String(y);
            yearSel.appendChild(opt);
          });

          // ✅ 기본 선택: "오늘 연도"가 있으면 그 연도, 없으면 "마지막 연도"
          // - years는 "2025년" 같은 라벨 배열
          var nowY = (new Date()).getFullYear();
          var nowLabel = String(nowY) + '년';
          var picked = '';
          try{
            if (years.indexOf(nowLabel) >= 0) picked = nowLabel;
            else picked = String(years[years.length - 1] || '');
          }catch(e){
            picked = String(years[0] || '');
          }
          // (기존) 기본연도 선택 로직은 유지(너가 이미 "오늘연도 우선"으로 패치함)
          // ✅ 실제 select에 반영
          yearSel.value = picked;
          // ✅ programmatic value 설정 후 has-value 동기화(즉시 + 렌더 이후 1회)
          _syncLeaveYearSelectHasValue_();
          try{ requestAnimationFrame(_syncLeaveYearSelectHasValue_); }catch(e){}
          try{ setTimeout(_syncLeaveYearSelectHasValue_, 0); }catch(e){}

          // ✅ 선택된 연도 기준으로 3개를 "동시 로드 후 한번에 표시"
          Promise.resolve(loadMainForYearBatch_(yearSel.value))
            .then(function(ret){ resolve(ret || { ok:true }); });
        })
        .withFailureHandler(function(err){
          if (typeof showAlertError === 'function') {
            showAlertError((err && err.message) ? err.message : String(err), '연차');
          }
          yearSel.innerHTML = '<option value="">-</option>';
          showEmpStatus_('데이터 없음');
          _syncLeaveYearSelectHasValue_();
          _hideBootLoading_();
          resolve({ ok:false, error:(err && err.message) ? err.message : String(err) });
        })
        .LEAVE_listYears(_leaveToWire_({ only_active:true }));
    });
  }

  if (!yearSel.__leaveYearBound){
    yearSel.__leaveYearBound = true;
    yearSel.addEventListener('change', function(){
      // ✅ 연도 변경도 동일하게 "동시 로드 후 한번에 표시"
      // 단, 연차설정 저장 후에는 silent reload로 스피너/로딩문구 없이 갱신
      var silent = false;
      var reloadToken = '';
      try{
        silent = !!(root && root.__leaveSilentReload === true);
        reloadToken = (root && root.__leaveReloadToken) ? String(root.__leaveReloadToken) : '';
        if (root) root.__leaveSilentReload = false;
        if (root) root.__leaveReloadToken = '';
      }catch(e){}
      loadMainForYearBatch_(yearSel.value, { silent: silent, reloadToken: reloadToken });
    });
  }
  if (statusSel && !statusSel.__leaveBound){
    statusSel.__leaveBound = true;
    statusSel.addEventListener('change', function(){
      renderLeaveApplyRows_(_leaveApplyAll);
      updateLeaveSummary_();
    });
  }

  return loadYears_();
}

// =========================================================
// Leave Setting Modal
// - 적용연도: 2025 시작, 매년 10/1 이후 다음년도 자동 생성
// - 직원명단: Employee 시트에서 category(고용구분) 있는 직원만 렌더
//   * 표시: 사번+성명 / 총근무연수+총근무연차+manage / status
// =========================================================
function LeaveSet_init(scopeEl){
  if (!scopeEl) return;

  var root = scopeEl; // pageModal bodyHost 자체가 scope
  var yearList = root.querySelector('[data-leave-set-year-list]');
  var empList  = root.querySelector('[data-leave-set-emp-list]');
  var selStat  = root.querySelector('[data-leave-set-status-filter]');
  var btnAdd   = root.querySelector('button[aria-label="선택추가"]');
  var infoTbl  = root.querySelector('[data-leave-set-info-table]') || root.querySelector('.sec .wrap-tbl table.tbl');
  var infoTbody = infoTbl && infoTbl.tBodies ? infoTbl.tBodies[0] : null;
  var btnDel   = root.querySelector('button[aria-label="선택삭제"]');
  var cbAll    = infoTbl ? infoTbl.querySelector('thead input[type="checkbox"].chk-anim') : null;

  if (!yearList || !empList) return;
  if (!btnAdd || !infoTbody) return;
  if (!btnDel) return;

  // ✅ 다중선택 상태 + rowsAll 캐시(전체 1회 로드)
  var selectedIds = new Set();       // employee_id set
  var addedIds    = new Set();       // ✅ 연차정보에 이미 추가된 employee_id set
  var rowsById = {};                 // employee_id -> row

  // ======================================================
  // ✅ 연차정보 테이블 템플릿 행 확보 (tbody가 비어도 추가 가능)
  // - 기존 "빈행"은 템플릿 용도로만 쓰고, 필요하면 제거 가능
  // ======================================================
  var infoTplTr = null;
  (function initInfoTemplateRow_(){
    var first = infoTbody.querySelector('tr');
    // ✅ 서식행을 HTML에서 주석/삭제해도 동작하도록:
    //    tbody에 첫 tr이 없으면 "템플릿 tr"을 코드로 생성한다.
    if (!first){
      function buildDaySelectHtml_(){
        var html = '<select class="select-tbl"><option value="">선택</option>';
        for (var i=0;i<=25;i++){
          html += '<option value="'+i+'일">'+i+'일</option>';
        }
        html += '</select>';
        return html;
      }
      var tr = document.createElement('tr');
      tr.innerHTML = ''
        + '<td><input type="checkbox" class="chk-anim" aria-label="선택"></td>'
        + '<td><div class="text-tbl"></div></td>'  /* 사번 */
        + '<td><div class="text-tbl"></div></td>'  /* 성명 */
        + '<td><div class="text-tbl"></div></td>'  /* 총근무연수 */
        + '<td><div class="text-tbl"></div></td>'  /* 총근무연차 */
        + '<td><div class="text-tbl"></div></td>'  /* 법정연차 */
        + '<td>' + buildDaySelectHtml_() + '</td>'  /* 부여연차 */
        + '<td>' + buildDaySelectHtml_() + '</td>'  /* 공식연차 */
        + '<td><div class="text-tbl" data-unofficial-days>-</div></td>' /* ✅ 비공식연차(자동계산) */
        + '<td><input type="text" class="input-tbl" autocomplete="off"></td>';
      infoTplTr = tr;
      return;
    }
    infoTplTr = first.cloneNode(true);

    // "빈행" 여부 판단: dataset.employeeId 없고, 직원/근무/법정연차 텍스트가 비어있으면 빈행으로 간주
    var hasEid = first.dataset && String(first.dataset.employeeId || '').trim();
    var tNo = first.children[1] ? (first.children[1].innerText || '').trim() : '';
    var tNm = first.children[2] ? (first.children[2].innerText || '').trim() : '';
    var tWp = first.children[3] ? (first.children[3].innerText || '').trim() : '';
    var tWy = first.children[4] ? (first.children[4].innerText || '').trim() : '';
    var tLaw = first.children[5] ? (first.children[5].innerText || '').trim() : '';
    var isBlank = !hasEid && !tNo && !tNm && !tWp && !tWy && !tLaw;

    // ✅ 네가 말한 "빈행"은 삭제해도 정상 동작하도록 여기서 제거해도 됨
    if (isBlank){
      first.remove();
    }
  })();

  // ✅ 전체 로드 캐시(서버는 최초 1회)
  var rowsAll = null;
  var _batchSeq = 0; // ✅ 연도 변경 중복요청 무시용 토큰

  function _pRun_(runner){
    return new Promise(function(resolve, reject){
      try{ runner(resolve, reject); }catch(e){ reject(e); }
    });
  }
  function fetchEmployeesAll_(year){
    return _pRun_(function(resolve, reject){
      google.script.run
        .withSuccessHandler(function(res){ resolve(res); })
        .withFailureHandler(function(err){ reject(err); })
        .LEAVE_listEmployeesForSetting({ year: year, status: '전체' });
    });
  }
  function fetchLeaveSettings_(year){
    return _pRun_(function(resolve, reject){
      google.script.run
        .withSuccessHandler(function(res){ resolve(res); })
        .withFailureHandler(function(err){ reject(err); })
        .LEAVE_getLeaveSettings({ year: year });
    });
  }

  function _setLeaveSetLoading_(on){
    try{
      if (!window.UI_Loading) return;
      if (on) UI_Loading.show(root, { key:'leave-set-main', text:'', global:false });
      else UI_Loading.hide(root, { key:'leave-set-main', global:false });
    }catch(e){}
  }

  function loadAllForYearBatch_(year, opts){
    opts = opts || {};
    year = Number(year);
    if (!isFinite(year)) year = getSelectedYear();
    var seq = ++_batchSeq;
    var useSpinner = (opts.spinner !== false);
    if (useSpinner) _setLeaveSetLoading_(true);

    // 연도 전환 시 상태 초기화(연도별 독립)
    selectedIds.clear();
    addedIds.clear();
    rowsById = {};
    rowsAll = null;

    return Promise.all([
      fetchEmployeesAll_(year),
      fetchLeaveSettings_(year)
    ]).then(function(results){
      if (seq !== _batchSeq) return { ok:false, stale:true }; // ✅ 중간에 연도 바뀌면 무시

      var resEmp = results[0] || {};
      var resSet = results[1] || {};

      // 1) 직원명단 캐시 세팅(이게 있어야 DB 렌더에서 이름/근무/법정 계산 가능)
      var okEmp = !!(resEmp && (resEmp.ok === true || resEmp.success === true));
      rowsAll = okEmp ? (resEmp.rows || []) : [];
      rowsById = {};
      (rowsAll || []).forEach(function(r){
        var eid = String((r && r.employee_id) || '').trim();
        if (eid) rowsById[eid] = r;
      });

      // 2) 직원명단 렌더(필터 적용)
      applyEmployeeFilter(); // 내부에서 renderEmployees 호출

      // 3) 연차설정 테이블 렌더(직원 캐시 준비된 상태에서 1번에)
      var okSet = !!(resSet && (resSet.ok === true || resSet.success === true));
      renderLeaveSettingsRows_(okSet ? (resSet.rows || []) : []);
      return { ok:true };
    }).catch(function(err){
      if (seq !== _batchSeq) return { ok:false, stale:true };
      rowsAll = [];
      rowsById = {};
      renderEmployees([]);
      renderLeaveSettingsRows_([]);
      if (typeof showAlertError === 'function'){
        showAlertError((err && err.message) ? err.message : String(err), '연차설정');
      }
      return { ok:false, error: (err && err.message) ? err.message : String(err) };
    }).finally(function(){
      if (seq !== _batchSeq) return;
      if (useSpinner) _setLeaveSetLoading_(false);
    });
  }
  // ----- Year logic -----
  function buildYears(){
    var start = 2025;
    var now = new Date();
    var years = [start];

    // 매년 "해당년도 10/1"이 지나면 다음년도 생성
    // (일반화: start년도부터 now가 (y,10,1) 이상이면 y+1을 추가)
    var y = start;
    while (now >= new Date(y, 9, 1)) { // 9=October
      if (years.indexOf(y+1) < 0) years.push(y+1);
      y++;
      if (y - start > 10) break; // 안전장치
    }
    return years;
  }

  function renderYearList(years){
    years = Array.isArray(years) ? years : [];
    var nowY = (new Date()).getFullYear();
    var defaultYear = years.length ? years[years.length - 1] : nowY;
    if (years.indexOf(nowY) >= 0) defaultYear = nowY;

    yearList.innerHTML = '';
    years.forEach(function(y){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'wrap-list-item' + (Number(y) === Number(defaultYear) ? ' is-active' : '');
      btn.dataset.year = String(y);
      btn.innerHTML =
        '<div class="wrap-list-main">' +
          '<div class="wrap-list-name">' + y + '년</div>' +
        '</div>';
      btn.addEventListener('click', function(e){
        // ✅ meta.html 전역 wrap-list 클릭 토글 핸들러와 충돌 방지
        if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
        if (e && typeof e.preventDefault === 'function') e.preventDefault();

        yearList.querySelectorAll('.wrap-list-item').forEach(function(b){ b.classList.remove('is-active'); });
        btn.classList.add('is-active');

        // ✅ 연도 변경 시 '추가됨/선택됨' 상태를 초기화 (연도별로 독립)
        selectedIds.clear();
        addedIds.clear();
        // 기존 렌더 상태(비활성/선택)도 즉시 해제
        empList.querySelectorAll('button.wrap-list-item').forEach(function(b){
          b.disabled = false;
          b.removeAttribute('aria-disabled');
          b.classList.remove('is-disabled');
          b.classList.remove('is-active');
        });

        // ✅ 연도 변경 시: 직원/DB 동시 로드 → 동시 표시
        loadAllForYearBatch_(getSelectedYear());
      });
      yearList.appendChild(btn);
    });
  }

  // ✅ year 변경 시에도 호출될 수 있도록 wrapper 제공
  function loadEmployees(force){
    if (force){
      rowsAll = null;   // 캐시 초기화 → 다음 loadEmployeesOnce()에서 서버 재조회
      rowsById = {};
    }
    loadEmployeesOnce();
  }

  function getSelectedYear(){
    var a = yearList.querySelector('.wrap-list-item.is-active');
    var y = a ? a.dataset.year : '';
    return y ? Number(y) : 2025;
  }

  // ----- Employee list -----
  function fmtWork(work){
    // work: { working_period, working_yearcount }
    // ✅ 표기 통일: "총근무연수 · 총근무연차"
    if (!work) return '-';
    var p = (work.working_period || '').trim();
    var y = (work.working_yearcount || '').trim();
    if (!p && !y) return '-';
    if (p && y) return p + ' · ' + y;
    return p || y;
  }

  function fmtWorkPeriod_(work){
    if (!work) return '-';
    var p = (work.working_period || '').trim();
    return p || '-';
  }

  function fmtWorkYearcount_(work){
    if (!work) return '-';
    var y = (work.working_yearcount || '').trim();
    return y || '-';
  }

  function renderEmployees(list){
    empList.innerHTML = '';

    if (!list || !list.length){
      var empty = document.createElement('div');
      empty.className = 'text-muted';
      empty.style.padding = '0.5rem';
      empty.textContent = '데이터 없음';
      empList.appendChild(empty);
      return;
    }

    list.forEach(function(r){
      var empNo = r.emp_no || r.employee_no || r.no || '';
      var name  = r.name || r.employee_name || '';
      var manage = r.manage || '';
      var status = r.status || '';
      var sub = fmtWork(r.work);
      // 요구사항: 총근무연수 + 총근무연차 + 관리주체(manage)
      // => sub 뒤에 manage를 붙여 표시
      if (manage) sub += ' · ' + manage;

      var btn = document.createElement('button');
      btn.type = 'button';
      // ✅ employee_id 기준으로 다중 선택 토글
      var eid = String((r && (r.employee_id || r.emp_no || '')) || '').trim();
      // ✅ 이미 추가된 직원은 선택 불가 + 선택 UI 제거
      if (eid && addedIds.has(eid)) selectedIds.delete(eid);
      btn.className =
        'wrap-list-item'
        + (eid && selectedIds.has(eid) ? ' is-active' : '')
        + (eid && addedIds.has(eid) ? ' is-disabled' : '');
      if (eid) btn.dataset.employeeId = eid;
      if (eid && addedIds.has(eid)){
        btn.disabled = true;
        btn.setAttribute('aria-disabled', 'true');
      }
      btn.innerHTML =
        '<div class="wrap-list-icon"><i class="fa-solid fa-user"></i></div>' +
        '<div class="wrap-list-main">' +
          '<div class="wrap-list-name">' + (empNo ? (empNo + ' ') : '') + name + '</div>' +
          '<div class="wrap-list-sub">' + sub + '</div>' +
        '</div>' +
        '<div class="wrap-list-badge">' + (status || '-') + '</div>';
      empList.appendChild(btn);
    });
  }

  // ======================================================
  // ✅ 빈데이터 표기 유틸
  // - 직원명단(empList) / 연차정보(infoTbody)
  // ======================================================
  function showEmpListStatus_(msg){
    try{
      empList.innerHTML = '';
      var box = document.createElement('div');
      box.className = 'text-muted';
      box.style.padding = '0.5rem';
      box.textContent = (msg == null) ? '' : String(msg);
      empList.appendChild(box);
    }catch(e){}
  }

  function showInfoTableStatus_(msg){
    try{
      infoTbody.innerHTML = '';
      var colN = 1;
      try{
        if (infoTbl){
          var ths = infoTbl.querySelectorAll('thead tr:last-child th');
          if (ths && ths.length) colN = ths.length;
        }else if (infoTplTr && infoTplTr.children && infoTplTr.children.length){
          colN = infoTplTr.children.length;
        }
      }catch(e){}
      var tr = document.createElement('tr');
      tr.setAttribute('data-empty-row', '1');
      var td = document.createElement('td');
      td.colSpan = colN;
      td.className = 'text-muted';
      td.style.padding = '0.75rem';
      td.textContent = (msg == null) ? '' : String(msg);
      tr.appendChild(td);
      infoTbody.appendChild(tr);
    }catch(e){}
  }

  function setEmpPickable_(eid, pickable){
    eid = String(eid || '').trim();
    if (!eid) return;
    var btn = empList.querySelector('button.wrap-list-item[data-employee-id="' + eid.replace(/"/g,'&quot;') + '"]')
           || empList.querySelector('button.wrap-list-item[data-employee-id="' + eid + '"]')
           || empList.querySelector('button.wrap-list-item[data-employee-id]');
    // 위 fallback은 안전장치(대부분 첫 번째 셀렉터로 잡힘)
    btn = empList.querySelector('button.wrap-list-item[data-employee-id="' + eid + '"]');
    if (!btn) return;

    if (pickable){
      btn.disabled = false;
      btn.removeAttribute('aria-disabled');
      btn.classList.remove('is-disabled');
    }else{
      btn.disabled = true;
      btn.setAttribute('aria-disabled', 'true');
      btn.classList.add('is-disabled');
      btn.classList.remove('is-active');
      selectedIds.delete(eid);
    }
  }

  function pickStatusFilter(){
    return selStat ? (selStat.value || '전체') : '전체';
  }

  function applyEmployeeFilter(){
    var stat = pickStatusFilter();
    var list = rowsAll || [];
    if (stat && stat !== '전체'){
      list = list.filter(function(r){ return (r && r.status === stat); });
    }
    // ✅ rowsById는 rowsAll(전체 기준)로 유지 (필터로 숨겨도 선택추가 가능)
    rowsById = {};
    (rowsAll || []).forEach(function(r){
      var eid = String((r && r.employee_id) || '').trim();
      if (eid) rowsById[eid] = r;
    });
    renderEmployees(list);
  }

  function loadEmployeesOnce(done){
    if (rowsAll) { applyEmployeeFilter(); if (typeof done === 'function') done(); return; }
    var y = getSelectedYear();

    // ✅ 서버는 최초 1회만: 전체 목록을 받아 캐시에 저장
    // 로딩 표시는 스피너(UI_Loading)만 사용
    google.script.run
      .withSuccessHandler(function(res){
        var ok = !!(res && (res.ok === true || res.success === true));
        if (!ok){
          var em = (res && (res.error || res.message)) || '직원명단을 불러오지 못했습니다.';
          if (typeof showAlertError === 'function') showAlertError(em, '연차설정');
          rowsAll = [];
          renderEmployees([]);
          return;
        }
        rowsAll = (res.rows || []);
        applyEmployeeFilter();
        if (typeof done === 'function') done();
      })
      .withFailureHandler(function(err){
        if (typeof showAlertError === 'function') {
          showAlertError((err && err.message) ? err.message : String(err), '연차설정');
        }
        rowsAll = [];
        renderEmployees([]);
      })
      .LEAVE_listEmployeesForSetting({ year: y, status: '전체' });
  }

  if (selStat && !selStat.__leaveBound){
    selStat.__leaveBound = true;
    // ✅ 필터는 서버 재조회 없이 UI만
    selStat.addEventListener('change', function(e){
      if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
      applyEmployeeFilter();
    });
  }

  // ======================================================
  // ✅ 직원명단 다중선택 토글 (meta 전역 토글과 충돌 방지)
  // ======================================================
  if (!empList.__leavePickBound){
    empList.__leavePickBound = true;
    empList.addEventListener('click', function(e){
      var item = e.target.closest('button.wrap-list-item');
      if (!item || !empList.contains(item)) return;
      if (item.disabled || item.classList.contains('is-disabled')) return;
      if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
      if (e && typeof e.preventDefault === 'function') e.preventDefault();

      var eid = String(item.dataset.employeeId || '').trim();
      if (!eid) return;
      if (selectedIds.has(eid)){
        selectedIds.delete(eid);
        item.classList.remove('is-active');
      }else{
        selectedIds.add(eid);
        item.classList.add('is-active');
      }
    });
  }

  // ======================================================
  // ✅ 법정연차 계산(근무연차 기반)
  // - 1년차: 11일
  // - 2년차+: 15일 + 매 2년마다 1일 가산(최대 25일)
  // ======================================================
  function parseYearNo_(work){
    var s = (work && work.working_yearcount) ? String(work.working_yearcount) : '';
    var m = s.match(/(\d+)/);
    return m ? Number(m[1]) : NaN;
  }
  function calcStatutoryDays_(work){
    var yno = parseYearNo_(work);
    if (!isFinite(yno) || yno <= 0) return 0;
    if (yno === 1) return 11;
    var days = 15 + Math.floor((yno - 1) / 2);
    return Math.min(days, 25);
  }

  // ======================================================
  // ✅ 연도별 DB 조회 + 렌더(직원명/근무/법정연차는 Employee 캐시로 계산)
  // - 트리거: 모달 진입, 연도 변경, 저장 후 재조회
  // ======================================================
  function _dayVal_(v){
    v = String(v == null ? '' : v).trim();
    if (!v) return '';
    var m = v.match(/(\d+)/);
    return m ? (Number(m[1]) + '일') : v;
  }
  function _setText_(td, txt){
    if (!td) return;
    var el = td.querySelector('.text-tbl') || td;
    el.textContent = (txt == null ? '' : String(txt));
  }
  function _setSelect_(td, val){
    if (!td) return;
    var sel = td.querySelector('select') || td.querySelector('.select-tbl');
    if (!sel) return;
    sel.value = val || '';
  }
  function _setNote_(td, val){
    if (!td) return;
    var inp = td.querySelector('input') || td.querySelector('.input-tbl');
    if (!inp) return;
    inp.value = (val == null ? '' : String(val));
  }
  function _setUnoff_(td, val){
    if (!td) return;
    var el = td.querySelector('[data-unofficial-days]') || td.querySelector('.text-tbl') || td;
    el.textContent = val || '0일';
  }

  function renderLeaveSettingsRows_(rows){
    // 초기화
    infoTbody.innerHTML = '';
    addedIds.clear();
    selectedIds.clear();
    // 직원명단 클릭 UI 제거
    empList.querySelectorAll('.wrap-list-item.is-active').forEach(function(b){ b.classList.remove('is-active'); });

    if (!rows || !rows.length){
      showInfoTableStatus_('데이터 없음');
      return;
    }

    // ✅ DB 조회/렌더 시 사번(employee_id) 오름차순 정렬 (00001, 00002, ...)
    var sorted = (rows || []).slice().sort(function(a,b){
      var aa = String((a && a.employee_id) || '');
      var bb = String((b && b.employee_id) || '');
      return aa.localeCompare(bb, 'ko', { numeric:true });
    });

    sorted.forEach(function(x){
      var eid = String((x && x.employee_id) || '').trim();
      if (!eid) return;

      if (!infoTplTr){
        if (typeof showAlertError === 'function') showAlertError('연차정보 테이블 템플릿 행이 없습니다.', '연차설정');
        return;
      }

      var r = rowsById[eid] || null; // ✅ 직원 캐시
      var empNoTxt = eid;
      var empNameTxt = String((r && r.name) || '');
      var workPeriodTxt = (r ? fmtWorkPeriod_(r.work) : '-');
      var workYearTxt   = (r ? fmtWorkYearcount_(r.work) : '-');
      var statTxt = (calcStatutoryDays_(r ? r.work : null) || 0) + '일';

      var tr = infoTplTr.cloneNode(true);
      if (tr.dataset) tr.dataset.employeeId = eid;

      // 체크박스 활성
      var cb = tr.querySelector('input[type="checkbox"].chk-anim');
      if (cb){
        cb.disabled = false;
        cb.checked = false;
        cb.indeterminate = false;
      }

      // ✅ 현재 템플릿 컬럼:
      // 0:checkbox, 1:사번, 2:성명, 3:총근무연수, 4:총근무연차, 5:법정연차, 6:부여(select), 7:공식(select), 8:비공식(text), 9:비고(input)
      _setText_(tr.children[1], empNoTxt);
      _setText_(tr.children[2], empNameTxt);
      _setText_(tr.children[3], workPeriodTxt);
      _setText_(tr.children[4], workYearTxt);
      _setText_(tr.children[5], statTxt);

      var grantV   = _dayVal_(x.grant_days);
      var official = _dayVal_(x.official_days);
      var unoffV   = _dayVal_(x.unofficial_days);
      _setSelect_(tr.children[6], grantV);
      _setSelect_(tr.children[7], official);

      // 비공식연차: 저장값 없으면 grant-official
      if (!unoffV){
        var gN = parseInt((grantV||'').replace(/[^\d]/g,''),10);
        var oN = parseInt((official||'').replace(/[^\d]/g,''),10);
        if (isFinite(gN) && isFinite(oN)) unoffV = Math.max(0, gN - oN) + '일';
      }
      _setUnoff_(tr.children[8], unoffV || '0일');
      _setNote_(tr.children[9], x.note);

      infoTbody.appendChild(tr);

      // ✅ DB로 렌더된 행도 "선택추가"와 동일하게 UI 스코프 초기화
      // (chk-anim 표시/has-value/행체크 로직 등)
      try{
        if (typeof initAnimatedCheckboxes === 'function') initAnimatedCheckboxes(tr);
        if (window.initInputDateFields) window.initInputDateFields(tr);
        if (window.initInputTimeFields) window.initInputTimeFields(tr);
        if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(tr);
        if (window.initUnitInputs) window.initUnitInputs(tr);
        if (window.initUnitTextTbl) window.initUnitTextTbl(tr);
      }catch(e){}

      addedIds.add(eid);
      setEmpPickable_(eid, false); // ✅ 이미 추가된 직원은 선택 불가
    });

    // ✅ 헤더/행 체크박스 동작(전체선택 등) 재연결
    try{ if (window.initTableRowCheckboxes) window.initTableRowCheckboxes(infoTbl); }catch(e){}
    try{ if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(root); }catch(e){}
  }

  function loadLeaveSettingsForYear_(year){
    year = Number(year);
    if (!isFinite(year)) year = getSelectedYear();
    // 로딩 표시는 스피너(UI_Loading)만 사용
    google.script.run
      .withSuccessHandler(function(res){
        var ok = !!(res && (res.ok === true || res.success === true));
        if (!ok){
          var em = (res && (res.error || res.message)) || '연차설정 데이터를 불러오지 못했습니다.';
          if (typeof showAlertError === 'function') showAlertError(em, '연차설정');
          renderLeaveSettingsRows_([]);
          return;
        }
        renderLeaveSettingsRows_(res.rows || []);
      })
      .withFailureHandler(function(err){
        if (typeof showAlertError === 'function') {
          showAlertError((err && err.message) ? err.message : String(err), '연차설정');
        }
        renderLeaveSettingsRows_([]);
      })
      .LEAVE_getLeaveSettings({ year: year });
  }

  // ======================================================
  // ✅ 선택추가: 우측 연차정보 테이블에 행 생성
  // - 중복 추가 방지 (tbody tr[data-employee-id])
  // - 직원: "employee_id name"
  // - 총근무연수/연차: fmtWork(row.work)
  // - 법정연차: calcStatutoryDays_(row.work)
  // ======================================================
  if (!btnAdd.__leaveAddBound){
    btnAdd.__leaveAddBound = true;
    btnAdd.addEventListener('click', function(e){
      if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
      if (e && typeof e.preventDefault === 'function') e.preventDefault();

      if (selectedIds.size === 0){
        if (typeof showAlertWarn === 'function') showAlertWarn('직원을 선택해 주세요.', '연차설정');
        return;
      }

      // ✅ "데이터 없음/로딩중" 상태 행(placeholder)이 남아있으면 제거
      // - showInfoTableStatus_()가 tbody에 data-empty-row=1 행을 1개 추가함
      try{
        var emptyRows = infoTbody.querySelectorAll('tr[data-empty-row="1"]');
        if (emptyRows && emptyRows.length){
          emptyRows.forEach(function(tr){ try{ tr.remove(); }catch(_e){} });
        }
      }catch(_e){}

      // template row: 최초 확보한 템플릿을 사용 (tbody가 비어도 OK)
      if (!infoTplTr){
        if (typeof showAlertError === 'function') showAlertError('연차정보 테이블 템플릿 행이 없습니다.', '연차설정');
        return;
      }

      // 이미 추가된 직원
      var exists = new Set();
      infoTbody.querySelectorAll('tr').forEach(function(tr){
        var eid = tr.dataset ? String(tr.dataset.employeeId || '').trim() : '';
        if (eid) exists.add(eid);
      });

      var added = 0;
      selectedIds.forEach(function(eid){
        if (!eid || exists.has(eid)) return;
        var r = rowsById[eid] || null;
        if (!r) return;

        var tr = infoTplTr.cloneNode(true);
        // ✅ 중복방지/식별용 employeeId 저장
        if (tr.dataset) tr.dataset.employeeId = String(eid);

        // 체크박스 초기화
        var cb = tr.querySelector('input[type="checkbox"].chk-anim');
        if (cb){
          cb.disabled = false;
          cb.checked = false;
          cb.indeterminate = false;
        }

        // 1) 사번 (col 1)
        var tdEmpNo = tr.children[1];
        if (tdEmpNo){
          var elNo = tdEmpNo.querySelector('.text-tbl') || tdEmpNo;
          elNo.textContent = String(r.employee_id || '');
        }

        // 2) 성명 (col 2)
        var tdName = tr.children[2];
        if (tdName){
          var elNm = tdName.querySelector('.text-tbl') || tdName;
          elNm.textContent = String(r.name || '');
        }

        // 3) 총근무연수 (col 3)
        var tdWorkP = tr.children[3];
        if (tdWorkP){
          var elP = tdWorkP.querySelector('.text-tbl') || tdWorkP;
          elP.textContent = fmtWorkPeriod_(r.work);
        }

        // 4) 총근무연차 (col 4)
        var tdWorkY = tr.children[4];
        if (tdWorkY){
          var elY = tdWorkY.querySelector('.text-tbl') || tdWorkY;
          elY.textContent = fmtWorkYearcount_(r.work);
        }

        // 5) 법정연차 (col 5)
        var tdLaw = tr.children[5];
        if (tdLaw){
          var el3 = tdLaw.querySelector('.text-tbl') || tdLaw;
          el3.textContent = calcStatutoryDays_(r.work) + '일';
        }

        // ✅ 비공식연차(col 8): select가 있으면 제거하고 text-tbl로 교체
        var tdUnoff = tr.children[8];
        if (tdUnoff){
          var sel = tdUnoff.querySelector('select');
          if (sel) sel.remove();
          var box = tdUnoff.querySelector('[data-unofficial-days]') || tdUnoff.querySelector('.text-tbl');
          if (!box){
            box = document.createElement('div');
            box.className = 'text-tbl';
            box.setAttribute('data-unofficial-days','');
            tdUnoff.innerHTML = '';
            tdUnoff.appendChild(box);
          }
          box.textContent = '-';
        }
        infoTbody.appendChild(tr);
        added++;

        // ✅ 신규행 UI 재초기화(체크박스/has-value/단위표시 등 meta의 initUiScope 규칙과 동일)
        try{
          if (typeof initAnimatedCheckboxes === 'function') initAnimatedCheckboxes(tr);
          if (window.initInputDateFields) window.initInputDateFields(tr);
          if (window.initInputTimeFields) window.initInputTimeFields(tr);
          if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(tr);
          if (window.initTableRowCheckboxes) window.initTableRowCheckboxes(infoTbl);
          if (window.initUnitInputs) window.initUnitInputs(tr);
          if (window.initUnitTextTbl) window.initUnitTextTbl(tr);
        }catch(err){}
      });

      if (added === 0){
        if (typeof showAlertInfo === 'function') showAlertInfo('추가할 직원이 없습니다. (이미 추가된 직원)', '연차설정');
      }
      // ✅ 추가된 직원은 직원명단에서 선택 불가 처리 + 선택 UI 제거
      selectedIds.forEach(function(eid){
        if (!eid) return;
        addedIds.add(eid);
        setEmpPickable_(eid, false);
      });
      selectedIds.clear();

      // ✅ 전체선택 체크박스 동기화
      syncInfoHeaderCheckbox_();

      // ✅ 테이블/모달 전체 has-value 재계산(선택추가 후)
      try{ if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(root); }catch(e){}
    });
  }

  // ======================================================
  // ✅ 연차정보: 체크박스 / 전체선택 / 선택삭제
  // ======================================================
  function getInfoRowCheckboxes_(){
    return Array.from(infoTbody.querySelectorAll('tr input[type="checkbox"].chk-anim'));
  }

  function syncInfoHeaderCheckbox_(){
    if (!cbAll) return;
    var cbs = getInfoRowCheckboxes_();
    if (cbs.length === 0){
      cbAll.checked = false;
      cbAll.indeterminate = false;
      return;
    }
    var checked = cbs.filter(function(x){ return x.checked; }).length;
    cbAll.checked = (checked === cbs.length);
    cbAll.indeterminate = (checked > 0 && checked < cbs.length);
  }

  // row checkbox change -> header sync
  if (!infoTbody.__leaveCbBound){
    infoTbody.__leaveCbBound = true;
    infoTbody.addEventListener('change', function(e){
      var el = e.target;
      if (!el || el.type !== 'checkbox') return;
      if (el.classList && el.classList.contains('chk-anim')){
        syncInfoHeaderCheckbox_();
      }
    });
  }

  // ======================================================
  // ✅ 비공식연차 자동 계산: (부여연차 - 공식연차)
  // - 부여/공식 select 변경 시 해당 행의 비공식을 갱신
  // ======================================================
  function parseDays_(v){
    if (v == null) return NaN;
    if (typeof v === 'number') return v;
    var s = String(v).trim();
    if (!s) return NaN;
    var m = s.match(/(\d+)/);
    return m ? Number(m[1]) : NaN;
  }

  function updateUnofficialDays_(tr){
    if (!tr) return;
    var tdGrant = tr.children[6]; // 부여연차
    var tdOffic = tr.children[7]; // 공식연차
    var tdUnoff = tr.children[8]; // 비공식연차
    if (!tdGrant || !tdOffic || !tdUnoff) return;

    var sGrant = tdGrant.querySelector('select.select-tbl');
    var sOffic = tdOffic.querySelector('select.select-tbl');
    var grant = parseDays_(sGrant ? sGrant.value : '');
    var offic = parseDays_(sOffic ? sOffic.value : '');

    var box = tdUnoff.querySelector('[data-unofficial-days]') || tdUnoff.querySelector('.text-tbl');
    if (!box){
      box = document.createElement('div');
      box.className = 'text-tbl';
      box.setAttribute('data-unofficial-days','');
      tdUnoff.innerHTML = '';
      tdUnoff.appendChild(box);
    }

    if (!isFinite(grant) || !isFinite(offic)){
      box.textContent = '-';
      return;
    }
    var diff = grant - offic;
    if (diff < 0) diff = 0; // ✅ 음수 방지(원하면 음수 허용으로 변경 가능)
    box.textContent = diff + '일';
  }

  if (!infoTbody.__leaveUnoffBound){
    infoTbody.__leaveUnoffBound = true;
    infoTbody.addEventListener('change', function(e){
      var t = e.target;
      if (!t || !t.matches) return;
      if (!t.matches('select.select-tbl')) return;
      var tr = t.closest('tr');
      if (!tr) return;
      updateUnofficialDays_(tr);
    });
  }
  
  // header select-all
  if (cbAll && !cbAll.__leaveAllBound){
    cbAll.__leaveAllBound = true;
    cbAll.addEventListener('change', function(e){
      var on = !!cbAll.checked;

// ======================================================
// ✅ 모달 현재 상태에서 저장 payload 만들기(전역)
// - year: 적용연도(YYYY)
// - rows: 연차정보 테이블 행들
// ======================================================
function LeaveSet_collectSavePayload_(){
  var bodyHost = document.querySelector('#appPageModal [data-role="page-modal-body"]');
  if (!bodyHost || !bodyHost.__leaveSetApi) return null;
  var api = bodyHost.__leaveSetApi;
  var year = api.getSelectedYear ? api.getSelectedYear() : '';
  year = String(year || '').trim();
  var y = year ? Number(year) : NaN;
  if (!isFinite(y)) return null;

  var tb = api.infoTbody;
  if (!tb) return { year: y, rows: [] };

  function parseDays_(v){
    if (v == null) return NaN;
    var s = String(v).trim();
    if (!s) return NaN;
    var m = s.match(/(\d+)/);
    return m ? Number(m[1]) : NaN;
  }

  var out = [];
  Array.from(tb.querySelectorAll('tr')).forEach(function(tr){
    var eid = (tr.dataset && tr.dataset.employeeId) ? String(tr.dataset.employeeId).trim() : '';
    if (!eid) return;

    var statutoryTxt = tr.children[5] ? (tr.children[5].innerText || tr.children[5].textContent || '') : '';
    var statutory = parseDays_(statutoryTxt);

    var grantSel = tr.children[6] ? tr.children[6].querySelector('select.select-tbl') : null;
    var officSel = tr.children[7] ? tr.children[7].querySelector('select.select-tbl') : null;
    var unoffBox = tr.children[8] ? (tr.children[8].querySelector('[data-unofficial-days]') || tr.children[8].querySelector('.text-tbl')) : null;
    var noteInp  = tr.children[9] ? tr.children[9].querySelector('input.input-tbl') : null;

    var grant = parseDays_(grantSel ? grantSel.value : '');
    var offic = parseDays_(officSel ? officSel.value : '');
    var unoff = parseDays_(unoffBox ? (unoffBox.textContent || '') : '');

    out.push({
      employee_id: eid,
      year: y,
      statutory_days: isFinite(statutory) ? statutory : 0,
      grant_days:     isFinite(grant) ? grant : 0,
      official_days:  isFinite(offic) ? offic : 0,
      unofficial_days:isFinite(unoff) ? unoff : Math.max((isFinite(grant)?grant:0) - (isFinite(offic)?offic:0), 0),
      note: noteInp ? String(noteInp.value || '') : ''
    });
  });

  return { year: y, rows: out };
}

 * - 선택삭제: 체크박스 선택된 행만 삭제(is_deleted=1)
 * ====================================================== */
function _setLeaveApprovalFlowLoading_(on){
  var root = document.getElementById('leave-root') || document.body || document;
  try{
    if (window.UI_Loading){
      if (on) UI_Loading.show(root, { key:'leave-approval-flow', text:'' });

    }

function _reloadLeaveMainAfterApproval_(root){
  return new Promise(function(resolve){
    try{
      root = root || document.getElementById('leave-root');
      var yearSel = root ? root.querySelector('[data-leave-year-select]') : null;
      if (!root || !yearSel){
        resolve({ ok:true });
        return;
      }

      var reloadToken = 'approval-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      var done = false;
      var timer = null;

      function finish_(ok, msg){
        if (done) return;
        done = true;
        try{ root.removeEventListener('leave:main-loaded', onLoaded_); }catch(e){}
        try{ if (timer) clearTimeout(timer); }catch(e){}
        resolve({ ok: ok !== false, error: msg || '' });
      }
      function onLoaded_(ev){
        var d = (ev && ev.detail) ? ev.detail : {};
        if (String(d.reloadToken || '') !== reloadToken) return;
        finish_(d.success !== false, d.error || '');
      }

      root.addEventListener('leave:main-loaded', onLoaded_);
      timer = setTimeout(function(){ finish_(false, '재조회 완료를 확인하지 못했습니다.'); }, 12000);
      try{
        root.__leaveSilentReload = true;
        root.__leaveReloadToken = reloadToken;
      }catch(e){}
      yearSel.dispatchEvent(new Event('change'));
    }catch(e){
      resolve({ ok:false, error: (e && e.message) ? e.message : String(e) });
    }
  });
}

// ======================================================
// ✅ 요약카드(발생/사용/잔여 + 승인모드 건수) 갱신
// - 발생연차: Leave 시트 unofficial_days 합계(연도)
// - 사용연차(신청/승인): Leave_Apply days 합계(상태별)
// - 잔여연차: 발생 - 사용(승인)
