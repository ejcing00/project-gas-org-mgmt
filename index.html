<!-- index.html -->
<!DOCTYPE html>
<html>
  <head>
    <?!= include('meta'); ?>
    <?!= include('driveFileUtil'); ?>
    <?!= include('excelDownload'); ?>
  </head>
  <body>
    <div id="app-shell">
      <?!= include('aclUi'); ?>
      <?!= include('sidebar'); ?>
      <main id="main-content">
        <div class="main-card">        
          <div id="page-container"></div>
          <?!= include('dashboard'); ?>
          <?!= include('project'); ?>
          <?!= include('employee'); ?>
          <?!= include('payroll'); ?>
          <?!= include('leave'); ?>
          <?!= include('overtime'); ?>
          <?!= include('workstudy'); ?>
          <?!= include('accesscontrol'); ?>
          <?!= include('styleguide'); ?>
        </div>
      </main>
      <?!= include('alertmodal'); ?>
      <?!= include('pagemodal'); ?>
    </div>

    <script>
      window.App = (function () {
        var PAGE_TEMPLATES = {
          dashboard: 'tpl-dashboard',
          project: 'tpl-project',
          employee: 'tpl-employee',
          payroll: 'tpl-payroll',
          leave: 'tpl-leave',
          overtime: 'tpl-overtime',
          workstudy: 'tpl-workstudy',
          accesscontrol: 'tpl-accesscontrol',
          styleguide: 'tpl-styleguide'
        };
        var PAGE_INIT_HANDLERS = {
          dashboard: 'Dashboard_init',
          accesscontrol: 'AccessControl_init',
          project: 'Project_init',
          employee: 'Employee_init',
          payroll: 'Payroll_init',
          overtime: 'Overtime_init',
          leave: 'Leave_init'
        };
        var _pageLoadSeq = 0;

        function _toPromise_(v){
          if (v && typeof v.then === 'function') return v;
          return Promise.resolve(v);
        }

        function _runPageInit_(page, container){
          var fnName = PAGE_INIT_HANDLERS[page];
          var fn = fnName ? window[fnName] : null;
          if (typeof fn !== 'function') return Promise.resolve();
          try{
            return _toPromise_(fn(container));
          }catch(e){
            console.error('[APP] page init error:', page, e);
            return Promise.resolve();
          }
        }

        function loadPage(page) {
          var container = document.getElementById('page-container');
          if (!container) return;

          // fallback 은 dashboard 대신 home 이 더 안전
          var tplId = PAGE_TEMPLATES[page] || PAGE_TEMPLATES.dashboard;
          var tpl   = document.getElementById(tplId);

          if (tpl && 'content' in tpl) {
            container.innerHTML = '';
            container.appendChild(tpl.content.cloneNode(true));
          } else {
            container.innerHTML = '<p>준비 중인 페이지입니다.</p>';
          }

          // 사이드바 active 표시
          var links = document.querySelectorAll('#sidebar a[data-page]');
          links.forEach(function (a) {
            if (a.getAttribute('data-page') === page) {
              a.classList.add('is-active');
            } else {
              a.classList.remove('is-active');
            }
          });
          
          if (window.initTooltipPortal) window.initTooltipPortal(container);
          if (window.initIconTooltips) window.initIconTooltips(container);

          if (window.initUiScope) window.initUiScope(container);
          if (typeof ACL_applyToScope === 'function') ACL_applyToScope(container);

          var seq = ++_pageLoadSeq;
          var useEnterLoading = (page !== 'leave');
          try{
            if (useEnterLoading && window.UI_Loading) {
              UI_Loading.show(container, { key:'app-page-enter', global:false, text:'' });
            }
          }catch(e){}
          _runPageInit_(page, container)
            .catch(function(e){
              console.error('[APP] page init promise rejected:', page, e);
            })
            .finally(function(){
              if (seq !== _pageLoadSeq) return;
              try{
                if (useEnterLoading && window.UI_Loading) {
                  UI_Loading.hide(container, { key:'app-page-enter', global:false });
                }
              }catch(e){}
            });
        }

        return {
          loadPage: loadPage
        };
      })();

      document.addEventListener('DOMContentLoaded', function () {
        console.log('[APP] app-shell loaded');

        var _bootLoadingDone = false;
        function _showBootLoading_(){
          try{
            if (window.UI_Loading) UI_Loading.show(document.body, { key:'app-boot', boot:true, text:'' });
          }catch(e){}
        }
        function _hideBootLoading_(){
          if (_bootLoadingDone) return;
          _bootLoadingDone = true;
          try{
            if (window.UI_Loading) UI_Loading.hide(document.body, { key:'app-boot' });
          }catch(e){}
        }
        function _loadFirstPage_(){
          if (window.App) window.App.loadPage('dashboard');
          setTimeout(_hideBootLoading_, 0);
        }

        _showBootLoading_();

        if (typeof ACL_bindSidebar === 'function') ACL_bindSidebar();

        if (typeof ACL_bootstrap === 'function'){
          ACL_bootstrap(function(ok, res){
            if (!ok){
              if (typeof showAlertError === 'function') {
                showAlertError((res && res.message) ? res.message : 'ACL 로드 실패', '권한');
              }
            } else {
              if (typeof ACL_startSecurityWatch === 'function') {
                ACL_startSecurityWatch({ intervalMs: 10 * 60 * 1000 }); // 10분
              }
            }
            _loadFirstPage_();
          });
        } else {
          _loadFirstPage_();
        }
      });
    </script>
  </body>
</html>
