<!--payroll.html-->
<template id="tpl-payroll">
  <div class="page-root">
    <div class="hr-opt">
      <hr class="hr-out-bar">
      <div class="hr-txt hr-left">
        <div class="d-flex align-items-center gap-1">
          <div style="margin-right: 0.25rem">근태/급여기간</div>
          <select class="select1" style="width:100px;" data-payroll-from-year aria-label="FROM 연도"></select>
          <select class="select1" style="width:80px;" data-payroll-from-month aria-label="FROM 월"></select>
          <div style="opacity:.8;">~</div>
          <select class="select1" style="width:100px;" data-payroll-to-year aria-label="TO 연도"></select>
          <select class="select1" style="width:80px;" data-payroll-to-month aria-label="TO 월"></select>
          <button type="button" class="btn-icon btn-icon-l" data-tt-disabled="true" data-action="payroll:search"><i class="fa-solid fa-magnifying-glass"></i></button>
          <div class="d-flex align-items-center gap-1" style="margin-left:.35rem; padding:0 .25rem;">
            <input type="checkbox" class="chk-anim" data-payroll-keep-filter aria-label="필터 유지">
            <span style="font-size: var(--t-size-1); opacity:.85; pointer-events:none;">필터 유지</span>
          </div>
          <div data-payroll-status style="opacity:.75; margin-left:.5rem;"></div>
        </div>
      </div>
      <div class="hr-txt hr-right">
        <div class="d-flex align-items-center gap-2">
          <button type="button" class="btn-circle" data-action="btn:payroll:stdset" data-acl="btn:payroll:stdset">
            <span class="icon"><i class="fa-solid fa-hand-holding-dollar"></i></span>
            <span class="text">급여기준</span>
          </button>
          <button type="button" class="btn-circle" data-action="btn:payroll:paymentset" data-acl="btn:payroll:paymentset">
            <span class="icon"><i class="fa-solid fa-receipt"></i></span>
            <span class="text">급여지급내역</span>
          </button>
          <button type="button" class="btn-circle" data-sec-toggle="#payroll-filter-list">
            <span class="icon"><i class="fa-solid fa-filter"></i></span>
            <span class="text">필터 표시/숨김</span>
          </button>
        </div>
      </div>
    </div>
    <div class="page-body">
      <div class="sec" id="payroll-filter-list" style="min-height:175px; max-height:175px;">
        <div class="sec-header">
          <div></div>
          <div class="d-flex gap-1">
            <button type="button" class="btn-icon bubble btn-icon-s" data-wf-reset="active" data-wf-target="#payroll-filter-list .wrap-filter" aria-label="현재필터항목만 해제"><i class="fa-solid fa-xmark"></i></button>
            <button type="button" class="btn-icon bubble btn-icon-s btn-icon-violet" data-wf-reset="all" data-wf-target="#payroll-filter-list .wrap-filter" aria-label="필터 전체해제"><i class="fa-solid fa-xmarks-lines"></i></button>
          </div>
        </div>
        <div class="sec-body">
          <div class="wrap-filter" data-mode="panel">
            <div class="wf-left wf-sub wrap-list" aria-label="소분류">
              <button type="button" class="wrap-list-item is-active" data-sub="staff">
                <div class="wrap-list-main">
                  <div class="wrap-list-name">직원</div>
                  <span class="wf-ind" aria-hidden="true"></span>
                </div>
              </button>
              <button type="button" class="wrap-list-item" data-sub="status_now">
                <div class="wrap-list-main">
                  <div class="wrap-list-name">고용상태(현재)</div>
                  <span class="wf-ind" aria-hidden="true"></span>
                </div>
              </button>
              <button type="button" class="wrap-list-item" data-sub="status_working">
                <div class="wrap-list-main">
                  <div class="wrap-list-name">고용상태(근무시점)</div>
                  <span class="wf-ind" aria-hidden="true"></span>
                </div>
              </button>
              <button type="button" class="wrap-list-item" data-sub="working_yearcount">
                <div class="wrap-list-main">
                  <div class="wrap-list-name">총근무연차</div>
                  <span class="wf-ind" aria-hidden="true"></span>
                </div>
              </button>
              <button type="button" class="wrap-list-item" data-sub="position">
                <div class="wrap-list-main">
                  <div class="wrap-list-name">직위</div>
                  <span class="wf-ind" aria-hidden="true"></span>
                </div>
              </button>
              <button type="button" class="wrap-list-item" data-sub="expertise">
                <div class="wrap-list-main">
                  <div class="wrap-list-name">직무전문성</div>
                  <span class="wf-ind" aria-hidden="true"></span>
                </div>
              </button>
            </div>
            <div class="wf-right">
              <div class="wf-panel scroll-y is-active" data-sub="staff">
                <div class="wf-search">
                  <div class="input-search-wrap">
                    <i class="fa-solid fa-magnifying-glass input-search-icon"></i>
                    <input type="search" class="input1 input-search" placeholder="필터 검색" data-wf-q>
                  </div>
                </div>
                <div class="wf-chips" data-payroll-staff-chips></div>
              </div>
              <div class="wf-panel scroll-y" data-sub="status_now">
                <div class="wf-chips">
                  <button type="button" class="wf-chip" data-key="status_now" data-value="재직">재직</button>
                  <button type="button" class="wf-chip" data-key="status_now" data-value="퇴직">퇴직</button>
                </div>
              </div>
              <div class="wf-panel scroll-y" data-sub="status_working">
                <div class="wf-chips">
                  <button type="button" class="wf-chip" data-key="status_working" data-value="재직">재직</button>
                  <button type="button" class="wf-chip" data-key="status_working" data-value="퇴직">퇴직</button>
                </div>
              </div>
              <div class="wf-panel scroll-y" data-sub="status_contract">
                <div class="wf-chips">
                  <button type="button" class="wf-chip" data-key="status_contract" data-value="계약시작">계약시작</button>
                  <button type="button" class="wf-chip" data-key="status_contract" data-value="계약종료">계약종료</button>
                </div>
              </div>
              <div class="wf-panel scroll-y" data-sub="working_yearcount">
                <div class="wf-chips">
                  <button type="button" class="wf-chip" data-key="working_yearcount" data-value="1년치">1년차</button>
                  <button type="button" class="wf-chip" data-key="working_yearcount" data-value="2년차">2년차</button>
                  <button type="button" class="wf-chip" data-key="working_yearcount" data-value="3년차">3년차</button>
                  <button type="button" class="wf-chip" data-key="working_yearcount" data-value="4년차">4년차</button>
                  <button type="button" class="wf-chip" data-key="working_yearcount" data-value="5년차">5년차</button>
                  <button type="button" class="wf-chip" data-key="working_yearcount" data-value="6년차">6년차</button>
                  <button type="button" class="wf-chip" data-key="working_yearcount" data-value="7년차">7년차</button>
                  <button type="button" class="wf-chip" data-key="working_yearcount" data-value="8년차">8년차</button>
                  <button type="button" class="wf-chip" data-key="working_yearcount" data-value="9년차">9년차</button>
                  <button type="button" class="wf-chip" data-key="working_yearcount" data-value="10년차">10년차</button>
                  <button type="button" class="wf-chip" data-key="working_yearcount" data-value="11년차이상">11년차이상</button>
                </div>
              </div>
              <div class="wf-panel scroll-y" data-sub="position">
                <div class="wf-chips">
                  <button type="button" class="wf-chip" data-key="position" data-value="매니저">매니저</button>
                  <button type="button" class="wf-chip" data-key="position" data-value="선임매니저">선임매니저</button>
                  <button type="button" class="wf-chip" data-key="position" data-value="책임매니저">책임매니저</button>
                  <button type="button" class="wf-chip" data-key="position" data-value="수석매니저">수석매니저</button>
                  <button type="button" class="wf-chip" data-key="position" data-value="총괄매니저">총괄매니저</button>
                </div>
              </div>
              <div class="wf-panel scroll-y" data-sub="expertise">
                <div class="wf-chips">
                  <button type="button" class="wf-chip" data-key="expertise" data-value="미보유">미보유</button>
                  <button type="button" class="wf-chip" data-key="expertise" data-value="자격보유">자격보유</button>
                  <button type="button" class="wf-chip" data-key="expertise" data-value="석사보유">석사보유</button>
                  <button type="button" class="wf-chip" data-key="expertise" data-value="전체보유">전체보유</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="sec fill" data-sec-tabs>
        <div class="sec-header">
          <div class="sec-tabs" role="tablist">
            <button type="button" class="sec-tab is-active" data-tab="payroll-info1-list" role="tab" aria-selected="true">직원 근태</button>
            <button type="button" class="sec-tab" data-tab="payroll-info2-list" role="tab" aria-selected="true">직원 급여</button>
          </div>
          <div class="sec-action" aria-label="탭 액션"></div>
          <div class="sec-action-bank" hidden>
            <div data-actions="payroll-info1-list">
              <button type="button" class="btn-icon bubble btn-icon-green" aria-label="Download" data-acl="btn:payroll:download" data-action="export:payroll:list" data-payroll-sheets="attendance,budget,actual"><i class="fa-solid fa-file-excel"></i></button>
            </div>
            <div data-actions="payroll-info2-list">
              <button type="button" class="btn-icon bubble btn-icon-green" aria-label="Download" data-acl="btn:payroll:download" data-action="export:payroll:list" data-payroll-sheets="attendance,budget,actual"><i class="fa-solid fa-file-excel"></i></button>
            </div>
          </div>
        </div>
        <div class="sec-body">
          <div class="sec-panel is-active" data-panel="payroll-info1-list" role="tabpanel">
            <div class="wrap wrap-tbl fill scroll-xy tbl-sticky">
              <table class="tbl">
                <thead>
                  <tr>
                    <th rowspan="2">근태기간</th>
                    <th colspan="3">직원정보</th>
                    <th colspan="6">근무정보</th>
                    <th colspan="2">직위정보</th>
                    <th rowspan="2">직무전문성</th>
                  </tr>
                  <tr>
                    <th>사번</th><th>성명</th><th>고용상태(현재)</th>
                    <th>고용상태(근무시점)</th><th>계약시작일</th><th>계약종료일</th><th>근무일수</th><th>총근무연수</th><th>총근무연차</th>
                    <th>직위</th><th>직위유지기간</th>
                  </tr>
                </thead>
                <tbody data-payroll-tbody="attendance">
                </tbody>
              </table>
            </div>
          </div>
          <div class="sec-panel gap-2" data-panel="payroll-info2-list" role="tabpanel">
            <div class="wrap wrap-tbl fill scroll-xy tbl-sticky">
              <table class="tbl">
                <thead>
                  <tr>
                    <th rowspan="2">급여기간<br>(예정산출)</th>
                    <th colspan="3">직원정보</th>
                    <th rowspan="2">기준연봉</th>
                    <th colspan="4">고정급</th>
                    <th rowspan="2">초과근무수당</th>
                    <th rowspan="2">월급여 합계</th>
                    <th colspan="5">4대보험 회사부담금</th>
                    <th rowspan="2">월급여+4대</th>
                    <th rowspan="2">퇴직금</th>
                    <th rowspan="2">총인건비<br>(월급여+4대+퇴직금)</th>
                  </tr>
                  <tr>
                    <th>사번</th><th>성명</th><th>고용상태(현재)</th>
                    <th>기본급</th><th>직위수당</th><th>자격수당</th><th>고정급 합계</th>
                    <th>국민연금</th><th>건강보험</th><th>고용보험</th><th>산재보험</th><th>4대 합계</th>
                  </tr>
                </thead>
                <tbody data-payroll-tbody="budget">
                </tbody>
              </table>
            </div>
            <div class="wrap wrap-tbl fill scroll-xy tbl-sticky">
              <table class="tbl">
                <thead>
                  <tr>
                    <th rowspan="2">급여기간<br>(지급완료)</th>
                    <th colspan="3">직원정보</th>
                    <th colspan="3">월급여</th>
                    <th colspan="5">4대보험 회사부담금</th>
                    <th rowspan="2">월급여+4대</th>
                    <th rowspan="2">퇴직금</th>
                    <th rowspan="2">총인건비<br>(월급여+4대+퇴직금)</th>
                  </tr>
                  <tr>
                    <th>사번</th><th>성명</th><th>고용상태(현재)</th>
                    <th>고정급</th><th>초과근무수당</th><th>월급여 합계</th>
                    <th>국민연금</th><th>건강보험</th><th>고용보험</th><th>산재보험</th><th>4대 합계</th>
                  </tr>
                </thead>
                <tbody data-payroll-tbody="actual">
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
(function(){
  function qs_(root, sel){ return (root||document).querySelector(sel); }
  function qsa_(root, sel){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function esc_(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function periodKr_(p){
    p = String(p || '').trim(); // "YYYY-MM"
    var m = p.match(/^(\d{4})-(\d{1,2})$/);
    if (!m) return p;
    var y = Number(m[1]);
    var mo = Number(m[2]);
    return y + '년 ' + mo + '월';
  }

  function num_(v){
    if (v === '\u00A0') return 0; // NBSP
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    var s = String(v == null ? '' : v).trim();
    if (!s) return 0;
    // "1,000,000원" "1 000 000" "1000000" 모두 처리
    s = s.replace(/[^0-9.\-]/g, '');
    var n = Number(s || 0);
    return isFinite(n) ? n : 0;
  }
  function yyyymm_(y,m){ return y + '-' + (m<10?('0'+m):m); }

  // ===== 금액셀 렌더(프로젝트 기존 포맷 사용) =====
  // - 숫자는 "가공 없이" 넣는다. (예: 10000)
  // - 기존 text-unit 포맷 로직이 10,000원으로 표시해줌.
  function unitWonDiv_(v){
    if (v === '\u00A0') return '<div class="text-tbl text-unit" data-unit="원">\u00A0</div>';
    var n = num_(v);
    return '<div class="text-tbl text-unit" data-unit="원">' + String(n) + '</div>';
  }

  // 페이지 진입 시 호출되는 entry (index loadPage에서 Payroll_init 호출 전제)
  window.Payroll_init = function(scopeEl){
    if (!scopeEl) return;

    // ✅ wrap-filter/커스텀 체크박스 초기화
    if (typeof initFilterWraps === 'function') initFilterWraps(scopeEl);
    if (typeof initAnimatedCheckboxes === 'function') initAnimatedCheckboxes(scopeEl);

    var fyEl = qs_(scopeEl, '[data-payroll-from-year]');
    var fmEl = qs_(scopeEl, '[data-payroll-from-month]');
    var tyEl = qs_(scopeEl, '[data-payroll-to-year]');
    var tmEl = qs_(scopeEl, '[data-payroll-to-month]');

    // ✅ 필터 유지 체크박스 (체크박스만 클릭 시 동작하도록 별도 클릭 핸들러 없음)
    var keepCb   = qs_(scopeEl, 'input[data-payroll-keep-filter]');

    // 옵션 채우기(연도/월)
    var now = new Date();
    var curY = now.getFullYear();
    var curM = now.getMonth() + 1;
    // ✅ 연도 옵션: BaseSalary_Std.year 유니크 목록 기반
    fillYearsFromServer_(scopeEl, fyEl, tyEl, curY, function(){
      // ✅ (연도) 옵션/기본값 세팅 완료 후 has-value 동기화
      if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(scopeEl);
      // 연도 셀렉트가 채워지고 기본값까지 세팅된 뒤에 1회 자동조회
      loadPayrollRange_(scopeEl, readRange_());
    });
    fillMonths_(fmEl, curM);
    fillMonths_(tmEl, curM);

    if (fmEl) fmEl.value = String(curM);
    if (tmEl) tmEl.value = String(curM);

    // ✅ 초기 진입 시(프로그램으로 value 세팅) has-value 동기화
    if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(scopeEl);

    // ✅ 기간 변경 후: 자동조회 X (아무 이벤트도 연결하지 않음)
    // 조회 버튼 클릭 시에만 재조회
    // - 기본: 필터 초기화 후 조회
    // - "필터 유지" 체크 시: 필터 유지한 채 조회
    qsa_(scopeEl, '[data-action="payroll:search"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var keep = !!(keepCb && keepCb.checked);
        if (!keep) resetPayrollFiltersAll_(scopeEl);
        loadPayrollRange_(scopeEl, readRange_());
      });
    });

    // ✅ 급여기준 설정 / 급여지급내역 관리 : 모달 오픈만 연결
    qsa_(scopeEl, '[data-action="btn:payroll:stdset"]').forEach(function(btn){
      if (btn.__payrollBoundStd) return;
      btn.__payrollBoundStd = true;
      btn.addEventListener('click', function(){
        openPayrollSalaryStdModal_();
      });
    });
    qsa_(scopeEl, '[data-action="btn:payroll:paymentset"]').forEach(function(btn){
      if (btn.__payrollBoundPay) return;
      btn.__payrollBoundPay = true;
      btn.addEventListener('click', function(){
        openPayrollPaymentModal_();
      });
    });

    // ✅ 필터 변경 시: 서버 재조회 없이(직원/프로젝트와 동일) 클라이언트 필터만 적용
    var filterWrap = qs_(scopeEl, '#payroll-filter-list .wrap-filter');
    if (filterWrap && !filterWrap.__payrollFilterBound){
      filterWrap.__payrollFilterBound = true;
      var t = null;
      filterWrap.addEventListener('filterwrap:change', function(){
        if (t) clearTimeout(t);
        t = setTimeout(function(){
          applyPayrollFilter_(scopeEl);
        }, 120);
      });
    }

    function readRange_(){
      var fy = Number(String(fyEl && fyEl.value ? fyEl.value : curY).replace(/[^0-9]/g,'')) || curY;
      var fm = Number(fmEl && fmEl.value ? fmEl.value : curM);
      var ty = Number(String(tyEl && tyEl.value ? tyEl.value : curY).replace(/[^0-9]/g,'')) || curY;
      var tm = Number(tmEl && tmEl.value ? tmEl.value : curM);
      return { from_year: fy, from_month: fm, to_year: ty, to_month: tm };
    }
  };

  // =========================================================
  // Modal Open (UI only)

  function openPayrollSalaryStdModal_(){

    }

    openPageModal({

      size: 'full',
      templateId: 'tpl-payroll-salary-std-page-modal',

    // ✅ 푸터: 직전년도 복사 / 입력값 비우기 / 저장(닫지 않음)
    footerButtons: [
      {
        action:'copy_prev',
        text:'전년도 데이터 복사',
        icon:'fa-copy',
        className:'btn-box',
        close:false,

        confirm: true,
        confirmType: 'info',
        confirmTitle: '전년도 데이터 복사',

        autoAlert: true,
        successTitle: '복사 완료',
        successMessage: '전년도 데이터를 불러왔습니다. 저장을 눌러 반영하세요.',

        // ✅ 비동기 처리: return false + done() 직접 호출
        onClick: function(e, modalEl, bodyHost, done){
          // openPageModal이 (e, modalEl, bodyHost, done)으로 넘겨주므로 그대로 쓰면 됨
          PAYROLL_STD_copyPrevYearAsync_(modalEl)
            .then(function(ret){
              // pagemodal은 성공 시 message를 안 쓰므로, ok만 넘기고 성공문구는 cfg.successMessage로 띄움
              done({ ok:true });
            })
            .catch(function(err){
              done({ ok:false, error: (err && err.message) ? err.message : String(err) });
            });
          return false; // ✅ 비동기(done 직접 호출)
        }
      },
      { action:'clear_ui',  text:'입력값 전체 비우기',     icon:'fa-solid fa-eraser', className:'btn-box', close:false },
      { action:'save',      text:'저장',                   icon:'fa-floppy-disk', className:'btn-box btn-box-blue', close:false }
    ],

    // ✅ 커스텀 액션 처리
    onAction: function(action){
      // openPageModal 구현마다 인자 형태가 달라서, modalEl을 최대한 안전하게 찾는다.
      var modalEl = null;
      for (var i=0; i<arguments.length; i++){
        var a = arguments[i];
        if (a && a.nodeType === 1){
          // 급여기준 모달 바디 템플릿을 포함하고 있으면 modalEl로 인정
          if (a.querySelector && a.querySelector('[data-salarystd-years]')) { modalEl = a; break; }
          if (a.dataset && (a.dataset.salarystdYear != null)) { modalEl = a; break; }
        }
      }
      if (!modalEl){
        // fallback: 현재 열린 모달
        modalEl = document.querySelector('.modal.show') || document.querySelector('.app-page-modal.show');
      }
      if (!modalEl) return;

      var year = String(modalEl.dataset.salarystdYear || '').trim();
      if (!/^\d{4}$/.test(year)){
        if (window.showAlertError) window.showAlertError('적용연도를 먼저 선택해주세요.', '급여기준');
        else alert('적용연도를 먼저 선택해주세요.');
        return;
      }

      // (A) 입력값 전체 비우기 (DB 영향 X)
      if (action === 'clear_ui'){
        PAYROLL_STD_clearAllUi_(modalEl);
        PAYROLL_STD_applyUnitFormat_(modalEl);
        return;
      }

      // (B) 직전년도 급여기준 복사 (DB 저장 X, UI만 채움)
      if (action === 'copy_prev'){
        // ✅ copy_prev는 footerButtons.onClick에서 비동기로 처리함 (여기서는 아무 것도 하지 않음)
        return;
      }
    },

    // ✅ 저장 로직은 공통 저장 액션(onSave)로: Promise return (버튼 잠금/해제 정상 동작)
    onSave: function(e, modalEl, bodyHost){
      var year = String(modalEl.dataset.salarystdYear || '').trim();
      if (!/^\d{4}$/.test(year)){
        // 공통 알림을 쓰고 싶으면 ok:false로 돌려도 되고,
        // 여기선 즉시 에러 알림 한번만 띄움
        if (window.showAlertError) window.showAlertError('적용연도를 먼저 선택해주세요.', '급여기준');
        else alert('적용연도를 먼저 선택해주세요.');
        return { ok:false };
      }

      var payload = PAYROLL_STD_collectPayload_(modalEl, year);
      PAYROLL_STD_setBusy_(modalEl, true, '저장 중...');

      return new Promise(function(resolve){
        google.script.run
          .withSuccessHandler(function(res){
            PAYROLL_STD_setBusy_(modalEl, false);
            if (!res || !res.ok){
              resolve({ ok:false, error: (res && res.message) ? res.message : '저장 실패' });
              return;
            }
            // ✅ 저장 성공 후 재로드(모달은 close:false라 안 닫힘)
            PAYROLL_STD_loadYear_(modalEl, year);
            resolve({ ok:true });
          })
          .withFailureHandler(function(err){
            PAYROLL_STD_setBusy_(modalEl, false);
            resolve({ ok:false, error: (err && err.message) ? err.message : String(err || 'Unknown error') });
          })
          .PAYROLL_saveSalaryStd(payload);
      });
    },

      onOpen: function(modalEl){
        // ===============================
        // 1) 적용연도 목록 자동 생성
        // - 시작: 2025
        // - 10월(>=10)이면 내년도까지 자동 생성
        // - 모달 최초 진입 시 오늘 기준 연도 자동 선택
        // ===============================

        var listEl =
          modalEl.querySelector('[data-salarystd-years]') ||
          modalEl.querySelector('.wrap.wrap-list.fill') || null;
        if (!listEl){
          // 연도 영역을 못 찾으면 여기서 종료(HTML 구조 확인 필요)
          console.warn('적용연도 목록 컨테이너를 찾지 못했습니다.');
          return;
        }

        // 버튼 생성(중복 생성 방지)
        if (!listEl.__yearsFilled){
          listEl.__yearsFilled = true;

          var now = new Date();
          var curY = now.getFullYear();
          var curM = now.getMonth() + 1;

          var startY = 2025;
          var endY = (curM >= 10) ? (curY + 1) : curY;
          if (endY < startY) endY = startY;

          // 컨테이너 비우고 생성
          listEl.innerHTML = '';
          for (var y = startY; y <= endY; y++){
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'wrap-list-item';
            btn.setAttribute('data-salarystd-year', String(y));
            btn.innerHTML =
              '<div class="wrap-list-main">' +
                '<div class="wrap-list-name">' + y + '년</div>' +
              '</div>';
            listEl.appendChild(btn);
          }

          // 클릭 → 선택 + 로드
          listEl.addEventListener('click', function(e){
            // ✅ 공용 wrap-list 토글(document click)과 충돌 방지
            // - PAYROLL_STD_selectYear_가 is-active를 붙이면 공용 핸들러가 '이미 활성 항목 클릭'으로 판단해
            //   다시 is-active를 제거해버릴 수 있음.
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();

            var btn = e.target.closest('.wrap-list-item[data-salarystd-year]');
            if (!btn) return;
            var y = String(btn.getAttribute('data-salarystd-year') || '').trim();
            if (!/^\d{4}$/.test(y)) return;
            PAYROLL_STD_selectYear_(modalEl, listEl, y);
            PAYROLL_STD_loadYear_(modalEl, y);
          }, true);
        }

        // 기본 선택(오늘 기준)
        var now2 = new Date();
        var defaultY = String(Math.max(2025, now2.getFullYear()));
        PAYROLL_STD_selectYear_(modalEl, listEl, defaultY);
        PAYROLL_STD_loadYear_(modalEl, defaultY);
      }
    });
  }
