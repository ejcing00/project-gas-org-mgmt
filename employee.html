/** Employee_File: 저장 직전 pending 파일을 Drive에 업로드하고 row에 file_id/drive_url 등을 채운다 */
function _empUploadPendingEmployeeFiles_(rootEl, opts){
  opts = opts || {};
  var useSpinner = (opts.spinner !== false);
  return new Promise(function(resolve, reject){
    try{
      var table = rootEl.querySelector('table.tbl[data-entity="Employee_File"]');
      if (!table || !table.tBodies || !table.tBodies[0]) return resolve();

      var mode = String(rootEl.dataset.mode || '').trim() || 'view';
      if (mode === 'view') return resolve();

      if (!window.DriveFileUtil || typeof window.DriveFileUtil.upload !== 'function') {
        return reject(new Error('DriveFileUtil이 없습니다. driveFileUtil.html 포함 여부를 확인해주세요.'));
      }

      var empEl = rootEl.querySelector('[data-field="employee_id"][data-pk="1"]')
               || rootEl.querySelector('[name="employee_id"], [data-field="employee_id"]');
      var empId = String(empEl ? empEl.value : '').trim();
      if (!empId) return reject(new Error('사번(employee_id) 입력이 필요합니다.'));

      function setField_(tr, field, value){
        var el = tr.querySelector('[data-field="'+field+'"]');
        if (!el) return;
        if (el.matches && el.matches('input,select,textarea')) el.value = (value == null ? '' : String(value));
        else el.textContent = (value == null ? '' : String(value));
      }


      var trs = Array.from(table.tBodies[0].rows);
      var pendings = trs.filter(function(tr){ return !!tr.__empPendingFile; });

      if (!pendings.length) return resolve();

      var folderKey = 'Employee_File/' + empId;

      var i = 0;
      function next(){
        if (i >= pendings.length) return resolve();
        var tr = pendings[i++];
        var file = tr.__empPendingFile;
        if (!file) return next();

        if (useSpinner) _empShowLoading_(rootEl, 'employee-file-upload');

        window.DriveFileUtil.upload({ folderKey: folderKey, file: file })
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.message) ? res.message : '업로드 실패');

            // 업로드 결과 반영
            var fileId  = res.file_id || '';
            var url     = res.drive_url || '';
            var mime    = res.mime_type || (file.type || '');
            var bytes   = Number(res.size || file.size || 0) || 0;

            var sp = _empSplitFileName_(res.file_name || file.name || '');

            // ✅ DB에는 확장자 포함 file_name 저장
            setField_(tr, 'file_id', fileId);
            setField_(tr, 'drive_url', url);
            setField_(tr, 'mime_type', mime);
            setField_(tr, 'size', String(bytes));

            // UI base/ext 업데이트(사용자가 base를 수정했으면 base 우선)
            var baseEl = tr.querySelector('[data-field="file_name"]');
            var base = baseEl && baseEl.value ? String(baseEl.value||'').trim() : sp.base;
            tr.dataset.empFileExt = tr.dataset.empFileExt || (sp.ext || '');
            var extEl = tr.querySelector('[data-emp-file-ext]');
            if (extEl) extEl.textContent = tr.dataset.empFileExt || (sp.ext || '');

            var sizeBox = tr.querySelector('[data-emp-file-size]');
            if (sizeBox) sizeBox.textContent = _empFmtBytes_(bytes);

            // pending 제거
            tr.__empPendingFile = null;
            delete tr.dataset.empPending;

          })
          .then(function(){ next(); })
          .catch(function(err){ reject(err); })
          .finally(function(){
            if (useSpinner) _empHideLoading_(rootEl, 'employee-file-upload');
          });
      }
      next();

    }catch(err){
      reject(err);
    }
  });
}

          _empUploadPendingEmployeeFiles_(root, { spinner:false }).then(function(){

            done({ ok:false, error:'성명(name)은 필수입니다.' });
            return false;
          }

          google.script.run
            .withSuccessHandler(function(res){
              res = res || {};

              if (!res.ok){
                _hideLoading_('employee-detail-save');
                done({ ok:false, error: res.message || '저장 실패' });
                return;
              }

              // ✅ create면 기본동작(닫힘)
              if (mode === 'create'){
                _reloadMainList_().catch(function(){}).finally(function(){
                  _hideLoading_('employee-detail-save');
                  done({ ok:true });
                });
                return;
              }

              // ✅ edit면 최신 데이터 재조회 + 메인 목록 재조회 후 조회모드 전환(모달 유지)
              var id = String(payload.employee.employee_id || '').trim();
              _empFetchBundle_(id, function(b){

                _empApplyEmployeeToModal_(root, b.employee || {});

                _empApplyDerivedToModal_(root, b);
                _empRecalcAll_(root);
                _empSetMode_(root, 'view');
                _empRenderFooter_(modalEl, 'view');

                _reloadMainList_().catch(function(){}).finally(function(){
                  _hideLoading_('employee-detail-save');
                  done({ ok:true, close:false });

              }, function(){
                _empSetMode_(root, 'view');
                _empRenderFooter_(modalEl, 'view');
                _reloadMainList_().catch(function(){}).finally(function(){
                  _hideLoading_('employee-detail-save');
                  done({ ok:true, close:false });
                });
              });
            })

            .withSuccessHandler(function(res){
              res = res || {};

              if (!res.ok){
                _hideLoading_('employee-detail-delete');
                var msg = res.message || '삭제 실패';
                if (typeof showAlertError === 'function') showAlertError(msg, '삭제 실패');

  function Employee_init(scope){
    var container = scope || document;
    var pageRoot = container.querySelector('.page-root');
    if (!pageRoot || pageRoot.__employeeInited) return Promise.resolve();
    pageRoot.__employeeInited = true;

    // ✅ 초기 진입 시 템플릿 샘플값(필터칩/요약카드/테이블 예시행) 숨김
    (function _clearEmployeeMainPlaceholders_(root){
      if (!root) return;
      try{
        root.querySelectorAll('.sum-item-value').forEach(function(el){
          el.textContent = '-';
        });
      }catch(e){}
      try{
        root.querySelectorAll('.wf-chip').forEach(function(chip){
          var v = String(chip.getAttribute('data-value') || '').trim();
          var t = String(chip.textContent || '').trim();
          if (!v || t === 'DB 중복제거 리스트업'){
            chip.remove();
          }
        });
      }catch(e){}
      try{
        root.querySelectorAll('table.tbl tbody').forEach(function(tb){
          Array.from(tb.querySelectorAll('tr')).forEach(function(tr){
            var txt = String(tr.textContent || '').trim();
            if (!txt) return;
            if (/00000|0000-00-00|000000-0000000|000-0000-0000|OO은행|OO카드/.test(txt)){
              tr.remove();
            }
          });
        });
      }catch(e){}
    })(pageRoot);

    // 보기 버튼(돋보기) → 상세 모달
    pageRoot.addEventListener('click', function(e){
      var btn = e.target.closest('button[data-action="view-employee"]');
      if (!btn) return;
      var id = (btn.dataset.employeeId || '').trim();
      if (!id) return;
      window.employeeDetailPageModal(id);
    });

    // 필터 변경 시: 서버 재조회 없이(프로젝트와 동일) 클라이언트 필터만 적용
    var filterWrap = pageRoot.querySelector('#employee-filter-list .wrap-filter');
    if (filterWrap && !filterWrap.__empFilterBound){
      filterWrap.__empFilterBound = true;
      var t = null;
      filterWrap.addEventListener('filterwrap:change', function(){
        if (t) clearTimeout(t);
        t = setTimeout(function(){
          applyFiltersAndRender_(pageRoot);
        }, 120);
      });
    }

    // 외부에서 강제 재조회 가능(저장/삭제 후)
    window.Employee_reloadList = function(opts){
      return loadEmployeeTabs_(pageRoot, opts || {});
    };

    // 최초 로딩: index(app-page-enter) 스피너와 중복 방지
    return loadEmployeeTabs_(pageRoot, { spinner:false, loadingKey:'employee-main' });
  }

  // =========================================================
  // ✅ 소속인력 설정 모달 (Project 설정모달 패턴 이식)
  // - 서버: EMPLOYEE_adminListVisibility / EMPLOYEE_adminSaveVisibility
  // =========================================================
  window.employeeVisibilityAdminPageModal = function(){
    function _trim_(v){ return String(v == null ? '' : v).trim(); }
    function _esc_(s){
      s = String(s == null ? '' : s);
      return s.replace(/[&<>"']/g, function(ch){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]);
      });
    }

    // ✅ 상태필터(상단 select) 적용: 로딩된 DOM을 즉시 필터링
    function _applyAdminFilters_(root){
      root = root || document;
      var fVis = (root.querySelector('select[data-emp-vis-filter="visible"]') || {}).value || '';
      var fDel = (root.querySelector('select[data-emp-vis-filter="deleted"]') || {}).value || '';

      // 좌측(활성/비활성): tr 내부 select[data-field="is_visible"] 값(0/1) 기준
      Array.from(root.querySelectorAll('[data-emp-vis-tbody="visible"] tr')).forEach(function(tr){
        if (!tr.hasAttribute('data-employee-id')) return; // "데이터 없음/로딩" 행은 제외
        var sel = tr.querySelector('select[data-field="is_visible"]');
        var cur = sel ? String(sel.value || '0') : '0';
        tr.style.display = (!fVis || cur === String(fVis)) ? '' : 'none';
      });

      // 우측(삭제/복구): select[data-field="restore"] 값('deleted'/'restore') 기준
      // 필터 값: 0=삭제, 1=복구, 2=완전삭제
      var want = (fDel === '0') ? 'deleted' : (fDel === '1') ? 'restore' : (fDel === '2') ? 'hard' : '';
      Array.from(root.querySelectorAll('[data-emp-vis-tbody="deleted"] tr')).forEach(function(tr){
        if (!tr.hasAttribute('data-employee-id')) return;
        var sel = tr.querySelector('select[data-field="restore"]');
        var cur = sel ? String(sel.value || 'deleted') : 'deleted';
        tr.style.display = (!want || cur === want) ? '' : 'none';
      });
    }

    function _callGAS_(fnName, payload){
      return new Promise(function(resolve, reject){
        var runner = google.script.run
          .withSuccessHandler(function(res){ resolve(res); })
          .withFailureHandler(function(err){ reject(err); });
        if (!runner[fnName]) return reject(new Error(fnName + ' is not a function'));
        runner[fnName](payload || {});
      });
    }
    function _cmpEmp_(a,b){
      var ae = _trim_(a && a.employee_id), be = _trim_(b && b.employee_id);
      var c = ae.localeCompare(be, 'ko', { numeric:true });
      if (c) return c;
      var an = _trim_(a && a.name), bn = _trim_(b && b.name);
      return an.localeCompare(bn, 'ko', { numeric:true });
    }
    function _rowHtmlVisible_(r){
      var eid = _trim_(r.employee_id);
      var isv = String(r.__is_visible != null ? r.__is_visible : (r.is_visible == null ? '0' : r.is_visible));
      if (isv !== '1') isv = '0';
      return ''
        + '<tr data-employee-id="'+_esc_(eid)+'">'
        + '  <td><div class="text-tbl">'+_esc_(eid)+'</div></td>'
        + '  <td><div class="text-tbl">'+_esc_(_trim_(r.name))+'</div></td>'
        + '  <td><div class="text-tbl">'+_esc_(_trim_(r.company))+'</div></td>'
        + '  <td><div class="text-tbl">'+_esc_(_trim_(r.department))+'</div></td>'
        + '  <td>'
        + '    <select class="select-tbl" data-field="is_visible" style="width:100px;">'
        + '      <option value="0" '+(isv==='0'?'selected':'')+'>활성</option>'
        + '      <option value="1" '+(isv==='1'?'selected':'')+'>비활성</option>'
        + '    </select>'
        + '  </td>'
        + '</tr>';
    }
    function _rowHtmlDeleted_(r){
      var eid = _trim_(r.employee_id);
      var cur = String(r.__restore || 'deleted');
      if (cur !== 'restore' && cur !== 'hard') cur = 'deleted';
      return ''
        + '<tr data-employee-id="'+_esc_(eid)+'">'
        + '  <td><div class="text-tbl">'+_esc_(eid)+'</div></td>'
        + '  <td><div class="text-tbl">'+_esc_(_trim_(r.name))+'</div></td>'
        + '  <td><div class="text-tbl">'+_esc_(_trim_(r.company))+'</div></td>'
        + '  <td><div class="text-tbl">'+_esc_(_trim_(r.department))+'</div></td>'
        + '  <td>'
        + '    <select class="select-tbl" data-field="restore" style="width:100px;">'
        + '      <option value="deleted" '+(cur==='deleted'?'selected':'')+'>삭제</option>'
        + '      <option value="restore" '+(cur==='restore'?'selected':'')+'>복구</option>'
        + '      <option value="hard" '+(cur==='hard'?'selected':'')+'>완전삭제</option>'
        + '    </select>'
        + '  </td>'
        + '</tr>';
    }
    function _htmlToRow_(html){
      var t = document.createElement('template');
      t.innerHTML = String(html || '').trim();
      return t.content.firstElementChild;
    }
    function _patchTbodyByKey_(tbody, keyAttr, rows, rowHtmlFn, emptyHtml){
      if (!tbody) return;
      rows = Array.isArray(rows) ? rows : [];
      keyAttr = String(keyAttr || 'data-row-id');

      var oldMap = {};
      Array.from(tbody.querySelectorAll('tr[' + keyAttr + ']')).forEach(function(tr){
        var k = _trim_(tr.getAttribute(keyAttr));
        if (k) oldMap[k] = tr;
      });

      // placeholder(로딩/빈데이터/오류) 제거
      Array.from(tbody.querySelectorAll('tr:not([' + keyAttr + '])')).forEach(function(tr){
        tr.remove();
      });

      var nextNodes = [];
      var seen = {};
      rows.forEach(function(r){
        var k = _trim_(r && r.employee_id);
        if (!k || seen[k]) return;
        seen[k] = 1;
        var html = rowHtmlFn(r);
        var prev = oldMap[k];
        if (prev && prev.__rowHtml === html){
          nextNodes.push(prev);
          return;
        }
        var node = _htmlToRow_(html);
        if (!node) return;
        node.__rowHtml = html;
        if (prev && prev.parentNode === tbody) prev.replaceWith(node);
        nextNodes.push(node);
      });

      // 사라진 키 삭제
      Object.keys(oldMap).forEach(function(k){
        if (seen[k]) return;
        var tr = oldMap[k];
        if (tr && tr.parentNode === tbody) tr.remove();
      });

      // 정렬 순서 반영(기존 node 이동)
      nextNodes.forEach(function(node){ tbody.appendChild(node); });

      if (!nextNodes.length){
        tbody.innerHTML = emptyHtml || '<tr><td colspan="5" style="opacity:.7; padding:1rem;">데이터가 없습니다.</td></tr>';
      }
    }
    function _collectPayload_(root){
      var visibles = [];
      Array.from(root.querySelectorAll('[data-emp-vis-tbody="visible"] tr[data-employee-id]')).forEach(function(tr){
        var eid = _trim_(tr.getAttribute('data-employee-id'));
        var sel = tr.querySelector('select[data-field="is_visible"]');
        if (!eid || !sel) return;
        var v = String(sel.value || '0'); if (v !== '1') v = '0';
        visibles.push({ employee_id: eid, is_visible: Number(v) });
      });
      var restoreIds = [];
      var hardDeleteIds = [];
      Array.from(root.querySelectorAll('[data-emp-vis-tbody="deleted"] tr[data-employee-id]')).forEach(function(tr){
        var eid = _trim_(tr.getAttribute('data-employee-id'));
        var sel = tr.querySelector('select[data-field="restore"]');
        if (!eid || !sel) return;
        var vv = String(sel.value || '');
        if (vv === 'restore') restoreIds.push(eid);
        else if (vv === 'hard') hardDeleteIds.push(eid);
      });
      return { visibles: visibles, restoreIds: restoreIds, hardDeleteIds: hardDeleteIds };
    }

    // ✅ (추가) 좌/우 테이블 재조회 + 재렌더
    function _reloadAdminTables_(root, opts){
      root = root || document;
      opts = opts || {};
      var useSpinner = (opts.spinner !== false);
      var tbodyV = root.querySelector('[data-emp-vis-tbody="visible"]');
      var tbodyD = root.querySelector('[data-emp-vis-tbody="deleted"]');

      if (useSpinner) _empShowLoading_(root, 'employee-vis-load');

      return _callGAS_('EMPLOYEE_adminListVisibility', {})
        .then(function(res){
          if (!res || !res.ok) throw new Error((res && res.message) ? res.message : '조회 실패');
          var vRows = (res.visibleRows || []).slice().sort(_cmpEmp_);
          var dRows = (res.deletedRows || []).slice().sort(_cmpEmp_);

          _patchTbodyByKey_(tbodyV, 'data-employee-id', vRows, _rowHtmlVisible_, '<tr><td colspan="5" style="opacity:.7; padding:1rem;">데이터가 없습니다.</td></tr>');
          _patchTbodyByKey_(tbodyD, 'data-employee-id', dRows, _rowHtmlDeleted_, '<tr><td colspan="5" style="opacity:.7; padding:1rem;">데이터가 없습니다.</td></tr>');

          try{
            if (typeof initUiScope === 'function') initUiScope(root);
            if (typeof initTooltipPortal === 'function') initTooltipPortal(root);
            if (typeof initIconTooltips === 'function') initIconTooltips(root);
            if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(root);
          }catch(e){}

          // ✅ 필터 유지 적용
          try{ _applyAdminFilters_(root); }catch(e){}
          return res;
        })
        .catch(function(err){
          var msg = _esc_((err && err.message) ? err.message : String(err));
          if (tbodyV) tbodyV.innerHTML = '<tr><td colspan="5" style="opacity:.7; padding:1rem;">'+msg+'</td></tr>';
          if (tbodyD) tbodyD.innerHTML = '<tr><td colspan="3" style="opacity:.7; padding:1rem;">'+msg+'</td></tr>';
          throw err;
        })
        .finally(function(){
          if (!useSpinner) return;
          _empHideLoading_(root, 'employee-vis-load');
        });
    }

    openPageModal({
      title: '소속인력 설정',
      size: 'xl', // ✅ full
      templateId: 'employee-visibility-admin-page-modal',

      // ✅ 닫기 버튼(footer) 제거: 저장만 노출 + 저장해도 모달 유지
      footerButtons: [
        { action:'save', text:'저장', icon:'fa-solid fa-floppy-disk', className:'btn-box btn-box-blue', close:false, autoAlert:true }
      ],

      onSave: function(e, modalEl, bodyHost, done){
        var root = bodyHost.querySelector('[data-emp-vis-admin-root]') || bodyHost;
        var payload = _collectPayload_(root);
        _empShowLoading_(root, 'employee-vis-save');
        _callGAS_('EMPLOYEE_adminSaveVisibility', payload)
          .then(function(res){
            if (!res || !res.ok) throw new Error((res && res.message) ? res.message : '저장 실패');
            return Promise.resolve()
              .then(function(){
                try{
                  if (typeof window.Employee_reloadList === 'function') {
                    return Promise.resolve(window.Employee_reloadList({ spinner:false }));
                  }
                }catch(e){}
                return Promise.resolve();
              })
              .then(function(){
                return _reloadAdminTables_(root, { spinner:false });
              })
              .then(function(){
                _empHideLoading_(root, 'employee-vis-save');
                done({ ok:true, message:'저장되었습니다.', close:false, autoAlert:true });
              });
          })
          .catch(function(err){
            _empHideLoading_(root, 'employee-vis-save');
            done({ ok:false, message:(err && err.message) ? err.message : String(err || '저장 실패'), close:false, autoAlert:true });
          });
        return false; // ✅ 비동기 → done 직접 호출
      },

      onOpen: function(modalEl, bodyHost){
        var root = bodyHost.querySelector('[data-emp-vis-admin-root]') || bodyHost;
        var tbodyV = root.querySelector('[data-emp-vis-tbody="visible"]');
        var tbodyD = root.querySelector('[data-emp-vis-tbody="deleted"]');
        if (tbodyV) tbodyV.innerHTML = '<tr><td colspan="5" style="opacity:.7; padding:1rem;"></td></tr>';
        if (tbodyD) tbodyD.innerHTML = '<tr><td colspan="5" style="opacity:.7; padding:1rem;"></td></tr>';

        // ✅ 필터 이벤트 바인딩(1회)
        if (!root.__empVisAdminFilterBound){
          root.__empVisAdminFilterBound = true;
          root.addEventListener('change', function(ev){
            var t = ev.target;
            // 상단 필터 select 또는 행 내 select 변경 시 즉시 필터 재적용
            if (!t) return;
            if (t.matches('select[data-emp-vis-filter], select[data-field="is_visible"], select[data-field="restore"]')){
              _applyAdminFilters_(root);
            }
          });
        }
        // ✅ (정리) onOpen 로딩도 공통 함수로 처리
        _reloadAdminTables_(root);
      }
    });
  };
  window.Employee_init = Employee_init;
})();
</script>
