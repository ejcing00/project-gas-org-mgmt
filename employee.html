<style>
    /* 안전장치 */
  .sec[data-sec-tabs] .sec-body { min-height: 0; }

  /* 탭 패널 계산 안정화 */
  .sec[data-sec-tabs] .sec-panel.is-active{ min-height: 0; }

  /* 요약은 내용만큼 */
  .sec[data-sec-tabs] .sec-panel.is-active > .wrap-sum{
    flex: 0 0 auto;
    min-height: auto;
    overflow: visible;
  }

  /* ===== employee: 테이블 3개 탭(직위/계약/경력, 학력/교육/자격) ===== */

  /* 패널 자체를 세로 flex로(혹시 빠졌을 경우를 대비해 강제) */
  .sec[data-sec-tabs] .sec-panel[data-panel="employee-info1-list"],
  .sec[data-sec-tabs] .sec-panel[data-panel="employee-info2-list"]{
    display: flex;
    flex-direction: column;
    min-height: 0;
    gap: 0.5rem;              /* 테이블 간 간격 */
  }

  /* mb-2는 높이 분배를 흔들 수 있어서 제거 */
  .sec[data-sec-tabs] .sec-panel[data-panel="employee-info1-list"] > .wrap-tbl.mb-2,
  .sec[data-sec-tabs] .sec-panel[data-panel="employee-info2-list"] > .wrap-tbl.mb-2{
    margin-bottom: 0 !important;
  }

  /* 이 두 탭에서는 '모든 테이블'을 동일 높이로 */
  .sec[data-sec-tabs] .sec-panel[data-panel="employee-info1-list"] > .wrap-tbl,
  .sec[data-sec-tabs] .sec-panel[data-panel="employee-info2-list"] > .wrap-tbl{
    flex: 1 1 0;               /* ✅ 1:1:1 */
    min-height: 0;             /* ✅ scroll-xy 계산 안정화 */
  }
</style>

<script>
/** =========================
 * Employee 목록(1단계)
 * - EMPLOYEE_list() 호출 → 기본정보 테이블 렌더
 * - wrap-filter 선택(category/status/manage) 변경 시 자동 재조회
 * - 보기(돋보기) 클릭 시 employeeDetailPageModal(employee_id) 호출
 * ========================= */
(function(){
  function esc_(v){
    return String(v == null ? '' : v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\"/g,'&quot;').replace(/\'/g,'&#39;');
  }

  function pick_(obj, keys){
    for (var i=0; i<keys.length; i++){
      var k = keys[i];
      if (obj && obj[k] != null && String(obj[k]).trim() !== '') return obj[k];
    }
    return '';
  }

  function flattenSelected_(state){
    // state.selectedByPanel 전부 합쳐서 { key:[v1,v2...] } 형태로
    var out = {};
    if (!state) return out;

    function push(k, v){
      if (!k || !v) return;
      if (!out[k]) out[k] = [];
      if (out[k].indexOf(v) < 0) out[k].push(v);
    }

    // 활성 패널 선택도 포함
    var sel = state.selected || {};
    Object.keys(sel).forEach(function(k){
      (sel[k] || []).forEach(function(v){ push(k, v); });
    });

    var by = state.selectedByPanel || {};
    Object.keys(by).forEach(function(pKey){
      var panelSel = (by[pKey] && by[pKey].selected) || {};
      Object.keys(panelSel).forEach(function(k){
        (panelSel[k] || []).forEach(function(v){ push(k, v); });
      });
    });

    return out;
  }

  function _normStr_(v){
    return String(v == null ? '' : v).trim();
  }

  // 숫자 콤마 포맷(요약카드에서 사용)
  function _fmtInt_(n){
    n = (n == null) ? 0 : n;
    n = (typeof n === 'string') ? n.replace(/,/g,'') : n;
    n = parseInt(n, 10);
    if (!isFinite(n)) n = 0;
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function _getFilterWrap_(pageRoot){
    return pageRoot ? pageRoot.querySelector('#employee-filter-list .wrap-filter') : null;
  }
  function _collectSelectedMap_(wrap){
    // FilterWrap.getState가 없을 때 fallback
    var map = {};
    if (!wrap) return map;
    wrap.querySelectorAll('.wf-chip.is-active').forEach(function(chip){
      var k = chip.dataset.key || 'chip';
      var v = _normStr_(chip.dataset.value || chip.textContent);
      if (!k || !v) return;
      if (!map[k]) map[k] = [];
      if (map[k].indexOf(v) < 0) map[k].push(v);
    });
    return map;
  }

  function populateFilterOptionsFromData_(pageRoot, data){
    // ✅ "소속인력" 패널만이라도 DB기반으로 자동 리스트업(중복제거)
    var wrap = _getFilterWrap_(pageRoot);
    if (!wrap) return;

    var panel = wrap.querySelector('.wf-panel[data-major="employee"][data-sub="employee_id"]');
    if (!panel) return;
    var chipsWrap = panel.querySelector('.wf-chips');
    if (!chipsWrap) return;

    // 기존 선택 유지(사번 기준)
    var selected = {};
    wrap.querySelectorAll('.wf-chip.is-active[data-key="employee_id"]').forEach(function(chip){
      var v = _normStr_(chip.dataset.value || chip.textContent);
      if (v) selected[v] = true;
    });

    var rows = (data && data.employeeRows) ? data.employeeRows : [];
    var seen = {};
    var list = [];
    rows.forEach(function(r){
      var id = _normStr_(r && r.employee_id);
      if (!id || seen[id]) return;
      seen[id] = true;
      list.push({ id:id, name:_normStr_(r && r.name) });
    });
    list.sort(function(a,b){ return (a.id > b.id ? 1 : (a.id < b.id ? -1 : 0)); });

    chipsWrap.innerHTML = '';
    var frag = document.createDocumentFragment();
    list.forEach(function(it){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'wf-chip';
      btn.dataset.key = 'employee_id';
      btn.dataset.value = it.id;
      btn.textContent = it.id + (it.name ? (' ' + it.name) : '');
      if (selected[it.id]) btn.classList.add('is-active');
      frag.appendChild(btn);
    });
    chipsWrap.appendChild(frag);

    // indicator/wf-state 갱신(필요시)
    if (window.FilterWrap && typeof window.FilterWrap.updateIndicator === 'function') {
      try { window.FilterWrap.updateIndicator(wrap); } catch(e){}
    }
  }

  function getBasicInfoTable_(pageRoot){
    var panel = pageRoot.querySelector('.sec-panel[data-panel="employee-info-list"]');
    if (!panel) return null;
    return panel.querySelector('table.tbl');
  }

  function _getPanel_(pageRoot, panelKey){
    return pageRoot ? pageRoot.querySelector('.sec-panel[data-panel="'+panelKey+'"]') : null;
  }

  function _getTbody_(panel, nth){
    if (!panel) return null;
    var tables = panel.querySelectorAll('table.tbl');
    var t = tables && tables[nth] ? tables[nth] : null;
    return (t && t.tBodies && t.tBodies[0]) ? t.tBodies[0] : null;
  }

  function _today_(){
    // 목록/필터용 오늘(yyyy-MM-dd)
    if (typeof _todayYmd_ === 'function') {
      try { return _todayYmd_(); } catch(e){}
    }
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + dd;
  }

  function _periodTextFromTo_(fromStr, toStr){
    if (typeof _diffMonthsDaysInclusiveObj_ !== 'function') return '';
    var o = _diffMonthsDaysInclusiveObj_(fromStr, toStr);
    if (!o) return '';
    var mo = (o.months || 0);
    var d  = (o.days || 0);
    if (!mo && !d) return '';
    return (mo ? (mo + '개월') : '') + (d ? (' ' + d + '일') : '');
  }

  // =========================
  // ✅ 목록 정렬 유틸
  // - 공통: employee_id ASC
  // - 보조: ymd(YYYY-MM-DD) ASC (빈값은 마지막)
  // =========================
  function _sortKeyYmdTs_(v){
    // _ymdToDate_ / _normYmd_는 아래 "계산필드" 섹션에 정의되어 있음
    try {
      var d = (typeof _ymdToDate_ === 'function') ? _ymdToDate_(v) : null;
      return d ? d.getTime() : 9007199254740991; // 빈값은 마지막
    } catch(e){
      return 9007199254740991;
    }
  }

  function _cmpEmployeeId_(a,b){
    var ea = _normStr_(a);
    var eb = _normStr_(b);
    return ea.localeCompare(eb);
  }

  function _cmpEmpThenYmd_(a,b, ymdA, ymdB){
    var c = _cmpEmployeeId_(a && a.employee_id, b && b.employee_id);
    if (c) return c;
    var ta = _sortKeyYmdTs_(ymdA);
    var tb = _sortKeyYmdTs_(ymdB);
    if (ta !== tb) return (ta - tb);
    return 0;
  }

  function renderEmployeeInfo1List_(pageRoot, data, flat, employeeIdSet){
    var panel = _getPanel_(pageRoot, 'employee-info1-list');
    if (!panel) return;

    // [0] 직위 / [1] 계약 / [2] 경력
    var tbPos = _getTbody_(panel, 0);
    var tbAgr = _getTbody_(panel, 1);
    var tbExp = _getTbody_(panel, 2);

    function empty_(tb, col){
      if (!tb) return;
      tb.innerHTML = '';
      var tr0 = document.createElement('tr');
      tr0.innerHTML = '<td colspan="'+(col||6)+'"><div class="text-tbl">데이터가 없습니다.</div></td>';
      tb.appendChild(tr0);
    }

    // ---- Position ----
    if (tbPos){
      var rows = (data.positionRows || []).filter(function(r){
        var eid = _normStr_(r && r.employee_id);
        if (!eid || !employeeIdSet[eid]) return false;
        if (flat.position && flat.position.length) {
          return flat.position.indexOf(_normStr_(r && r.name)) >= 0;
        }
        return true;
      });

      // ✅ 정렬: employee_id ASC -> start_date ASC
      rows.sort(function(a,b){
        return _cmpEmpThenYmd_(a, b, (a && a.start_date), (b && b.start_date));
      });

      tbPos.innerHTML = '';
      if (!rows.length) {
        empty_(tbPos, 7);
      } else {
        rows.forEach(function(r){
          var eid = _normStr_(r.employee_id);
          var empName = _normStr_(r.employee_name);
          var tr = document.createElement('tr');
          tr.innerHTML = ''
            + '<td><button type="button" class="btn-icon btn-icon-s" data-action="view-employee" data-acl="btn:employee:view" data-employee-id="'+esc_(eid)+'"><i class="fa-solid fa-magnifying-glass"></i></button></td>'
            + '<td><div class="text-tbl">'+esc_(eid)+'</div></td>'
            + '<td><div class="text-tbl">'+esc_(empName)+'</div></td>'
            + '<td><div class="text-tbl">'+esc_(_normStr_(r.name))+'</div></td>'
            + '<td><div class="text-tbl">'+esc_(_normStr_(r.start_date))+'</div></td>'
            + '<td><div class="text-tbl">'+esc_(_normStr_(r.end_date))+'</div></td>'
            + '<td><div class="text-tbl">'+esc_(_periodTextFromTo_(_normStr_(r.start_date), _normStr_(r.end_date) || _today_()))+'</div></td>';
          tbPos.appendChild(tr);
        });
      }
    }

    // ---- Agreement ----
    if (tbAgr){
      var rows2 = (data.agreementRows || []).filter(function(r){
        var eid = _normStr_(r && r.employee_id);
        if (!eid || !employeeIdSet[eid]) return false;
        if (flat.contract && flat.contract.length) {
          return flat.contract.indexOf(_normStr_(r && r.category)) >= 0;
        }
        return true;
      });

      // ✅ 정렬: employee_id ASC -> start_date ASC
      rows2.sort(function(a,b){
        return _cmpEmpThenYmd_(a, b, (a && a.start_date), (b && b.start_date));
      });

      tbAgr.innerHTML = '';
      if (!rows2.length) {
        empty_(tbAgr, 7);
      } else {
        rows2.forEach(function(r){
          var eid = _normStr_(r.employee_id);
          var empName = _normStr_(r.employee_name);

  function decorateEmployeeDerivedFields_(data){
    // 목록표시/필터링에 필요한 파생필드 계산(최소)
    data = data || {};
    var eRows = data.employeeRows || [];
    var pos = data.positionRows || [];
    var agr = data.agreementRows || [];
    var exp = data.experienceRows || [];
    var edu = data.educationRows || [];
    var qua = data.qualificationRows || [];

    var byEmp = {};
    eRows.forEach(function(e){
      var id = _normStr_(e && e.employee_id);
      if (!id) return;
      byEmp[id] = byEmp[id] || { pos:[], agr:[], exp:[], edu:[], qua:[] };
    });
    pos.forEach(function(r){ var id=_normStr_(r&&r.employee_id); if (byEmp[id]) byEmp[id].pos.push(r); });
    agr.forEach(function(r){ var id=_normStr_(r&&r.employee_id); if (byEmp[id]) byEmp[id].agr.push(r); });
    exp.forEach(function(r){ var id=_normStr_(r&&r.employee_id); if (byEmp[id]) byEmp[id].exp.push(r); });
    edu.forEach(function(r){ var id=_normStr_(r&&r.employee_id); if (byEmp[id]) byEmp[id].edu.push(r); });
    qua.forEach(function(r){ var id=_normStr_(r&&r.employee_id); if (byEmp[id]) byEmp[id].qua.push(r); });

    function ymdInt_(s){
      s = _normStr_(s);
      var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return null;
      return parseInt(m[1],10)*10000 + parseInt(m[2],10)*100 + parseInt(m[3],10);
    }

    // YYYY-MM-DD -> Date(로컬)
    function ymdDate_(s){
      s = _normStr_(s);
      var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return null;
      return new Date(parseInt(m[1],10), parseInt(m[2],10) - 1, parseInt(m[3],10));
    }

    // "N개월 M일"/"N개월"/"M일" 텍스트 -> {months, days}
    function parseMdText_(txt){
      txt = _normStr_(txt);
      if (!txt) return null;
      var mo = 0, da = 0;
      var mm = txt.match(/(\d+)\s*개월/);
      var dd = txt.match(/(\d+)\s*일/);
      if (mm) mo = parseInt(mm[1],10) || 0;
      if (dd) da = parseInt(dd[1],10) || 0;
      // 순수 숫자면 "개월"로 간주(예: 55)
      if (!mm && !dd && !isNaN(Number(txt))) mo = parseInt(txt,10) || 0;
      return { months: mo, days: da };
    }

    // 선행 공백 제거(예: " 24일" -> "24일")
    function mdTextNoLeading_(txt){
      return _normStr_(txt);
    }

    function pickLatestBy_(rows, key){
      rows = rows || [];
      var best = null;
      var bestInt = -1;
      rows.forEach(function(r){
        var n = ymdInt_(r && r[key]);
        if (n == null) return;
        if (n > bestInt){ bestInt = n; best = r; }
      });
      return best || (rows[0] || null);
    }

    // expertise_status 계산(education/qualification의 expertise_apply 기반)
    function calcExpertise_(empId){
      var g = byEmp[empId];
      if (!g) return '';
      var hasEdu = (g.edu || []).some(function(r){ return _normStr_(r && r.expertise_apply) === '해당'; });
      var hasQua = (g.qua || []).some(function(r){ return _normStr_(r && r.expertise_apply) === '해당'; });
      if (hasEdu && hasQua) return '전체보유';
      if (hasEdu) return '석사보유';
      if (hasQua) return '자격보유';
      return '미보유';
    }

    // working_yearcount(계약 시작일 기준)
    function calcYearCount_(startDate){
      var sInt = ymdInt_(startDate);
      var t = _today_();
      var tInt = ymdInt_(t);
      if (sInt == null || tInt == null) return '';
      var sy = parseInt(String(sInt).slice(0,4), 10);
      var sm = parseInt(String(sInt).slice(4,6), 10);
      var sd = parseInt(String(sInt).slice(6,8), 10);
      var ty = parseInt(String(tInt).slice(0,4), 10);
      var tm = parseInt(String(tInt).slice(4,6), 10);
      var td = parseInt(String(tInt).slice(6,8), 10);

      var years = ty - sy;
      if (tm < sm || (tm === sm && td < sd)) years -= 1;
      var n = years + 1; // 1년차부터
      if (n <= 0) n = 1;
      return n + '년차';
    }

    eRows.forEach(function(e){
      var id = _normStr_(e && e.employee_id);
      if (!id) return;
      var g = byEmp[id] || { pos:[], agr:[], exp:[], edu:[], qua:[] };

      // 공통 today(YYYY-MM-DD)
      var todayYmd = _today_();

      // 총근무 계산용(계약 기반 재직기간)
      var tenureMo = 0;
      var tenureDa = 0;
      var isTenureValid = false;

      // 직위(현재)
      var p = pickLatestBy_(g.pos, 'start_date');
      if (p && _normStr_(p.name)) e.position_now = _normStr_(p.name);

      // 계약(상세 페이지와 동일 규칙)
      // - 계약시작일: '신규계약' start_date 중 가장 빠른 날짜
      // - 계약종료일: 하나라도 end_date 공란이면 공란, 아니면 최댓값
      // - 재직기간: 계약시작일 ~ min(오늘, 계약종료일)
      var aLatest = pickLatestBy_(g.agr, 'start_date'); // agreement_category_now 유지용
      if (aLatest) e.agreement_category_now = _normStr_(aLatest.category);

      var contractStart = '';
      (g.agr || []).forEach(function(r){
        if (_normStr_(r && r.category) !== '신규계약') return;
        var d = ymdDate_(r && r.start_date);
        if (!d) return;
        if (!contractStart) contractStart = _normStr_(r.start_date);
        else {
          var cur = ymdDate_(contractStart);
          if (cur && d < cur) contractStart = _normStr_(r.start_date);
        }
      });

      var hasOpenEnd = (g.agr || []).some(function(r){
        return !_normStr_(r && r.end_date);
      });
      var contractEnd = '';
      if (!hasOpenEnd){
        var maxEnd = null;
        (g.agr || []).forEach(function(r){
          var d = ymdDate_(r && r.end_date);
          if (!d) return;
          if (!maxEnd || d > maxEnd) maxEnd = d;
        });
        if (maxEnd){
          contractEnd = maxEnd.getFullYear() + '-' + String(maxEnd.getMonth()+1).padStart(2,'0') + '-' + String(maxEnd.getDate()).padStart(2,'0');
        }
      }

      e.agreement_start_date = contractStart;
      e.agreement_end_date = contractEnd;

      var contractStartD = contractStart ? ymdDate_(contractStart) : null;
      var contractEndD = contractEnd ? ymdDate_(contractEnd) : null;
      var todayD = ymdDate_(todayYmd);

      // 계약기간: start ~ (end || today), 단 start <= end인 경우만
      var periodEndD = contractEndD || todayD;
      if (contractStartD && periodEndD && contractStartD <= periodEndD){
        var periodEndYmd = periodEndD.getFullYear() + '-' + String(periodEndD.getMonth()+1).padStart(2,'0') + '-' + String(periodEndD.getDate()).padStart(2,'0');
        e.agreement_period = mdTextNoLeading_(_periodTextFromTo_(contractStart, periodEndYmd));
      } else {
        e.agreement_period = '';
      }

      // 재직기간(오늘까지): start ~ min(today, end)
      var tenureEndD = todayD;
      if (contractEndD && todayD && contractEndD < todayD) tenureEndD = contractEndD;
      isTenureValid = !!(contractStartD && tenureEndD && contractStartD <= tenureEndD);

      if (isTenureValid){
        var tenureEndYmd = tenureEndD.getFullYear() + '-' + String(tenureEndD.getMonth()+1).padStart(2,'0') + '-' + String(tenureEndD.getDate()).padStart(2,'0');
        e.agreement_period_now = mdTextNoLeading_(_periodTextFromTo_(contractStart, tenureEndYmd));
        var oTenure = (typeof _diffMonthsDaysInclusiveObj_ === 'function')
          ? _diffMonthsDaysInclusiveObj_(contractStart, tenureEndYmd)
          : null;
        tenureMo = oTenure ? (oTenure.months || 0) : 0;
        tenureDa = oTenure ? (oTenure.days || 0) : 0;
      } else {
        e.agreement_period_now = '';
        tenureMo = 0;
        tenureDa = 0;
      }

      // 승인경력기간(카테고리에 '적용' 포함)
      var moSum = 0, dSum = 0;
      (g.exp || []).forEach(function(r){
        var cat = _normStr_(r && r.category);
        if (!cat || !/\(적용\)/.test(cat)) return;
        // ✅ 경력기간 합산은 'period(경력기간)'만 사용한다.
        //    근무기간(working_*) 기반 계산/합산은 하지 않는다.
        var md = _parseMdText_(r && r.period);
        if (!md) return;
        moSum += (md.months || 0);
        dSum  += (md.days   || 0);
      });
      if (dSum >= 30){
        moSum += Math.floor(dSum / 30);
        dSum = dSum % 30;
      }
      if (moSum || dSum) e.experience_approval_period = mdTextNoLeading_((moSum ? (moSum + '개월') : '') + (dSum ? (' ' + dSum + '일') : ''));

      // ✅ 총근무연수/연차(목록)
      // - 총근무연수 = 재직기간(오늘까지) + 적용경력기간(적용)
      // - 총근무연차 = 총근무연수 기반(페이지모달과 동일 방식)
      if (isTenureValid){
        var totalMo = (tenureMo || 0) + (moSum || 0);
        var totalDa = (tenureDa || 0) + (dSum || 0);
        if (totalDa >= 30){ totalMo += Math.floor(totalDa/30); totalDa = totalDa % 30; }

        if (!e.working_period){
          if (typeof _fmtMdText_ === 'function') e.working_period = _fmtMdText_(totalMo, totalDa);
          else {
            var parts = [];
            if (totalMo > 0) parts.push(totalMo + '개월');
            if (totalDa > 0) parts.push(totalDa + '일');
            e.working_period = parts.join(' ');
          }
        }

        var units = (totalMo * 30) + totalDa;
        var year = Math.floor((Math.max(units, 1) - 1) / 360) + 1;
        e.working_yearcount = year + '년차';
      } else {
        // 재직 시작 전(미래 계약 시작)이면 빈값 유지
        if (!e.working_period) e.working_period = '';
        if (!e.working_yearcount) e.working_yearcount = '';
      }
      // 직무전문성(없으면 계산값으로 채움)
      if (!_normStr_(e.expertise_status)) e.expertise_status = calcExpertise_(id);
    });

    return data;
  }

  function applyFiltersAndRender_(pageRoot){
    var data = pageRoot.__employeeDataBase;
    if (!data) return;

    var wrap = _getFilterWrap_(pageRoot);
    var flat = {};
    if (wrap && window.FilterWrap && typeof window.FilterWrap.getState === 'function'){
      flat = flattenSelected_(window.FilterWrap.getState(wrap) || {});
    } else if (wrap) {
      flat = _collectSelectedMap_(wrap);
    }

    function _pickYearNum_(s){
      s = _normStr_(s);
      if (!s) return null;
      // "11년차", "11년차 이상" 등에서 숫자만 뽑기
      var m = s.match(/(\d+)\s*년/);
      if (!m) return null;
      var n = parseInt(m[1], 10);
      return isNaN(n) ? null : n;
    }

    function inSet_(key, v){
      var arr = flat[key];
      if (!arr || !arr.length) return true;
      v = _normStr_(v);

      // ✅ 총근무연차(yearcount)만: "11년차 이상"을 범위 필터로 처리
      if (key === 'yearcount'){
        // 1) 정확 일치(예: 3년차) 먼저
        if (arr.indexOf(v) >= 0) return true;

        // 2) "11년차 이상" 선택 시: v의 숫자가 11 이상이면 통과
        if (arr.indexOf('11년차 이상') >= 0){
          var yn = _pickYearNum_(v);
          if (yn != null && yn >= 11) return true;
        }
        return false;
      }

      return arr.indexOf(v) >= 0;
    }

    // employeeRows 필터
    var eRows = (data.employeeRows || []).filter(function(r){
      if (!r) return false;
      if (!inSet_('employee_id', r.employee_id)) return false;
      if (!inSet_('category', r.category)) return false;
      if (!inSet_('status', r.status)) return false;
      if (!inSet_('manage', r.manage)) return false;

      if (!inSet_('position', r.position_now)) return false;
      if (!inSet_('yearcount', r.working_yearcount)) return false;
      if (!inSet_('expertise', r.expertise_status)) return false;
      if (!inSet_('agreement', r.agreement_category_now)) return false;

      // experience/training/qualification은 "해당 테이블에 존재" 기준(선택이 있을 때만)
      var id = _normStr_(r.employee_id);
      if (!id) return false;

      if (flat.experience && flat.experience.length){
        var ok = (data.experienceRows || []).some(function(x){ return _normStr_(x && x.employee_id)===id && flat.experience.indexOf(_normStr_(x && x.category))>=0; });
        if (!ok) return false;
      }
      if (flat.training && flat.training.length){
        var ok2 = (data.trainingRows || []).some(function(x){ return _normStr_(x && x.employee_id)===id && flat.training.indexOf(_normStr_(x && x.category))>=0; });
        if (!ok2) return false;
      }
      if (flat.qualification && flat.qualification.length){
        var ok3 = (data.qualificationRows || []).some(function(x){ return _normStr_(x && x.employee_id)===id && flat.qualification.indexOf(_normStr_(x && x.category))>=0; });
        if (!ok3) return false;
      }
      return true;
    });

    // ✅ 공통 정렬: employee_id 오름차순(목록/필터/요약 기준 일관)
    eRows.sort(function(a,b){
      return _cmpEmployeeId_(a && a.employee_id, b && b.employee_id);
    });

    var employeeIdSet = {};
    eRows.forEach(function(r){ var id=_normStr_(r && r.employee_id); if (id) employeeIdSet[id]=true; });

    renderEmployeeBasicList_(pageRoot, eRows);
    renderEmployeeInfo1List_(pageRoot, data, flat, employeeIdSet);
    renderEmployeeInfo2List_(pageRoot, data, flat, employeeIdSet);

    // ✅ 요약(SUM) 업데이트(필터 결과/목록 데이터 기준, 3탭 공통 반영)
    // (에러를 숨기면 적용 안 되는 원인을 놓치기 쉬워서 콘솔로 표시)
    try { updateEmployeeSummary_(pageRoot, data, eRows); }
    catch(e) { console.error('[employee] updateEmployeeSummary_ failed:', e); }

    // ✅ 동적 렌더링된 버튼/영역에 ACL 재적용 (btn:employee:view 등)
    if (window.initUiScope) window.initUiScope(pageRoot);
    // ✅ initUiScope가 ACL을 보장하지 않으므로, 동적 렌더 후 ACL을 "명시적으로" 재적용
    if (window.ACL_applyToScope) window.ACL_applyToScope(pageRoot);
  }

  function updateEmployeeSummary_(pageRoot, data, employeeRows){
    data = data || {};
    employeeRows = employeeRows || [];

    // 0(또는 미집계) 값은 '-'로 표시
    // - 이번 집계에서 값이 셋팅되지 않은 라벨(=0)은 placeholder(00명/000건)가 남기 쉬움
    // - 먼저 전부 '-'로 초기화한 뒤, 계산된 값만 덮어쓴다.
    try {
      var sumRoots = pageRoot ? pageRoot.querySelectorAll('.wrap-sum') : null;
      if (sumRoots && sumRoots.length){
        sumRoots.forEach(function(sr){
          var vals = sr.querySelectorAll('.sum-item-value');
          vals.forEach(function(v){ v.textContent = '-'; });
        });
      }
    } catch(e) {}

    function _countBy_(rows, field){
      var m = {};
      (rows || []).forEach(function(r){
        var k = _normStr_(r && r[field]);
        if (!k) return;
        m[k] = (m[k] || 0) + 1;
      });
      return m;
    }

    function _setGridValueByLabel_(grid, label, valueText){
      if (!grid) return;
      label = _normStr_(label);
      var items = grid.querySelectorAll('.sum-item');
      for (var i=0; i<items.length; i++){
        var it = items[i];
        var lb = it.querySelector('.sum-item-label');
        if (!lb) continue;
        if (_normStr_(lb.textContent) !== label) continue;
        var val = it.querySelector('.sum-item-value');
        if (val) val.textContent = valueText;
        return;
      }
    }

    function _findGridByContains_(sumRoot, tokens){
      tokens = (tokens || []).map(function(t){ return _normStr_(t); }).filter(Boolean);
      var grids = sumRoot.querySelectorAll('.sum-grid');
      for (var i=0; i<grids.length; i++){
        var t = grids[i].querySelector('.sum-title span');
        var title = _normStr_(t && t.textContent);
        if (!title) continue;
        var ok = true;
        for (var j=0; j<tokens.length; j++){
          if (title.indexOf(tokens[j]) < 0) { ok = false; break; }
        }
        if (ok) return grids[i];
      }
      return null;
    }

    function _fmtCount_(n, unit){
      n = parseInt(n || 0, 10) || 0;
      if (!n) return '-';
      return _fmtInt_(n) + (unit || '');
    }

    function _fmtCount2_(cnt, months){
      cnt = parseInt(cnt || 0, 10) || 0;
      months = parseInt(months || 0, 10) || 0;
      if (!cnt) return '-';
      if (!months) return _fmtInt_(cnt) + '건';
      return _fmtInt_(cnt) + '건 · ' + _fmtInt_(months) + '개월';
    }

    // ===== subsets =====
    var totalEmp = employeeRows.length;

    var cntCategory = _countBy_(employeeRows, 'category');
    var cntStatus   = _countBy_(employeeRows, 'status');
    var cntManage   = _countBy_(employeeRows, 'manage');

    // '창단' 기준(= 관리주체: 창업지원단)
    var cdRows = employeeRows.filter(function(r){ return _normStr_(r && r.manage) === '창업지원단'; });
    var cdTotal = cdRows.length;
    var cntPos  = _countBy_(cdRows, 'position_now');

    // '창단직원' 기준
    var staffRows = cdRows.filter(function(r){ return _normStr_(r && r.category) === '직원'; });
    var staffTotal = staffRows.length;
    var cntYear = _countBy_(staffRows, 'working_yearcount');
    var cntExpert = _countBy_(staffRows, 'expertise_status');

    // ✅ "11년차 이상" 버킷(= 11년차 이상 합산)
    var cntYear11Plus = 0;
    staffRows.forEach(function(r){
      var yn = null;
      var s = _normStr_(r && r.working_yearcount);
      if (s){
        var m = s.match(/(\d+)\s*년/);
        if (m) yn = parseInt(m[1], 10);
      }
      if (yn != null && !isNaN(yn) && yn >= 11) cntYear11Plus += 1;
    });

    var staffSet = {};
    staffRows.forEach(function(r){ var id=_normStr_(r && r.employee_id); if (id) staffSet[id]=true; });

    // 계약
    var agrRows = (data.agreementRows || []).filter(function(r){ return staffSet[_normStr_(r && r.employee_id)]; });
    var agrTotal = agrRows.length;
    var agrCatCnt = _countBy_(agrRows, 'category');

    // 경력
    var expRows = (data.experienceRows || []).filter(function(r){ return staffSet[_normStr_(r && r.employee_id)]; });

    function _isAppliedExp_(cat){
      cat = _normStr_(cat);
      return /\(적용\)/.test(cat);
    }
    function _normMD_(mo, da){
      mo = parseInt(mo||0,10)||0;
      da = parseInt(da||0,10)||0;
      if (da >= 30){ mo += Math.floor(da/30); da = da % 30; }
      return { months: mo, days: da };
    }

    function _expAgg_(rows){
      var out = { cnt:0, months:0, days:0, in_cnt:0, in_months:0, in_days:0, out_cnt:0, out_months:0, out_days:0 };
      (rows || []).forEach(function(r){
        var cat = _normStr_(r && r.category);
        var isIn  = (cat.indexOf('내부') >= 0);
        var isOut = (cat.indexOf('외부') >= 0);

        var o = (typeof _diffMonthsDaysInclusiveObj_ === 'function')
          ? _diffMonthsDaysInclusiveObj_(_normStr_(r && r.working_start_date), _normStr_(r && r.working_end_date))
          : null;
        var mo = o ? (o.months || 0) : 0;
        var da = o ? (o.days || 0) : 0;

        out.cnt += 1; out.months += mo; out.days += da;
        if (isIn){ out.in_cnt += 1; out.in_months += mo; out.in_days += da; }
        if (isOut){ out.out_cnt += 1; out.out_months += mo; out.out_days += da; }
      });

      var a = _normMD_(out.months, out.days); out.months=a.months; out.days=a.days;
      var b = _normMD_(out.in_months, out.in_days); out.in_months=b.months; out.in_days=b.days;
      var c = _normMD_(out.out_months, out.out_days); out.out_months=c.months; out.out_days=c.days;
      return out;
    }

    var expApplied = expRows.filter(function(r){ return _isAppliedExp_(r && r.category); });
    var expNotApplied = expRows.filter(function(r){ return !_isAppliedExp_(r && r.category); });

    var expApplyAgg = _expAgg_(expApplied);

    var expNoCnt = { cnt: expNotApplied.length, in_cnt:0, out_cnt:0 };
    expNotApplied.forEach(function(r){
      var cat=_normStr_(r && r.category);
      if (cat.indexOf('내부')>=0) expNoCnt.in_cnt += 1;
      if (cat.indexOf('외부')>=0) expNoCnt.out_cnt += 1;
    });

    // 교육/자격
    var trRows  = (data.trainingRows || []).filter(function(r){ return staffSet[_normStr_(r && r.employee_id)]; });
    var trTotal = trRows.length;
    var trCnt   = _countBy_(trRows, 'category');

    var qaRows  = (data.qualificationRows || []).filter(function(r){ return staffSet[_normStr_(r && r.employee_id)]; });
    var qaTotal = qaRows.length;
    var qaCnt   = _countBy_(qaRows, 'category');

    // ===== apply to all SUM roots =====
    var sumRoots = pageRoot.querySelectorAll('.wrap-sum');
    for (var s=0; s<sumRoots.length; s++){
      var sumRoot = sumRoots[s];

      // 고용구분
      var g1 = _findGridByContains_(sumRoot, ['고용구분']);
      if (g1){
        _setGridValueByLabel_(g1, '소속인력', _fmtCount_(totalEmp, '명'));
        Object.keys(cntCategory).forEach(function(k){ _setGridValueByLabel_(g1, k, _fmtCount_(cntCategory[k], '명')); });
      }

      // 고용상태
      var g2 = _findGridByContains_(sumRoot, ['고용상태']);
      if (g2){
        _setGridValueByLabel_(g2, '소속인력', _fmtCount_(totalEmp, '명'));
        Object.keys(cntStatus).forEach(function(k){ _setGridValueByLabel_(g2, k, _fmtCount_(cntStatus[k], '명')); });
      }

      // 관리주체
      var g3 = _findGridByContains_(sumRoot, ['관리주체']);
      if (g3){
        _setGridValueByLabel_(g3, '소속인력', _fmtCount_(totalEmp, '명'));
        Object.keys(cntManage).forEach(function(k){ _setGridValueByLabel_(g3, k, _fmtCount_(cntManage[k], '명')); });
      }

      // 창단소속인력 직위
      var g4 = _findGridByContains_(sumRoot, ['직위']);
      if (g4){
        _setGridValueByLabel_(g4, '소속인력', _fmtCount_(cdTotal, '명'));
        Object.keys(cntPos).forEach(function(k){ _setGridValueByLabel_(g4, k, _fmtCount_(cntPos[k], '명')); });
      }

      // 총근무연차
      var g5 = _findGridByContains_(sumRoot, ['총근무연차']);
      if (g5){
        _setGridValueByLabel_(g5, '직원', _fmtCount_(staffTotal, '명'));
        // 1~10년차는 그대로 표기/집계
        for (var yy=1; yy<=10; yy++){
          var k10 = yy + '년차';
          if (cntYear[k10]) _setGridValueByLabel_(g5, k10, _fmtCount_(cntYear[k10], '명'));
        }

        // 11년차 이상은 '11년차~' 라벨에 합산 표기
        var cnt11p = 0;
        Object.keys(cntYear).forEach(function(k){
          k = _normStr_(k);
          if (!k) return;
          if (k === '11년차 이상'){ cnt11p += (cntYear[k] || 0); return; }
          // 혹시 11년차/12년차... 형태로 들어오는 경우도 방어
          var n = parseInt(String(k).replace(/[^0-9]/g, ''), 10);
          if (n >= 11) cnt11p += (cntYear[k] || 0);
        });
        if (cnt11p) _setGridValueByLabel_(g5, '11년차 이상', _fmtCount_(cnt11p, '명'));
      }

      // 직무전문성
      var g6 = _findGridByContains_(sumRoot, ['직무전문성']);
      if (g6){
        _setGridValueByLabel_(g6, '직원', _fmtCount_(staffTotal, '명'));
        Object.keys(cntExpert).forEach(function(k){ _setGridValueByLabel_(g6, k, _fmtCount_(cntExpert[k], '명')); });
      }

      // 계약
      var g7 = _findGridByContains_(sumRoot, ['계약']);
      if (g7){
        _setGridValueByLabel_(g7, '계약', _fmtCount_(agrTotal, '건'));
        _setGridValueByLabel_(g7, '신규계약', _fmtCount_(agrCatCnt['신규계약'] || 0, '건'));
        _setGridValueByLabel_(g7, '연장계약', _fmtCount_(agrCatCnt['연장계약'] || 0, '건'));
      }

      // 경력
      var g8 = _findGridByContains_(sumRoot, ['경력']);
      if (g8){
        _setGridValueByLabel_(g8, '적용경력', _fmtCount2_(expApplyAgg.cnt, expApplyAgg.months));
        _setGridValueByLabel_(g8, '내부경력', _fmtCount2_(expApplyAgg.in_cnt, expApplyAgg.in_months));
        _setGridValueByLabel_(g8, '외부경력', _fmtCount2_(expApplyAgg.out_cnt, expApplyAgg.out_months));
        _setGridValueByLabel_(g8, '미적용경력', _fmtCount_(expNoCnt.cnt, '건'));
        // 동일 라벨(내부/외부)이 2번 나오므로, 아래는 "미적용" 행을 우선 채우기 위해 뒤에서 다시 세팅
        // (첫 번째 세팅이 이미 적용행에 들어가 있어도, 두 번째 sum-row는 값 갱신 가능)
        var items = g8.querySelectorAll('.sum-row');
        if (items && items.length >= 2){
          // 두 번째 row의 내부/외부에만 재주입
          var row2 = items[1];
          function _setRow2(label, val){
            var its = row2.querySelectorAll('.sum-item');
            for (var i=0;i<its.length;i++){
              var lb = its[i].querySelector('.sum-item-label');
              if (!lb) continue;
              if (_normStr_(lb.textContent) !== label) continue;
              var vv = its[i].querySelector('.sum-item-value');
              if (vv) vv.textContent = val;
            }
          }
          _setRow2('내부경력', _fmtCount_(expNoCnt.in_cnt, '건'));
          _setRow2('외부경력', _fmtCount_(expNoCnt.out_cnt, '건'));
        }
      }

      // 교육이수
      var g9 = _findGridByContains_(sumRoot, ['교육이수']);
      if (g9){
        _setGridValueByLabel_(g9, '교육이수', _fmtCount_(trTotal, '건'));
        _setGridValueByLabel_(g9, '창업', _fmtCount_(trCnt['창업'] || 0, '건'));
        _setGridValueByLabel_(g9, '창업외', _fmtCount_(trCnt['창업외'] || 0, '건'));
      }

      // 자격취득
      var g10 = _findGridByContains_(sumRoot, ['자격취득']);
      if (g10){
        _setGridValueByLabel_(g10, '자격취득', _fmtCount_(qaTotal, '건'));
        _setGridValueByLabel_(g10, '창업', _fmtCount_(qaCnt['창업'] || 0, '건'));
        _setGridValueByLabel_(g10, '창업외', _fmtCount_(qaCnt['창업외'] || 0, '건'));
      }
    }
  }

  function loadEmployeeTabs_(pageRoot, opts){
    opts = opts || {};
    var useSpinner = (opts.spinner !== false);
    var loadingKey = String(opts.loadingKey || 'employee-main');
    var loadingDone = false;
    function _doneLoading_(){
      if (loadingDone) return;
      loadingDone = true;
      if (!useSpinner) return;
      _empHideLoading_(pageRoot, loadingKey);
    }

    if (useSpinner) _empShowLoading_(pageRoot, loadingKey);

    var hasGAS = (typeof google !== 'undefined' && google.script && google.script.run);
    if (!hasGAS) {
      console.warn('google.script.run 없음(웹앱에서 실행 필요)');
      _doneLoading_();
      return Promise.resolve({ ok:false, message:'google.script.run 없음(웹앱에서 실행 필요)' });
    }

    return new Promise(function(resolve){
      google.script.run
        .withSuccessHandler(function(res){
          res = res || { ok:false, message:'EMPLOYEE_listTabs 응답이 없습니다.' };
          if (!res.ok){
            var em = res.message || '목록 조회 실패';
            _doneLoading_();
            if (window.showRetryConfirm){
              window.showRetryConfirm(em, '오류', function(){
                Promise.resolve(loadEmployeeTabs_(pageRoot, opts || {})).then(resolve);
              }, function(){
                if (typeof showAlertError === 'function') showAlertError(em, '오류');
                resolve(res);
              });
              return;
            }
            if (typeof showAlertError === 'function') showAlertError(em, '오류');
            resolve(res);
            return;
          }
          // ✅ 파생필드 계산
          try { decorateEmployeeDerivedFields_(res); } catch(e){}
          pageRoot.__employeeDataBase = res;
          populateFilterOptionsFromData_(pageRoot, res);
          applyFiltersAndRender_(pageRoot);
          _doneLoading_();
          resolve(res);
        })
        .withFailureHandler(function(err){
          var em = (err && err.message) ? err.message : String(err);
          _doneLoading_();

  /** 번들 조회 호출 */
  function _empFetchBundle_(employeeId, onOk, onErr){
    var hasGAS = (typeof google !== 'undefined' && google.script && google.script.run);
    if (!hasGAS) return onErr && onErr({ message:'google.script.run 없음(웹앱에서 실행 필요)' });

    google.script.run
      .withSuccessHandler(function(res){
        res = res || {};
        if (!res.ok) return onErr && onErr({ message: res.message || '상세 조회 실패' });
        onOk && onOk(res);
      })
      .withFailureHandler(function(err){
        onErr && onErr(err);
      })
      .EMPLOYEE_getBundle(employeeId);
  }
  
  /*계산필드*/
  function _truthy_(v){
    var s = String(v == null ? '' : v).trim().toLowerCase();
    if (s === '해당') return true;
    if (s === '미해당') return false;
    return (v === true || s === 'y' || s === 'yes' || s === 'true' || s === '1' || s === 'o' || s === '○');
  }
  function _normYmd_(v){
    if (!v) return '';
    // Date 객체면 YYYY-MM-DD로
    if (Object.prototype.toString.call(v) === '[object Date]' && !isNaN(v.getTime())){
      var y = v.getFullYear();
      var m = String(v.getMonth()+1).padStart(2,'0');
      var d = String(v.getDate()).padStart(2,'0');
      return y + '-' + m + '-' + d;
    }

    var s = String(v).trim();
    // ✅ "2025-01-01 수", "2025.01.01", "2025/01/01" 등에서 YYYY MM DD만 뽑음
    var m = s.match(/(\d{4})\D?(\d{2})\D?(\d{2})/);
    if (!m) return '';

    var yy = +m[1], mm = +m[2], dd = +m[3];
    if (!yy || yy < 1900 || mm < 1 || mm > 12 || dd < 1 || dd > 31) return '';

    return String(yy).padStart(4,'0') + '-' + String(mm).padStart(2,'0') + '-' + String(dd).padStart(2,'0');
  }

  function _ymdToDate_(v){
    var ymd = _normYmd_(v);
    if (!ymd || ymd === '0000-00-00') return null;

    var p = ymd.split('-');
    var y = +p[0], m = +p[1], d = +p[2];
    var dt = new Date(y, m-1, d);

    // 유효성 체크
    if (dt.getFullYear() !== y || dt.getMonth() !== m-1 || dt.getDate() !== d) return null;
    return dt;
  }
  function _todayYmd_(){
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+dd;
  }
  function _minDate_(a,b){ return (!a ? b : !b ? a : (a < b ? a : b)); }
  function _maxDate_(a,b){ return (!a ? b : !b ? a : (a > b ? a : b)); }

  // inclusive 월/일 차이(종료일 포함) → {months,days,text}
  function _diffMonthsDaysInclusiveObj_(startYmd, endYmd){
    startYmd = _normYmd_(startYmd);
    endYmd   = _normYmd_(endYmd);

    var s = _ymdToDate_(startYmd);
    var e = _ymdToDate_(endYmd);
    if (!s || !e) return { months:0, days:0, text:'' };

    // 종료일 포함
    var e2 = new Date(e.getTime());
    e2.setDate(e2.getDate() + 1);

    // months 최대한 땡기기
    var months = (e2.getFullYear() - s.getFullYear()) * 12 + (e2.getMonth() - s.getMonth());
    var anchor = new Date(s.getTime());
    anchor.setMonth(anchor.getMonth() + months);

    // month overflow 보정
    while (anchor.getDate() !== s.getDate() && anchor > s) anchor.setDate(anchor.getDate()-1);

    if (anchor > e2){
      months -= 1;
      anchor = new Date(s.getTime());
      anchor.setMonth(anchor.getMonth() + months);
      while (anchor.getDate() !== s.getDate() && anchor > s) anchor.setDate(anchor.getDate()-1);
    }

    var days = Math.floor((e2 - anchor) / 86400000);

    var text = '';
    if (months > 0) text += months + '개월';
    if (days > 0) text += (text ? ' ' : '') + days + '일';
    if (!text) text = '0일';

    return { months:months, days:days, text:text };
  }

  // root에 [name=key] 또는 [data-field=key] 있으면 세팅
  function _setField_(root, key, val){
    var el = root.querySelector('[name="'+key+'"], [data-field="'+key+'"]');
    if (!el) return;
    _empSetElValue_(el, val);
  }

  function _pickEarliestExpertiseDate_(rows){
    var best = null;
    (rows || []).forEach(function(r){
      if (!_truthy_(r.expertise_apply)) return;
      var d = _ymdToDate_(r.expertise_date);
      if (!d) return;
      best = _minDate_(best, d);
    });
    if (!best) return '';
    var y = best.getFullYear();
    var m = String(best.getMonth()+1).padStart(2,'0');
    var dd = String(best.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+dd;
  }

  function _fmtMdText_(months, days){
    months = parseInt(months || 0, 10) || 0;
    days   = parseInt(days   || 0, 10) || 0;

    var parts = [];
    if (months > 0) parts.push(months + '개월');
    if (days   > 0) parts.push(days   + '일');
    return parts.join(' '); // 둘다 0이면 ''
  }

  // 'N개월 M일' / 'N개월' / 'M일' -> {months, days}
  // - 빈값/'-'/'0개월 0일' => {0,0}
  function _parseMdText_(v){
    var s = String(v == null ? '' : v).trim();
    if (!s || s === '-') return { months: 0, days: 0 };

    var mo = 0, d = 0;
    var m1 = s.match(/(\d+)\s*개월/);
    if (m1) mo = parseInt(m1[1], 10) || 0;
    var m2 = s.match(/(\d+)\s*일/);
    if (m2) d = parseInt(m2[1], 10) || 0;

    // 둘 다 못 찾으면 0으로 간주
    if (!m1 && !m2) return { months: 0, days: 0 };
    if (mo === 0 && d === 0) return { months: 0, days: 0 };
    return { months: mo, days: d };
  }


  function _empVal_(root, key){

  function _empApplyDerivedToModal_(root, bundle){

    var qual = tables.Employee_Qualification || [];

    var exp  = tables.Employee_Experience || [];

    var todayYmd = _todayYmd_();

    // =========================
    // ✅ 최종수정(번들 기준: 삭제 포함) 표시값 덮어쓰기
    // - 서버 EMPLOYEE_getBundle()이 내려주는 bundle_updated_at/by 사용
    // - updated_at input이 날짜형 UI면 YYYY-MM-DD만 넣는 게 안전
    // =========================
    var bAt = (bundle && bundle.bundle_updated_at) ? String(bundle.bundle_updated_at).trim() : '';

    // =========================
    // 1) 직무전문성 상태 (create에서는 식별정보 3종 입력 후 계산)
    // =========================
    var mode = String(root.dataset.mode || '');
    var canCalcExpertise = !(mode === 'create' && !_empIdentityReady_(root));

    if (canCalcExpertise){
      var eduHas  = edu.some(function(r){ return _truthy_(r.expertise_apply); });
      var qualHas = qual.some(function(r){ return _truthy_(r.expertise_apply); });

      var expertiseStatus = '미보유';
      if (!eduHas &&  qualHas) expertiseStatus = '자격보유';
      if ( eduHas && !qualHas) expertiseStatus = '석사보유';
      if ( eduHas &&  qualHas) expertiseStatus = '전체보유';

      _setField_(root, 'expertise_status', expertiseStatus);

      // =========================
      // 2) 직무전문성 반영일
      // =========================
      var eduDate  = _pickEarliestExpertiseDate_(edu);
      var qualDate = _pickEarliestExpertiseDate_(qual);

      var expertiseDate = '';
      if (expertiseStatus === '자격보유') expertiseDate = qualDate;
      else if (expertiseStatus === '석사보유') expertiseDate = eduDate;
      else if (expertiseStatus === '전체보유') {

        var m = _minDate_(d1, d2);

        }

      _setField_(root, 'expertise_date', expertiseDate);

    // =========================

    // =========================
    function inRange_(r){

      if (!s) return false;
      if (s > todayD) return false;

      return (todayD <= e);
    }
    var currentPos = '';
    var currentStart = null;

    pos.forEach(function(r){
      if (!inRange_(r)) return;
      var s = _ymdToDate_(r.start_date);
      if (!s) return;
      if (!currentStart || s > currentStart){
        currentStart = s;
        currentPos = String(r.name || '').trim();
      }
    });

    // 이 필드는 DB에 없을 확률이 높으니 data-field="position_now" 권장
    _setField_(root, 'position_now', currentPos);

    // =========================
    // 4) 직위적용기간(같은 직위명칭 여러 구간 합산)
    // - 종료일 없음/미래 종료일 => 오늘로 캡
    // =========================
    function _sumPosText_(posRows, posName, todayD){
      var sumM=0, sumD=0;
      var hasAny = false;

      posRows.forEach(function(r){
        if (String(r.name||'').trim() !== posName) return;
        if (!_ymdToDate_(r.start_date)) return; // 시작일 없으면 스킵

        hasAny = true;

        var e = _ymdToDate_(r.end_date) || todayD;
        if (e > todayD) e = todayD;

        var eYmd = e.getFullYear()+'-'+String(e.getMonth()+1).padStart(2,'0')+'-'+String(e.getDate()).padStart(2,'0');
        var o = _diffMonthsDaysInclusiveObj_(r.start_date, eYmd);
        sumM += o.months;
        sumD += o.days;
      });

      if (!hasAny) return '';

      // 30일=1개월로 올림(기존 정책 유지)
      sumM += Math.floor(sumD / 30);
      sumD  = sumD % 30;

      return _fmtMdText_(sumM, sumD); // ✅ '0개월' 같은 건 자동으로 빠지고, 값 없으면 ''
    }

    var mapPos = {
      '매니저':'position_staff_level_1',
      '선임매니저':'position_staff_level_2',
      '책임매니저':'position_staff_level_3',
      '수석매니저':'position_staff_level_4',
      '총괄매니저':'position_staff_level_5',
      '실장':'position_staff_level_6',
      '센터장':'position_faculty_level_1',
      '부단장':'position_faculty_level_2',
      '단장':'position_faculty_level_3'
    };

    Object.keys(mapPos).forEach(function(posName){
      _setField_(root, mapPos[posName], _sumPosText_(pos, posName, todayD));
    });

    // =========================
    // 5) 근무정보
    // =========================
    // 계약시작일: 신규계약 start_date (여러개면 가장 빠른)
    var contractStart = '';
    (agr || []).forEach(function(r){
      if (String(r.category || '').trim() !== '신규계약') return;
      var d = _ymdToDate_(r.start_date);
      if (!d) return;
      if (!contractStart) contractStart = r.start_date;
      else {
        var cur = _ymdToDate_(contractStart);
        if (cur && d < cur) contractStart = r.start_date;
      }
    });

    // 계약종료일: end_date 중 가장 뒤 / 단, 하나라도 end_date가 공란이면 공란
    var hasOpenEnd = (agr || []).some(function(r){ return !String(r.end_date || '').trim(); });
    var contractEnd = '';
    if (!hasOpenEnd){
      var maxEnd = null;
      (agr || []).forEach(function(r){
        var d = _ymdToDate_(r.end_date);
        if (!d) return;
        maxEnd = _maxDate_(maxEnd, d);
      });
      if (maxEnd){
        contractEnd = maxEnd.getFullYear()+'-'+String(maxEnd.getMonth()+1).padStart(2,'0')+'-'+String(maxEnd.getDate()).padStart(2,'0');
      }
    }

    // 계약기간: (종료 있으면 start~end, 종료 없으면 start~today)
    // 단, end < start(미래 시작 + 종료없음 등) 이면 빈값
    var contractPeriodText = '';
    var contractStartD = contractStart ? _ymdToDate_(contractStart) : null;
    var contractEndD   = contractEnd   ? _ymdToDate_(contractEnd)   : null;

    // 계약기간의 종료 기준: 종료일 있으면 종료일, 없으면 오늘
    var periodEndD = contractEndD || todayD;
    if (contractStartD && periodEndD && contractStartD <= periodEndD) {
      var periodEndYmd = periodEndD.getFullYear()+'-'+String(periodEndD.getMonth()+1).padStart(2,'0')+'-'+String(periodEndD.getDate()).padStart(2,'0');
      contractPeriodText = _diffMonthsDaysInclusiveObj_(contractStart, periodEndYmd).text;
    }

    // 재직기간: 계약시작일부터 "min(오늘, 계약종료일)" 까지
    // ✅ 핵심: 계약시작일이 미래면( start > today ) 재직기간은 빈값
    var tenureText = '';
    var tenureObj = {months:0, days:0};

    // 재직기간의 종료 기준: 종료일이 있고(정규직이면 null), 종료일이 오늘보다 과거면 종료일, 아니면 오늘
    var tenureEndD = todayD;
    if (contractEndD && contractEndD < todayD) tenureEndD = contractEndD;
    var isTenureValid = (contractStartD && tenureEndD && contractStartD <= tenureEndD);

    if (isTenureValid) {
      var tenureEndYmd = tenureEndD.getFullYear()+'-'+String(tenureEndD.getMonth()+1).padStart(2,'0')+'-'+String(tenureEndD.getDate()).padStart(2,'0');
      var o2 = _diffMonthsDaysInclusiveObj_(contractStart, tenureEndYmd);
      tenureText = o2.text;
      tenureObj = o2;
    } else {
      tenureText = '';
      tenureObj = {months:0, days:0};
    }

    // =========================
    // 5-추가) 고용상태(status) 자동 계산
    // - 오늘 유효 계약 있으면 "재직"
    // - 과거/현재 시작 계약은 있는데 유효 계약 없으면 "퇴직"
    // - 전부 미래 시작이면 "재직예정"
    // - 계약 자체 없으면 ""(빈값)
    // =========================
    var hasAnyAgreement = false;
    var hasPastOrCurrentAgreement = false; // start_date <= today
    var hasFutureAgreement = false;        // start_date > today
    var isActiveToday = false;             // 오늘 유효 계약

    (agr || []).forEach(function(r){
      var s = _ymdToDate_(r.start_date);
      if (!s || !todayD) return;

      hasAnyAgreement = true;

      if (s <= todayD) hasPastOrCurrentAgreement = true;
      else hasFutureAgreement = true;

      var e = _ymdToDate_(r.end_date); // 종료일 없으면 null
      var active =
        (s <= todayD) &&
        (!e || todayD <= e);

      if (active) isActiveToday = true;
    });

    var autoStatus = '';
    if (hasAnyAgreement) {
      if (isActiveToday) autoStatus = '재직';
      else if (hasPastOrCurrentAgreement) autoStatus = '퇴직';
      else if (hasFutureAgreement) autoStatus = '재직예정';
      else autoStatus = '';
    }

    // ✅ 계약이 있는 경우엔 자동 상태로 갱신(항상 표시되게)
    if (hasAnyAgreement) {
      _setField_(root, 'status', autoStatus);
    } else {
      // 계약이 아예 없으면 기존 값이 없을 때만 빈값 유지
      var curStatus = _empVal_(root, 'status');
      if (!curStatus) _setField_(root, 'status', '');
    }

    // 경력기간(적): 내부경력(적용), 외부경력(적용) 의 period(숫자개월) 합산
    var 적용Set = { '내부경력(적용)':true, '외부경력(적용)':true };
    var expMonths = 0;
    (exp || []).forEach(function(r){
      var c = String(r.categroy || r.category || '').trim(); // 시트 오타 대응
      if (!적용Set[c]) return;
      var n = parseInt(r.period != null ? r.period : r.working_period, 10);
      if (!isNaN(n)) expMonths += n;
    });

    // 총근무연수/연차는 "재직이 시작된 경우에만" 계산 (미래 시작이면 빈값)
    var totalWorkSimple = '';
    var yearCountText = '';

    if (isTenureValid) {
      var totalDays = (tenureObj.months * 30 + tenureObj.days) + (expMonths * 30);
      var totalM = Math.floor(totalDays / 30);
      var totalD = totalDays % 30;

      totalWorkSimple = _fmtMdText_(totalM, totalD);

      var units = totalM * 30 + totalD;
      var year = Math.floor((Math.max(units,1) - 1) / 360) + 1;
      yearCountText = year + '년차';
    }

    // ✅ DB에 있는 컬럼이면 name="..."에 넣어 저장되게
    _setField_(root, 'agreement_start_date', contractStart);
    _setField_(root, 'agreement_end_date', contractEnd);
    _setField_(root, 'agreement_period', contractPeriodText);

    // 재직기간(=오늘까지)
    _setField_(root, 'agreement_period_now', tenureText);

    // 경력기간(숫자개월) — DB에는 숫자만 저장하려면 expMonths 그대로 두는 게 안전
    _setField_(root, 'experience_approval_period', expMonths ? (expMonths + '개월') : '');

    // 총근무연수(표시용) — "총 개월/일 (년/개월/일)" 형태로
    _setField_(root, 'working_period', totalWorkSimple);

    // 총근무연차(표시용)
    _setField_(root, 'working_yearcount', yearCountText);
  }

// =========================
// ✅ PATCH: 직무전문성여부(해당/미해당)에 따른 반영일 잠금
// - Employee_Education / Employee_Qualification 테이블 공통 적용
// =========================
function _empIsExpertiseApplyYes_(v){
  return String(v == null ? '' : v).trim() === '해당';
}

function _empApplyExpertiseDateLocks_(root){
  if (!root) return;

  var mode = String(root.dataset.mode || 'view'); // view/create/edit
  var inView = (mode === 'view');

  // 두 테이블만 대상으로
  var tables = root.querySelectorAll(
    'table.tbl[data-entity="Employee_Education"], table.tbl[data-entity="Employee_Qualification"]'
  );

  tables.forEach(function(table){
    var tbody = table.tBodies && table.tBodies[0];
    if (!tbody) return;

    Array.from(tbody.rows).forEach(function(tr){
      var sel  = tr.querySelector('select[data-field="expertise_apply"]');
      var date = tr.querySelector('input[data-field="expertise_date"]');
      if (!sel || !date) return;

      var ok = _empIsExpertiseApplyYes_(sel.value);

      // view에서는 원래 _empSetMode_가 전체 잠그므로 굳이 건드리지 않아도 되지만,
      // 확실히 하기 위해 상태만 맞춰둠(값은 view에서는 유지)
      if (inView) {
        date.disabled = true;
        return;
      }

      // edit/create 모드: '해당'만 입력 허용
      date.disabled = !ok;

      // 미해당/공란이면 값이 들어있어도 UI에서 제거(저장 불일치 예방)
      if (!ok && String(date.value || '').trim() !== '') {
        date.value = '';
        try { date.dispatchEvent(new Event('input', { bubbles:true })); } catch(e){}
        try { date.dispatchEvent(new Event('change', { bubbles:true })); } catch(e){}
      }
    });
  });
}




function _empReadFieldValue_(el){
  if (!el) return '';
  if (el.matches('input,select,textarea')) {
    var v = el.value;
    // ✅ date 입력은 "YYYY-MM-DD 요일"이어도 계산/저장에는 YYYY-MM-DD만 쓰기
    if (el.classList.contains('input-date')) return _normYmd_(v);
    return (v == null ? '' : String(v));
  }
  return (el.textContent == null ? '' : String(el.textContent));
}

function _isBlankRow_(obj){
  // employee_id 같은 FK/hidden 제외하고, 실제 입력 필드 기준으로 판단
  var ignore = { employee_id:1, position_id:1, agreement_id:1, experience_id:1, education_id:1, training_id:1, qualification_id:1 };
  return !Object.keys(obj).some(function(k){
    if (ignore[k]) return false;
    return String(obj[k]||'').trim() !== '';
  });
}

function _empBuildTablesFromDom_(root){
  var out = {};

  root.querySelectorAll('table.tbl[data-entity]').forEach(function(table){
    var entity = table.getAttribute('data-entity');
    var rows = [];

    var trs = (table.tBodies[0] ? Array.from(table.tBodies[0].rows) : []);
    trs.forEach(function(tr){
      var obj = {};
      tr.querySelectorAll('[data-field]').forEach(function(el){
        if (el.dataset.nosave === '1') return;
        var k = el.dataset.field;
        obj[k] = _empReadFieldValue_(el).trim();
      });
      // ✅ PATCH: 미해당/공란인데 반영일 들어있으면 서버로 보내지 않기(키 제거)
      // - 학력/자격 테이블에만 해당 필드가 존재하지만, 안전하게 공통처리
      if (Object.prototype.hasOwnProperty.call(obj, 'expertise_apply')) {
        var ok = _empIsExpertiseApplyYes_(obj.expertise_apply);
        if (!ok && Object.prototype.hasOwnProperty.call(obj, 'expertise_date')) {
          delete obj.expertise_date; // ✅ "서버로 보내지 않기"
        }
      }

      // ✅ Employee_File: UI base/ext → DB file_name(확장자 포함)로 합치기
      if (entity === 'Employee_File') {
        var baseEl = tr.querySelector('[data-field="file_name"]');
        var base = String(baseEl && baseEl.value ? baseEl.value : (obj.file_name || '')).trim();
        var ext  = String(tr.dataset.empFileExt || '').trim();
        obj.file_name = base ? (base + (ext ? '.' + ext : '')) : '';
      }
      
      // ✅ 저장에서는 "완전 빈 행" 제외
      if (!_isBlankRow_(obj)) rows.push(obj);
    });

    out[entity] = rows;
  });

  return out;
}


function _empRecalcAll_(root){
  if (!root || root.__empRecalcLock) return;
  root.__empRecalcLock = true;
  try{
    _empUpdateTablePeriods_(root);
    var tables = _empBuildTablesFromDom_(root);
    _empApplyDerivedToModal_(root, { tables: tables }); // ✅ 기존 계산 로직 재사용
  } finally {
    root.__empRecalcLock = false;
  }
}

function _empBindLiveCalc_(root){
  if (!root || root.__empLiveCalcBound) return;
  root.__empLiveCalcBound = true;

  var t = null;
  function schedule(){
    if (t) return;
    t = setTimeout(function(){
      t = null;
      _empRecalcAll_(root);
    }, 0);
  }

  // 입력/변경 시 즉시 재계산
  root.addEventListener('input', function(e){
    if (!e.target) return;
    schedule();
  }, true);

  root.addEventListener('change', function(e){
    var t = e.target;
    if (!t || !t.matches) return;

    // 두 테이블의 expertise_apply만 타겟
    var hit =
      t.matches('table.tbl[data-entity="Employee_Education"] select[data-field="expertise_apply"]') ||
      t.matches('table.tbl[data-entity="Employee_Qualification"] select[data-field="expertise_apply"]');

    if (!hit) return;

    _empApplyExpertiseDateLocks_(root); // 전체 재적용(행 추가/삭제도 고려)
  }, true);

  root.addEventListener('change', function(){
    schedule();
  }, true);

  // 추가/삭제 버튼 클릭 후에도 재계산(행이 바뀌니까)
  // =========================
  // ✅ PATCH: 테이블 행 추가/삭제 + PK 유지/초기화
  // =========================
  function _empResolveActionTable_(root, btn){
    // 1) 가장 안전: 버튼이 entity를 들고 있으면 그걸 사용
    var entity =
      btn.getAttribute('data-entity') ||
      btn.getAttribute('data-tbl-entity') ||
      btn.dataset.entity ||
      btn.dataset.tblEntity ||
      '';

    if (entity) {
      var t1 = root.querySelector('table.tbl[data-entity="'+entity+'"]');
      if (t1) return t1;
    }

    // 2) fallback: 같은 섹션(.sec) 안의 테이블
    var sec = btn.closest('.sec');
    if (sec) {
      var t2 = sec.querySelector('table.tbl[data-entity]');
      if (t2) return t2;
    }

    // 3) 최후: root 내 첫 테이블
    return root.querySelector('table.tbl[data-entity]');
  }

  function _empClearRowForNew_(tr, employeeId){
    // 체크 해제
    var chk = tr.querySelector('input[type="checkbox"]');
    if (chk) chk.checked = false;

    // PK는 무조건 비우기 (data-pk="1")
    tr.querySelectorAll('[data-field][data-pk="1"]').forEach(function(el){
      if (el.matches('input,select,textarea')) el.value = '';
      else el.textContent = '';
    });

    // FK(employee_id)는 채우기
    tr.querySelectorAll('[data-field="employee_id"]').forEach(function(el){
      if (el.matches('input,select,textarea')) el.value = (employeeId || '');
      else el.textContent = (employeeId || '');
    });

    // is_deleted 있으면 0으로
    tr.querySelectorAll('[data-field="is_deleted"]').forEach(function(el){
      if (el.matches('input,select,textarea')) el.value = '0';
      else el.textContent = '0';
    });
  }

  function _empAddTableRow_(root, btn){
    var table = _empResolveActionTable_(root, btn);
    if (!table || !table.tBodies[0]) return;

    var tbody = table.tBodies[0];

    // ✅ 템플릿 행 확보(전체 삭제되어도 행추가 가능해야 함)
    if (!table.__empRowTemplate){
      var t0 = tbody.querySelector('tr');
      if (t0) table.__empRowTemplate = t0.cloneNode(true);
    }

  // 기준 행: 마지막 '실제 입력 행' / 없으면 저장된 템플릿
  var src = null;
  var all = Array.from(tbody.querySelectorAll('tr'));
  for (var i=all.length-1; i>=0; i--){
    var r0 = all[i];
    if (r0 && r0.classList && r0.classList.contains('emp-empty-row')) continue;
    if (r0 && r0.querySelector && r0.querySelector('[data-field]')) { src = r0; break; }
  }
  src = src || table.__empRowTemplate;
    if (!src) return;

    var tr = src.cloneNode(true);

    // ✅ clone 시 복제되는 enhance wrapper 제거 후, 새로 초기화 가능하게 만들기
    try { if (typeof normalizeRowForReinit === 'function') normalizeRowForReinit(tr); } catch(e){}

    // 새 행은 입력값 전부 초기화(단, employee_id는 FK로 다시 채움)
    tr.querySelectorAll('input,select,textarea,[data-field]').forEach(function(el){
      if (!el) return;
      if (el.matches('input,select,textarea')) {
        var type = (el.getAttribute('type') || '').toLowerCase();
        if (type === 'checkbox') {
          el.checked = false;
          el.indeterminate = false;
        } else if (el.tagName === 'SELECT'){
          // select는 기본값 유지가 더 자연스러워서 건드리지 않음
          // 완전 초기화가 필요하면 아래를 사용
          // el.selectedIndex = 0;
        } else {
          el.value = '';
        }
      } else if (el.hasAttribute('data-field')) {
        el.textContent = '';
      }
    });

    // PK/FK 규칙 적용
    var employeeId = '';
    try{
      var master = root.querySelector('.emp-modal-root[data-entity="Employee"]') || root;
      var idEl = master.querySelector('[data-field="employee_id"]');
      employeeId = idEl ? String(_empReadFieldValue_(idEl) || '').trim() : '';
    }catch(e){}

    _empClearRowForNew_(tr, employeeId);

    tbody.appendChild(tr);

    // ✅ 새 행만 재초기화(특히 input-date가 핵심)
    try { if (typeof initAnimatedCheckboxes === 'function') initAnimatedCheckboxes(tr); } catch(e){}
    try { if (window.initInputDateFields) window.initInputDateFields(tr); } catch(e){}
    try { if (window.initInputTimeFields) window.initInputTimeFields(tr); } catch(e){}
    try { if (window.initUnitInputs) window.initUnitInputs(tr); } catch(e){}
    try { if (window.initUnitTextTbl) window.initUnitTextTbl(tr); } catch(e){}
    try { if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(tr); } catch(e){}
    try { if (window.initTableRowCheckboxes) window.initTableRowCheckboxes(table); } catch(e){}
  }

  function _empDeleteSelectedRows_(root, btn){
    var table = _empResolveActionTable_(root, btn);
    if (!table || !table.tBodies[0]) return;
    var entity = String(table.getAttribute('data-entity') || '').trim();

    var tbody = table.tBodies[0];
    var trs = Array.from(tbody.rows);

    if (!trs.length) {
      // ✅ 비정상 상태면 템플릿으로 1행 복구
      _empAddTableRow_(root, btn);
      return 0;
    }

    // ✅ 템플릿 캐싱(전체 삭제 후에도 add가 가능하도록)
    if (!table.__empRowTemplate){
      table.__empRowTemplate = trs[0].cloneNode(true);
      try { if (typeof normalizeRowForReinit === 'function') normalizeRowForReinit(table.__empRowTemplate); } catch(e){}
    }

    // 체크된 행 목록

    trs.forEach(function(tr){
      var chk = tr.querySelector('input[type="checkbox"].chk-anim') || tr.querySelector('input[type="checkbox"]');
      if (chk && chk.checked) checkedRows.push(tr);
    });

    if (!checkedRows.length) return 0;

    var removed = 0;

    // ✅ 전체 선택된 경우: 1행은 보전하고 값만 비움 (Project와 동일)
    if (checkedRows.length >= trs.length){
      // ✅ Employee_File: 전체 삭제면 placeholder 1행 유지(입력행 생성 X)
      if (entity === 'Employee_File'){
        tbody.innerHTML = '';
        try{
          var colCount = (table.tHead && table.tHead.rows && table.tHead.rows[0]) ? table.tHead.rows[0].cells.length : 1;
          var tr0 = document.createElement('tr');
          tr0.className = 'emp-empty-row';
          tr0.innerHTML = '<td colspan="'+colCount+'"><div class="text-tbl">데이터가 없습니다.</div></td>';
          tbody.appendChild(tr0);
        }catch(e){}
        removed = trs.length;
      } else {
      var keepRow = trs[0];
      trs.slice(1).forEach(function(tr){ tr.remove(); removed++; });

      // keepRow 값 비우기 + PK/FK 규칙 재적용
      // (기존 clearRowValues가 있으면 사용)
      if (typeof clearRowValues === 'function') {
        clearRowValues(keepRow, 'clear');
      } else {
        keepRow.querySelectorAll('input,select,textarea,[data-field]').forEach(function(el){
          if (!el) return;
          if (el.matches('input,select,textarea')) {
            var type = (el.getAttribute('type') || '').toLowerCase();
            if (type === 'checkbox') { el.checked = false; el.indeterminate = false; }
            else if (el.tagName !== 'SELECT') el.value = '';
          } else if (el.hasAttribute('data-field')) {
            el.textContent = '';
          }
        });
      }

      // employee_id 다시 주입 + pk 초기화
      var employeeId = '';
      try{
        var master = root.querySelector('.emp-modal-root[data-entity="Employee"]') || root;
        var idEl = master.querySelector('[data-field="employee_id"]');
        employeeId = idEl ? String(_empReadFieldValue_(idEl) || '').trim() : '';
      }catch(e){}
      _empClearRowForNew_(keepRow, employeeId);

      // 선택 해제
      keepRow.classList.remove('row-selected');
      keepRow.querySelectorAll('input[type="checkbox"].chk-anim, input[type="checkbox"]').forEach(function(cb){
        cb.checked = false;
        cb.indeterminate = false;
      });

      }
    } else {      // 일부 선택 삭제
      checkedRows.forEach(function(tr){ tr.remove(); removed++; });

      // 최소 1행 유지
      if (!tbody.rows.length){
        if (entity === 'Employee_File'){
          try{
            var colCount2 = (table.tHead && table.tHead.rows && table.tHead.rows[0]) ? table.tHead.rows[0].cells.length : 1;
            var tr00 = document.createElement('tr');
            tr00.className = 'emp-empty-row';
            tr00.innerHTML = '<td colspan="'+colCount2+'"><div class="text-tbl">데이터가 없습니다.</div></td>';
            tbody.appendChild(tr00);
          }catch(e){}
        } else {
          _empAddTableRow_(root, btn);
        }
      }
    }
    // ✅ 헤더 체크박스/indeterminate 리셋
    var headCb = table.querySelector('thead input[type="checkbox"].chk-anim') || table.querySelector('thead input[type="checkbox"]');
    if (headCb){
      headCb.checked = false;
      headCb.indeterminate = false;
      headCb.__bulkUpdating = false;
    }

    // ✅ 남은 행들 선택 해제
    table.querySelectorAll('tbody input[type="checkbox"].chk-anim, tbody input[type="checkbox"]').forEach(function(cb){
      cb.checked = false;
      cb.indeterminate = false;
      var tr = cb.closest('tr');
      if (tr) tr.classList.remove('row-selected');
    });

    // ✅ (중요) 삭제 후 남은 행들에 대해 바인딩/보강
    try { if (window.initTableRowCheckboxes) window.initTableRowCheckboxes(table); } catch(e){}
    try { if (window.initInputDateFields) window.initInputDateFields(table); } catch(e){}

    return removed;
  }

  // 기존: 클릭하면 재계산만 했는데,
  // ✅ 이제 add/delete를 처리하고 재계산까지 수행
  root.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-tbl-action]');
    if (!btn) return;

    var action = (btn.getAttribute('data-tbl-action') || '').toLowerCase();

    if (action === 'add') {
      e.preventDefault();
      e.stopPropagation();
      _empAddTableRow_(root, btn);
      setTimeout(function(){ _empRecalcAll_(root); }, 0);
      return;
    }

    if (action === 'delete') {
      e.preventDefault();
      e.stopPropagation();
      _empDeleteSelectedRows_(root, btn);
      setTimeout(function(){ _empRecalcAll_(root); }, 0);
      return;
    }

    // 그 외 액션이 있으면 기존대로 재계산만
    setTimeout(function(){ _empRecalcAll_(root); }, 0);
  }, true);
  _empApplyExpertiseDateLocks_(root);
}


function _empUpdateTablePeriods_(root){

// =========================
// ✅ 상세(페이지모달) 테이블 정렬 유틸
// - 현재 번들 조회는 정렬 없이(대개 등록id/행순) 내려오므로,
//   상세 페이지에서는 "테이블별 date 오름차순"만 강제한다.
// - 공통 employee_id 정렬은 상세에서는 제외(단일 employee 기준이므로 불필요)
// =========================
function _empSortRowsByDateAsc_(rows, field){
  rows = Array.isArray(rows) ? rows.slice() : [];
  var MAX = 9007199254740991; // 빈값은 마지막

  function toTs_(v){
    try{
      if (typeof _ymdToDate_ === 'function'){
        var d = _ymdToDate_(v);
        return d ? d.getTime() : MAX;
      }
    }catch(e){}
    return MAX;
  }

  rows.sort(function(a,b){
    var ta = toTs_(a && a[field]);
    var tb = toTs_(b && b[field]);
    if (ta !== tb) return ta - tb;
    // 동률이면 안정화를 위해 id 계열이 있으면 그걸로 2차 정렬(없으면 0)
    // (등록id 순을 완전히 버리지는 않고 타이브레이커로만 사용)
    var ida = String((a && (a.position_id||a.agreement_id||a.experience_id||a.education_id||a.training_id||a.qualification_id)) || '');
    var idb = String((b && (b.position_id||b.agreement_id||b.experience_id||b.education_id||b.training_id||b.qualification_id)) || '');
    if (ida && idb) return ida.localeCompare(idb);
    return 0;
  });
  return rows;
}

function _empReInitInputDateFields_(root){
  if (!root || typeof window.initInputDateFields !== 'function') return;

  // 1) cloneNode로 복제된 “가짜 enhanced” 정리
  // - dataset.enhancedDate=1은 복제되지만 이벤트/flatpickr는 복제 안됨 → 재초기화 필요
  root.querySelectorAll('.input-date-wrap').forEach(function(wrap){
    var el = wrap.querySelector('input.input-date');
    if (!el) return;

    var needReset = (el.dataset.enhancedDate === '1' && !el._flatpickr);
    if (!needReset) return;

    // 아이콘 버튼 제거(있으면)
    wrap.querySelectorAll('button.input-icon-btn').forEach(function(b){ b.remove(); });

    // unwrap: input을 밖으로 빼고 wrap 제거
    var parent = wrap.parentNode;
    if (parent) parent.insertBefore(el, wrap);
    wrap.remove();

    // 플래그 제거
    delete el.dataset.enhancedDate;
  });

  // 2) wrap은 없는데 플래그만 남은 케이스도 제거
  root.querySelectorAll('input.input-date').forEach(function(el){
    if (el.dataset.enhancedDate === '1' && !el._flatpickr){
      delete el.dataset.enhancedDate;
    }
  });

  // 3) 다시 보강
  window.initInputDateFields(root);
}

/** Employee_File 정렬: (1) 구분 순서, (2) 파일명 오름차순 */
function _empSortEmployeeFiles_(rows){
  rows = Array.isArray(rows) ? rows.slice() : [];
  var order = {
    '신분': 1,
    '계좌': 2,
    '계약': 3,
    '경력': 4,
    '학력': 5,
    '교육': 6,
    '자격': 7
  };
  rows.sort(function(a,b){
    a = a || {}; b = b || {};
    var oa = order[String(a.file_category||'').trim()] || 999;
    var ob = order[String(b.file_category||'').trim()] || 999;
    if (oa !== ob) return oa - ob;

    var na = String(a.file_name||'').trim().toLowerCase();
    var nb = String(b.file_name||'').trim().toLowerCase();
    if (na < nb) return -1;
    if (na > nb) return 1;
    return 0;
  });
  return rows;
}

function _empSplitFileName_(filename){
  filename = String(filename || '');
  var idx = filename.lastIndexOf('.');
  if (idx <= 0 || idx === filename.length-1) return { base: filename, ext: '' };
  return { base: filename.slice(0, idx), ext: filename.slice(idx+1) };
}

function _empFmtBytes_(n){
  n = Number(n || 0) || 0;
  if (n <= 0) return '';
  if (n < 1024) return n + ' B';
  var kb = n / 1024;
  if (kb < 1024) return kb.toFixed(1) + ' KB';
  var mb = kb / 1024;
  if (mb < 1024) return mb.toFixed(1) + ' MB';
  var gb = mb / 1024;
  return gb.toFixed(1) + ' GB';
}

/** Employee_File: DB에는 file_name(확장자 포함) 저장, UI에서는 base/ext 분리 표시 */
function _empNormalizeEmployeeFileRowsDom_(rootEl){
  if (!rootEl) return;
  var table = rootEl.querySelector('table.tbl[data-entity="Employee_File"]');
  if (!table || !table.tBodies || !table.tBodies[0]) return;

  Array.from(table.tBodies[0].rows).forEach(function(tr){
    if (tr && tr.classList && tr.classList.contains('emp-empty-row')) return;
    var nameEl = tr.querySelector('[data-field="file_name"]');
    if (nameEl && nameEl.matches('input,textarea,select')){
      var full = String(nameEl.value || '').trim();
      if (full){
        var sp = _empSplitFileName_(full);
        nameEl.value = sp.base;
        tr.dataset.empFileExt = sp.ext || '';
        var extEl = tr.querySelector('[data-emp-file-ext]');
        if (extEl) extEl.textContent = sp.ext || '';
      }
    }
    // size 표시(숨김 size(bytes) → 표시 텍스트)
    var sizeInp = tr.querySelector('input[type="hidden"][data-field="size"]');
    var sizeBox = tr.querySelector('[data-emp-file-size]');
    if (sizeInp && sizeBox){
      var bytes = Number(String(sizeInp.value||'').trim() || 0) || 0;
      sizeBox.textContent = _empFmtBytes_(bytes);
    }
  });
}

/**
 * Employee_File 섹션 바인딩
 * - 행추가(+) 버튼 클릭 → 파일 선택 → Drive 업로드 → 새 행 추가(즉시)
 * - 자료명은 확장자 제거(base)로 입력되고, 자료형식(file_ext)에 확장자 표시
 * - 저장은 기존대로 모달 푸터 저장에서 DB(Employee_File 시트)에 반영
 * - 조회모드(view)에서도 체크박스로 선택 후 미리보기/다운로드 가능
 */
function _empBindEmployeeFileSection_(rootEl){
  if (!rootEl) return;

  var table = rootEl.querySelector('table.tbl[data-entity="Employee_File"]');
  if (!table || table.__empFileBound) return;
  table.__empFileBound = true;

  var sec = table.closest('.sec') || rootEl;
  var btnAdd = sec.querySelector('button[data-emp-file-action="add"], button[data-tbl-action="add"]');
  var fileAddInput = sec.querySelector('[data-emp-file-add-input]');
  var btnPreview = sec.querySelector('button[data-emp-file-action="preview"]');
  var btnDownload = sec.querySelector('button[data-emp-file-action="download"]');

  function _employeeId_(){
    var el = rootEl.querySelector('[data-field="employee_id"][data-pk="1"]')
          || rootEl.querySelector('[name="employee_id"], [data-field="employee_id"]');
    return String(el ? el.value : '').trim();
  }

  function _employeeName_(){
    var el = rootEl.querySelector('[data-field="name"]')
          || rootEl.querySelector('[name="name"]');
    if (!el) return '';
    if (el.matches && el.matches('input,select,textarea')) return String(el.value || '').trim();
    return String(el.textContent || '').trim();
  }

  function _mode_(){
    return String(rootEl.dataset.mode || '').trim() || 'view';
  }

  function _getSelectedRows_(){
    var rows = [];
    (table.tBodies[0] ? Array.from(table.tBodies[0].rows) : []).forEach(function(tr){
      var chk = tr.querySelector('td input[type="checkbox"]');
      if (chk && chk.checked) rows.push(tr);
    });
    return rows;
  }

  function _readField_(tr, field){
    var el = tr.querySelector('[data-field="'+field+'"]');
    if (!el) return '';
    if (el.matches('input,select,textarea')) return String(el.value || '').trim();
    return String(el.textContent || '').trim();
  }

  function _setField_(tr, field, value){
    var el = tr.querySelector('[data-field="'+field+'"]');
    if (!el) return;
    if (el.matches('input,select,textarea')) el.value = (value == null ? '' : String(value));
    else el.textContent = (value == null ? '' : String(value));
  }

  function _cloneTemplateRow_(){
    var tbody = table.tBodies[0];
    var tpl = null;
    if (tbody && tbody.rows && tbody.rows.length){
      // ✅ placeholder(emp-empty-row) 제외하고 실제 입력 템플릿 행을 찾는다
      for (var i=0; i<tbody.rows.length; i++){
        var r0 = tbody.rows[i];
        if (r0 && r0.classList && r0.classList.contains('emp-empty-row')) continue;
        if (r0 && r0.querySelector && r0.querySelector('[data-field]')) { tpl = r0; break; }
      }
    }
    if (!tpl) tpl = (table.__empTemplateRow || null);
    if (!tpl) return null;
    var tr = tpl.cloneNode(true);

    // 체크 해제
    var chk = tr.querySelector('input[type="checkbox"]');
    if (chk) chk.checked = false;

    // 값 초기화
    tr.querySelectorAll('[data-field]').forEach(function(el){
      var key = el.dataset.field || '';
      // 텍스트(tbl)도 초기화
      if (el.matches('input,select,textarea')) el.value = '';
      else el.textContent = '';
    });

    // 자료구분 기본값
    var sel = tr.querySelector('select[data-field="file_category"]');
    if (sel) sel.value = '';

    // ✅ 조회모드에서 캡처된 disabled 템플릿이 복제되는 경우를 방지
    // - create/edit에서 추가되는 Employee_File 행은 입력 가능해야 한다.
    if (_mode_() !== 'view'){
      tr.querySelectorAll('input, select, textarea').forEach(function(el){
        var t = String(el.getAttribute('type') || '').toLowerCase();
        if (t === 'hidden') return;
        el.disabled = false;
      });
    }

    return tr;
  }

  function _ensureDriveUtil_(){
    if (!window.DriveFileUtil || typeof window.DriveFileUtil.upload !== 'function') {
      throw new Error('DriveFileUtil이 없습니다. driveFileUtil.html 포함 여부를 확인해주세요.');
    }
  }

  // =========================
  // (+) 파일선택 → (행 생성: pending) → 저장 시 업로드/DB 반영
  // =========================
  if (btnAdd && fileAddInput){
    btnAdd.addEventListener('click', function(e){
      // ✅ Employee_File add는 기본 row-clone 동작을 차단
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();

      if (_mode_() === 'view') return;


      // 같은 파일 연속 선택 허용
      fileAddInput.value = '';
      fileAddInput.click();
    }, true);

    fileAddInput.addEventListener('change', function(){
      try{
        if (_mode_() === 'view') return;
        var empId = _employeeId_();
        if (!empId){
          if (typeof showAlertWarn === 'function') showAlertWarn('사번(employee_id) 입력 후 파일을 추가해주세요.', '파일 추가');
          return;
        }
        
        var file = (fileAddInput.files && fileAddInput.files[0]) ? fileAddInput.files[0] : null;
        if (!file) return;

        // ✅ 업로드 조건: PDF만 허용, 1개당 5MB 제한
        var maxBytes = 5 * 1024 * 1024;
        var fileNameLower = String(file.name || '').toLowerCase();
        var isPdf = (String(file.type || '').toLowerCase() === 'application/pdf') || fileNameLower.endsWith('.pdf');
        if (!isPdf){
          if (typeof showAlertWarn === 'function') showAlertWarn('PDF 파일만 업로드할 수 있습니다.', '파일 추가');
          fileAddInput.value = '';
          return;
        }
        if ((file.size || 0) > maxBytes){
          if (typeof showAlertWarn === 'function') showAlertWarn('파일 용량은 1개당 최대 5MB까지 가능합니다.', '파일 추가');
          fileAddInput.value = '';
          return;
        }

        var sp = _empSplitFileName_(file.name || '');
        var tr = _cloneTemplateRow_();
        if (!tr){
          // 등록모드: tbody 비어도 table.__empTemplateRow로 생성
          var tpl = table.__empTemplateRow ? table.__empTemplateRow.cloneNode(true) : null;
          if (!tpl) throw new Error('Employee_File 템플릿 행을 찾지 못했습니다.');
          tr = tpl;
          // 체크 해제/값 초기화
          var chk = tr.querySelector('input[type="checkbox"]');

          tr.querySelectorAll('[data-field]').forEach(function(el){
            if (el.matches('input,select,textarea')) el.value = '';
            else el.textContent = '';
          });
        }

        // ✅ pending 파일 보관(저장 시 업로드)
        tr.__empPendingFile = file;
        tr.dataset.empPending = '1';

        // 시스템 필드(업로드 전: file_id/drive_url는 비움)
        _setField_(tr, 'file_id', '');
        _setField_(tr, 'employee_id', empId);
        _setField_(tr, 'mime_type', file.type || '');
        _setField_(tr, 'drive_url', '');

        // ✅ UI: 자료명(base)/자료형식(ext)/용량 표시
        _setField_(tr, 'file_name', sp.base);
        tr.dataset.empFileExt = sp.ext || '';
        var extEl = tr.querySelector('[data-emp-file-ext]');
        if (extEl) extEl.textContent = sp.ext || '';

        _setField_(tr, 'size', String(file.size || 0)); // hidden bytes
        var sizeBox = tr.querySelector('[data-emp-file-size]');
        if (sizeBox) sizeBox.textContent = _empFmtBytes_(file.size || 0);

        // 자료구분 기본값 유지
        var sel = tr.querySelector('select[data-field="file_category"]');

        // ✅ placeholder(데이터 없음) 제거 후 추가
        try{
          Array.from(table.tBodies[0].rows).forEach(function(r0){
            if (r0 && r0.classList && r0.classList.contains('emp-empty-row')) r0.remove();
          });
        }catch(e){}
        table.tBodies[0].appendChild(tr);
        // ✅ 동적 추가 행에도 커스텀 input/select(has-value 등) 재적용
        try{ if (window.initUiScope) window.initUiScope(tr); }catch(e){}        

      }catch(err){
        var msg = (err && err.message) ? err.message : String(err);
        if (typeof showAlertError === 'function') showAlertError(msg, '파일 추가 실패');
      }
    });

  if (btnDownload){
    btnDownload.addEventListener('click', function(){
      try{
        _ensureDriveUtil_();
        var rows = _ensureSelectedAtLeastOne_();
        if (!rows) return;

        // ✅ 다운로드
        // - 1개 선택: 즉시 다운로드(기존 방식)
        // - 여러개 선택: 선택 파일들을 zip으로 묶어 1개 파일로 다운로드
        var items = [];
        rows.forEach(function(tr){
          var fileId = _readField_(tr, 'file_id');
          if (!fileId) return;
          var cat = _readField_(tr, 'file_category');
          items.push({ tr: tr, file_id: fileId, file_category: cat });        });
        if (!items.length) throw new Error('아직 저장되지 않은 파일입니다. 저장 후 미리보기/다운로드가 가능합니다.');

        // ✅ 파일명 규칙: '사번_성명_파일구분_저장파일명'
        var empId = _employeeId_();
        var empName = _employeeName_();
        function _safeName_(s){
          s = String(s || '').trim();
          // Windows 금지문자 최소 치환
          return s.replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim();
        }
        _empShowLoading_(rootEl || document.body, 'employee-file-action');

        // ✅ 1개면 기존 다운로드 유지
        if (items.length === 1){
          var it0 = items[0];
          var prefix0 = [_safeName_(empId), _safeName_(empName), _safeName_(it0.file_category)].filter(Boolean).join('_');
          Promise.resolve()
            .then(function(){
              return window.DriveFileUtil.download({ file_id: it0.file_id, filenamePrefix: prefix0 });
            })

              var msg = (err && err.message) ? err.message : String(err);

              _empHideLoading_(rootEl || document.body, 'employee-file-action');
            });

        }

        // ✅ 여러개면 zip 다운로드
        var zipName = [_safeName_(empId), _safeName_(empName), '증빙자료'].filter(Boolean).join('_');
        var zipItems = items.map(function(it){
          var prefix = [_safeName_(empId), _safeName_(empName), _safeName_(it.file_category)].filter(Boolean).join('_');
          return { file_id: it.file_id, filenamePrefix: prefix };
        });

        Promise.resolve()
          .then(function(){
            return window.DriveFileUtil.downloadZip({ zip_name: zipName, items: zipItems });
          })
          .catch(function(err){
            var msg = (err && err.message) ? err.message : String(err);
            if (typeof showAlertError === 'function') showAlertError(msg, '다운로드 실패');
          })
          .finally(function(){
            _empHideLoading_(rootEl || document.body, 'employee-file-action');
          });
      }catch(err){
        var msg = (err && err.message) ? err.message : String(err);
        if (typeof showAlertError === 'function') showAlertError(msg, '다운로드 실패');
      }
    });
  }
