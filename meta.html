    // (선택) 초기 상태 동기화 함수(페이지 로드시 한번 호출용)
    window.leaveSyncApplyBtn = function(scope){
      var host = scope || document;
      var leaveRoot =
        (host.matches && host.matches('#leave-root')) ? host :
        (host.querySelector ? host.querySelector('#leave-root') : document.getElementById('leave-root'));
      if(!leaveRoot) return;

      var btn = leaveRoot.querySelector('[data-leave-apply-btn]');
      if(!btn) return;

      var sec = btn.closest('.sec');
      var list = sec && sec.querySelector('.wrap-list');
      if(!list) return;

      btn.disabled = !list.querySelector('.wrap-list-item.is-active');
    };

  })();


/* 인풋 - 숫자 타입
 * Unit number input (input-unit)
 * - 편집 가능: input 중 콤마, blur 단위 붙임, focus 단위 제거
 * - readonly/disabled: 항상 "표시용" (단위 제거/입력처리 안 함, 포맷만 유지)
 * ========================= */
  function _useGroupingFromDataset(el){
    var g = (el && el.dataset) ? el.dataset.group : undefined;
    if (g == null || g === '') return true;           // 기본: ON
    g = String(g).toLowerCase();
    return !(g === '0' || g === 'false' || g === 'off' || g === 'no');
  }

  function _addComma(digits){
    return digits.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function formatUnitText(value, unit, useGrouping){
    var digits = String(value ?? '').replace(/[^\d]/g, '');
    if(!digits) return '';
    digits = digits.replace(/^0+(?=\d)/, '');

    var formatted = useGrouping ? _addComma(digits) : digits;
    return formatted + (unit || '');
  }

  function _unitStripToDigits(v, unit){
    v = String(v || '').trim();
    if(unit && v.endsWith(unit)) v = v.slice(0, -unit.length);
    return v.replace(/[^\d]/g, '');
  }

  function _caretPosFromDigitCount(str, digitCount){
    if(digitCount <= 0) return 0;
    var count = 0;
    for(var i=0; i<str.length; i++){
      if(/\d/.test(str[i])) count++;
      if(count >= digitCount) return i+1;
    }
    return str.length;
  }

  function _isLocked(el){
    return !!(el.disabled || el.readOnly);
  }

  // 현재 el.value를 "표시용"으로 강제(콤마+단위)
  function applyUnitDisplay(el){
    if(!el) return;
    var unit = el.dataset.unit || '';
    var useGrouping = _useGroupingFromDataset(el);

    var digits = _unitStripToDigits(el.value, unit);
    el.value = digits ? formatUnitText(digits, unit, useGrouping) : '';
  }

  function applyUnitEditView(el){
    if(!el) return;
    var unit = el.dataset.unit || '';
    var useGrouping = _useGroupingFromDataset(el);

    var digits = _unitStripToDigits(el.value, unit);
    if(!digits){ el.value = ''; return; }

    digits = digits.replace(/^0+(?=\d)/, '');
    el.value = useGrouping ? _addComma(digits) : digits;
  }

  function _bindUnitInput(el){
    if (!el) return;

    // ✅ 이미 바인딩된 input이라도, 데이터 로드 후 programmatic value 세팅이 일어나면
    //    단위/표시형(콤마 등) 렌더링이 다시 필요함.
    //    initUnitInputs() / initUiScope() 재호출 시 표시형을 즉시 갱신하도록 처리.
    if (el.__unitBound){
      applyUnitDisplay(el);
      return;
    }

    el.__unitBound = true;

    var unit = el.dataset.unit || '';

    function onInput(){
      if(_isLocked(el)) return;

      var raw = el.value || '';
      var sel = el.selectionStart || 0;
      var digitsBefore = (raw.slice(0, sel).match(/\d/g) || []).length;

      var digits = _unitStripToDigits(raw, unit);
      if(!digits){
        el.value = '';
        return;
      }

      digits = digits.replace(/^0+(?=\d)/, '');
      var useGrouping = _useGroupingFromDataset(el);
      var formatted = useGrouping ? _addComma(digits) : digits;
      el.value = formatted;

      var newPos = _caretPosFromDigitCount(formatted, digitsBefore);
      try { el.setSelectionRange(newPos, newPos); } catch(e) {}
    }

    function onBlur(){
      // locked여도 blur 때 표시 포맷 유지해주면 "출력용 input" 안정적
      applyUnitDisplay(el);

      // 라벨(has-value) 동기화가 필요하면
      if (typeof refreshFloatingInputs === 'function') {
        refreshFloatingInputs(el.closest('.inputgroup1, .inputgroup2') || el);
      }
    }

    function onFocus(){
      if(_isLocked(el)) {
        // readonly/disabled는 출력 유지(단위 제거 X)
        return;
      }
      // 편집 가능하면 단위 제거 + 콤마만
      applyUnitEditView(el);
      var len = el.value.length;
      try { el.setSelectionRange(len, len); } catch(e) {}
    }

    el.addEventListener('input', onInput);
    el.addEventListener('blur', onBlur);
    el.addEventListener('focus', onFocus);

    // 초기값은 항상 표시용 포맷으로 정리
    applyUnitDisplay(el);
  }

  // scope 아래 input-unit 전부 바인딩 + 표시 포맷 정리
  function initUnitInputs(root){
    (root || document).querySelectorAll('input.input-unit').forEach(function(el){
      // NOTE:
      // - 데이터 로딩 후(el.value를 JS로 세팅) initUnitInputs를 다시 호출하는 패턴이 많다.
      // - 기존 구현은 이미 바인딩된(__unitBound) input에 대해 _bindUnitInput()이 return 하며
      //   applyUnitDisplay()가 다시 실행되지 않아, \"클릭/포커스\" 후에야 표시가 맞는 문제가 생김.
      // - 따라서: 미바인딩이면 바인딩, 이미 바인딩이면 표시만 재적용한다.
      if (!el) return;
      if (!el.__unitBound) _bindUnitInput(el);
      applyUnitDisplay(el);
    });
  }
  window.initUnitInputs = initUnitInputs;
  window.formatUnitText = formatUnitText;
  window.applyUnitDisplay = applyUnitDisplay;

  // SPA/모달처럼 나중에 생긴 input-unit도 자동 바인딩
  document.addEventListener('focusin', function(e){
    if(e.target && e.target.matches('input.input-unit')){
      _bindUnitInput(e.target);
    }
  });

/* 단순 텍스트 출력 숫자 서식 */
  function initUnitTextTbl(root){
    (root || document).querySelectorAll('.text-tbl.text-unit').forEach(function(el){

      var unit = el.dataset.unit || '';
      var useGrouping = _useGroupingFromDataset(el);

      var raw = (el.textContent || '').trim();
      var digits = raw.replace(/[^\d]/g, '');
      el.textContent = digits ? formatUnitText(digits, unit, useGrouping) : '';
    });
  }
  window.initUnitTextTbl = initUnitTextTbl;

/* sec 펼치기/접기 
  * sec 전체 숨김(on/off) 토글
  * - data-sec-toggle="#selector"  : is-hidden 토글
  * - data-sec-hide="self|#sel"    : 숨김(강제)
  * - data-sec-show="self|#sel"    : 표시(강제)
  * ========================= */
  (function(){
    if (window.__secHiddenToggleBound) return;
    window.__secHiddenToggleBound = true;

    function resolveTarget(btn, raw){
      var v = (raw || '').trim();
      if (!v || v === 'self') return btn.closest('.sec');

      // SPA라서 page-container 우선에서 찾고, 없으면 document에서 찾기
      var scope = btn.closest('#page-container') || document;
      return scope.querySelector(v) || document.querySelector(v);
    }

    function setHidden(sec, hidden){
      if(!sec) return;
      sec.classList.toggle('is-hidden', !!hidden);
    }

    // 전역으로도 필요하면 쓰라고 export
    window.secSetHidden = setHidden;
    window.secToggleHidden = function(sec){
      if(!sec) return;
      setHidden(sec, !sec.classList.contains('is-hidden'));
    };

    document.addEventListener('click', function(e){
      var btn = e.target.closest('[data-sec-toggle],[data-sec-hide],[data-sec-show]');
      if(!btn) return;

      if (btn.hasAttribute('data-sec-toggle')){
        var sec1 = resolveTarget(btn, btn.getAttribute('data-sec-toggle'));
        if(!sec1) return;
        setHidden(sec1, !sec1.classList.contains('is-hidden'));
        return;
      }

      if (btn.hasAttribute('data-sec-hide')){
        var sec2 = resolveTarget(btn, btn.getAttribute('data-sec-hide'));
        setHidden(sec2, true);
        return;
      }

      if (btn.hasAttribute('data-sec-show')){
        var sec3 = resolveTarget(btn, btn.getAttribute('data-sec-show'));
        setHidden(sec3, false);
        return;
      }
    });
  })();

/* =========================================================
 * wrap-filter 공용 스크립트 (V5)
 * - data-nav="2" : 대분류(data-major) + 소분류(data-sub) 2단 네비 지원
 * - 기본(1단)도 호환: data-major 없이 data-sub만 있어도 동작
 * - 검색창: 활성 패널 내부 input[data-wf-q]만 사용
 * - 변경 시: filterwrap:change 이벤트 발생
 *   detail: { major, sub, query, selected, selectedByPanel, inputs }
 * - 필터 적용 개수 뱃지(wf-ind) 자동 갱신(대분류/소분류)
 *
 * + 추가:
 *   - 전체해제:   [data-wf-reset="all"]
 *   - 선택해제:   [data-wf-reset="active"]  (현재 활성 패널만)
 *   - 둘 다 wrap 밖(헤더 등)에서 data-wf-target로 타겟 지정 가능
 * ========================================================= */
(function(){
  if (window.__wrapFilterBoundV5) return;
  window.__wrapFilterBoundV5 = true;

  function qsa(root, sel){ return Array.from((root||document).querySelectorAll(sel)); }
  function qs(root, sel){ return (root||document).querySelector(sel); }
  function norm(s){ return String(s||'').trim().toLowerCase(); }

  function isNav2(wrap){
    return String(wrap.getAttribute('data-nav')||'') === '2' || !!qs(wrap, '.wf-major [data-major]');
  }

  function getMajorList(wrap){ return qs(wrap, '.wf-major'); }
  function getSubList(wrap){ return qs(wrap, '.wf-sub'); }
  function getPanels(wrap){ return qsa(wrap, '.wf-panel[data-sub]'); }
  function getActivePanel(wrap){ return qs(wrap, '.wf-panel.is-active[data-sub]'); }

  function ensureInd(el){
    if(!el) return null;
    var ind = qs(el, '.wf-ind');
    if(!ind){
      ind = document.createElement('span');
      ind.className = 'wf-ind';
      ind.setAttribute('aria-hidden','true');
      var main = qs(el, '.wrap-list-main') || el;
      main.appendChild(ind);
    }
    return ind;
  }

  function setInd(el, n){
    var ind = ensureInd(el);
    if(!ind) return;
    var num = Number(n||0);
    if(num > 0){
      ind.textContent = String(num);
      ind.classList.add('is-on');
    }else{
      ind.textContent = '';
      ind.classList.remove('is-on');
    }
  }

  function getInitialMajor(wrap){
    var majorList = getMajorList(wrap);
    if(!majorList) return 'default';
    var a = qs(majorList, '.wrap-list-item.is-active[data-major], [data-major].is-active');
    if(a) return a.getAttribute('data-major') || 'default';
    var f = qs(majorList, '.wrap-list-item[data-major], [data-major]');
    return (f && f.getAttribute('data-major')) || 'default';
  }

  function getInitialSub(wrap, major){
    if(isNav2(wrap)){
      var subList = getSubList(wrap);
      if(subList){
        var act = qs(subList, '.wrap-list-item.is-active[data-sub][data-major="'+major+'"]');
        if(act) return act.getAttribute('data-sub') || '';
        var first = qs(subList, '.wrap-list-item[data-sub][data-major="'+major+'"]');
        if(first) return first.getAttribute('data-sub') || '';
      }
      var ap = qs(wrap, '.wf-panel.is-active[data-sub][data-major="'+major+'"]');
      if(ap) return ap.getAttribute('data-sub') || '';
      var p = qs(wrap, '.wf-panel[data-sub][data-major="'+major+'"]');
      if(p) return p.getAttribute('data-sub') || '';
      return 'all';
    }

    var left = qs(wrap, '.wf-left');
    if(left){
      var activeLeft = qs(left, '.wrap-list-item.is-active[data-sub], [data-sub].is-active');
      if(activeLeft) return activeLeft.getAttribute('data-sub') || '';
      var firstLeft = qs(left, '.wrap-list-item[data-sub], [data-sub]');
      if(firstLeft) return firstLeft.getAttribute('data-sub') || '';
    }
    var activePanel = getActivePanel(wrap);
    if(activePanel) return activePanel.getAttribute('data-sub') || '';
    var panels = getPanels(wrap);
    if(panels[0]) return panels[0].getAttribute('data-sub') || '';
    return 'all';
  }

  function showSubsForMajor(wrap, major){
    var subList = getSubList(wrap);
    if(!subList) return;

    qsa(subList, '.wrap-list-item[data-sub][data-major], [data-sub][data-major]').forEach(function(el){
      var m = el.getAttribute('data-major');
      el.hidden = (String(m) !== String(major));
    });

    var active = qs(subList, '.wrap-list-item.is-active[data-sub]:not([hidden])');
    if(!active){
      var first = qs(subList, '.wrap-list-item[data-sub]:not([hidden])');
      if(first) first.classList.add('is-active');
    }
  }

  function setActiveMajorUI(wrap, major){
    var majorList = getMajorList(wrap);
    if(!majorList) return;
    qsa(majorList, '.wrap-list-item[data-major], [data-major]').forEach(function(el){
      el.classList.toggle('is-active', String(el.getAttribute('data-major')) === String(major));
    });
  }

  function setActiveSubUI(wrap, major, sub){
    if(isNav2(wrap)){
      var subList = getSubList(wrap);
      if(!subList) return;
      qsa(subList, '.wrap-list-item[data-sub][data-major], [data-sub][data-major]').forEach(function(el){
        var m = el.getAttribute('data-major');
        var s = el.getAttribute('data-sub');
        if(String(m) !== String(major)) { el.classList.remove('is-active'); return; }
        el.classList.toggle('is-active', String(s) === String(sub));
      });
      return;
    }

    var left = qs(wrap, '.wf-left');
    if(!left) return;
    qsa(left, '.wrap-list-item[data-sub], [data-sub]').forEach(function(el){
      el.classList.toggle('is-active', String(el.getAttribute('data-sub')) === String(sub));
    });
  }

  function switchPanel(wrap, major, sub){
    var panels = getPanels(wrap);
    if(!panels.length) return;

    panels.forEach(function(p){
      var pSub = p.getAttribute('data-sub');
      var pMajor = p.getAttribute('data-major');

      var on = false;
      if(isNav2(wrap)){
        on = (String(pMajor) === String(major)) && (String(pSub) === String(sub));
      }else{
        on = (String(pSub) === String(sub));
      }

      p.classList.toggle('is-active', on);
      p.hidden = !on;
    });
  }

  function applyPanelChipSearch(wrap){
    var panel = getActivePanel(wrap) || wrap;
    var input = qs(panel, 'input[data-wf-q]');
    if(!input) return;

    var q = norm(input.value);
    qsa(panel, '.wf-chip').forEach(function(chip){
      if(!q){ chip.style.display = ''; return; }
      var hay = norm(chip.textContent) + ' ' + norm(chip.dataset.key) + ' ' + norm(chip.dataset.value);
      chip.style.display = (hay.indexOf(q) >= 0) ? '' : 'none';
    });
  }

  function collectInputs(scope){
    var out = {};
    qsa(scope, '[data-wf-field]').forEach(function(el){
      var key = el.getAttribute('data-wf-field');
      if(!key) return;

      var tag = (el.tagName||'').toLowerCase();
      if(tag === 'input'){
        var t = (el.type||'').toLowerCase();
        if(t === 'checkbox') out[key] = !!el.checked;
        else out[key] = el.value;
        return;
      }
      if(tag === 'select' || tag === 'textarea'){
        out[key] = el.value; return;
      }
      out[key] = (el.textContent||'').trim();
    });
    return out;
  }

  function pushMap(map, k, v){
    if(!map[k]) map[k] = [];
    if(map[k].indexOf(v) < 0) map[k].push(v);
  }

  function collectSelectedByPanel(wrap){
    var byPanel = {};
    getPanels(wrap).forEach(function(panel){
      var major = panel.getAttribute('data-major') || 'default';
      var sub = panel.getAttribute('data-sub') || 'all';
      var key = isNav2(wrap) ? (major + '|' + sub) : sub;

      var picked = {};
      qsa(panel, '.wf-chip.is-active').forEach(function(chip){
        var k = chip.dataset.key || 'chip';
        var v = chip.dataset.value || chip.textContent.trim();
        if(!v) return;
        pushMap(picked, k, v);
      });

      byPanel[key] = { major: major, sub: sub, selected: picked, inputs: collectInputs(panel) };
    });
    return byPanel;
  }

  function countActiveInPanelInfo(info){
    var n = 0;
    Object.keys(info.selected||{}).forEach(function(k){
      n += (info.selected[k]||[]).length;
    });
    Object.keys(info.inputs||{}).forEach(function(k){
      var v = info.inputs[k];
      if(v === true) n += 1;
      else if(v === false) {}
      else if(String(v||'').trim() !== '') n += 1;
    });
    return n;
  }

  function updateIndicators(wrap){
    var byPanel = collectSelectedByPanel(wrap);

    if(isNav2(wrap)){
      var subList = getSubList(wrap);
      if(subList){
        qsa(subList, '.wrap-list-item[data-major][data-sub]').forEach(function(btn){
          var m = btn.getAttribute('data-major') || 'default';
          var s = btn.getAttribute('data-sub') || 'all';
          var key = m + '|' + s;
          var info = byPanel[key] || { selected:{}, inputs:{} };
          setInd(btn, countActiveInPanelInfo(info));
        });
      }

      var majorList = getMajorList(wrap);
      if(majorList){
        qsa(majorList, '.wrap-list-item[data-major]').forEach(function(btn){
          var m = btn.getAttribute('data-major') || 'default';
          var sum = 0;
          Object.keys(byPanel).forEach(function(k){
            var info = byPanel[k];
            if(String(info.major) === String(m)) sum += countActiveInPanelInfo(info);
          });
          setInd(btn, sum);
        });
      }
    }else{
      var left = qs(wrap, '.wf-left');
      if(left){
        qsa(left, '.wrap-list-item[data-sub], [data-sub]').forEach(function(btn){
          var s = btn.getAttribute('data-sub') || 'all';
          var info = byPanel[s] || { selected:{}, inputs:{} };
          setInd(btn, countActiveInPanelInfo(info));
        });
      }
    }
  }

  function collectState(wrap){
    var st = wrap.__wfState || {};
    var major = st.major || (isNav2(wrap) ? getInitialMajor(wrap) : 'default');
    var sub = st.sub || getInitialSub(wrap, major);

    var panel = getActivePanel(wrap) || wrap;
    var input = qs(panel, 'input[data-wf-q]');
    var query = input ? input.value : '';

    var selected = {};
    qsa(panel, '.wf-chip.is-active').forEach(function(chip){
      var k = chip.dataset.key || 'chip';
      var v = chip.dataset.value || chip.textContent.trim();
      if(!v) return;
      pushMap(selected, k, v);
    });

    return {
      major: major,
      sub: sub,
      query: query,
      selected: selected,
      selectedByPanel: collectSelectedByPanel(wrap),
      inputs: collectInputs(panel)
    };
  }

  function emitChange(wrap){
    updateIndicators(wrap);

    var s = collectState(wrap);
    try{
      wrap.dispatchEvent(new CustomEvent('filterwrap:change', { detail: s }));
    }catch(e){}

    var opt = wrap.__wfOpt;
    if(opt && typeof opt.onChange === 'function'){
      try{ opt.onChange(s, wrap); }catch(e){}
    }
  }

  function setMajor(wrap, major){
    major = major || getInitialMajor(wrap) || 'default';
    wrap.__wfState = wrap.__wfState || {};
    wrap.__wfState.major = major;

    setActiveMajorUI(wrap, major);
    showSubsForMajor(wrap, major);

    wrap.__wfState.lastSubByMajor = wrap.__wfState.lastSubByMajor || {};
    var remembered = wrap.__wfState.lastSubByMajor[major];

    var sub = remembered || getInitialSub(wrap, major) || 'all';
    setSub(wrap, sub, /*skipRemember=*/true);
  }

  function setSub(wrap, sub, skipRemember){
    wrap.__wfState = wrap.__wfState || {};
    var major = wrap.__wfState.major || (isNav2(wrap) ? getInitialMajor(wrap) : 'default');
    sub = sub || getInitialSub(wrap, major) || 'all';

    wrap.__wfState.sub = sub;
    if(isNav2(wrap) && !skipRemember){
      wrap.__wfState.lastSubByMajor = wrap.__wfState.lastSubByMajor || {};
      wrap.__wfState.lastSubByMajor[major] = sub;
    }

    setActiveSubUI(wrap, major, sub);
    switchPanel(wrap, major, sub);
    applyPanelChipSearch(wrap);

    if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(wrap);
    if (typeof initIconTooltips === 'function') initIconTooltips(wrap);
    if (window.initUnitInputs) window.initUnitInputs(wrap);

    emitChange(wrap);
  }

  /* =========================
   * Reset helpers
   * ========================= */
  function clearWfFields(scope){
    qsa(scope, '[data-wf-field]').forEach(function(el){
      var tag = (el.tagName||'').toLowerCase();
      if(tag === 'input'){
        var t = (el.type||'').toLowerCase();
        if(t === 'checkbox' || t === 'radio') el.checked = false;
        else el.value = '';
        return;
      }
      if(tag === 'select' || tag === 'textarea'){
        el.value = '';
        return;
      }
      // 텍스트 노드까지 비우는건 위험해서 제거(필요하면 사용자쪽에서 별도 처리)
    });
  }

  function clearScope(scope){
    qsa(scope, '.wf-chip.is-active').forEach(function(chip){ chip.classList.remove('is-active'); });
    qsa(scope, 'input[data-wf-q]').forEach(function(inp){ inp.value = ''; });
    qsa(scope, '.wf-chip').forEach(function(chip){ chip.style.display = ''; });
    clearWfFields(scope);
  }

  function resetAllWrap(wrap){
    if(!wrap) return;
    clearScope(wrap);

    if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(wrap);
    if (typeof initIconTooltips === 'function') initIconTooltips(wrap);
    if (window.initUnitInputs) window.initUnitInputs(wrap);

    emitChange(wrap);
  }

  function resetActivePanel(wrap){
    if(!wrap) return;

    var panel = getActivePanel(wrap);

    // 안전망: state로 패널 찾기
    if(!panel){
      var st = wrap.__wfState || {};
      var major = st.major || (isNav2(wrap) ? getInitialMajor(wrap) : 'default');
      var sub   = st.sub   || getInitialSub(wrap, major);

      panel = isNav2(wrap)
        ? qs(wrap, '.wf-panel[data-major="'+major+'"][data-sub="'+sub+'"]')
        : qs(wrap, '.wf-panel[data-sub="'+sub+'"]');
    }

    if(!panel) return;

    clearScope(panel);

    if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(wrap);
    if (typeof initIconTooltips === 'function') initIconTooltips(wrap);
    if (window.initUnitInputs) window.initUnitInputs(wrap);

    emitChange(wrap);
  }

  function resolveWrapFromResetBtn(btn){
    if(!btn) return null;

    var sel = (btn.getAttribute('data-wf-target') || '').trim();
    if(sel){
      var t = document.querySelector(sel);
      if(t){
        if(t.classList && t.classList.contains('wrap-filter')) return t;
        var w = qs(t, '.wrap-filter');
        if(w) return w;
      }
    }

    var w1 = btn.closest && btn.closest('.wrap-filter');
    if(w1) return w1;

    var sec = btn.closest && btn.closest('.sec');
    if(sec){
      var w2 = qs(sec, '.wrap-filter');
      if(w2) return w2;
    }

    return null;
  }

  function reset(wrap){
    resetAllWrap(wrap);
  }

  function bindOne(wrap, opt){
    if(!wrap || wrap.__wfBoundV5) return;
    wrap.__wfBoundV5 = true;
    wrap.__wfOpt = opt || {};
    wrap.__wfState = wrap.__wfState || {};

    // ✅ 초기: 무조건 하나 선택되게
    if(isNav2(wrap)){
      setMajor(wrap, getInitialMajor(wrap));
    }else{
      wrap.__wfState.major = 'default';
      setSub(wrap, getInitialSub(wrap, 'default'));
    }

    // 대분류 클릭
    var majorList = getMajorList(wrap);
    if(majorList && !majorList.__wfMajorBoundV5){
      majorList.__wfMajorBoundV5 = true;
      majorList.addEventListener('click', function(e){
        var el = e.target.closest('.wrap-list-item[data-major], [data-major]');
        if(!el) return;
        e.preventDefault();
        e.stopPropagation();
        setMajor(wrap, el.getAttribute('data-major'));
      });
    }

    // 소분류 클릭
    var subList = getSubList(wrap) || qs(wrap, '.wf-left');
    if(subList && !subList.__wfSubBoundV5){
      subList.__wfSubBoundV5 = true;
      subList.addEventListener('click', function(e){
        var el = e.target.closest('.wrap-list-item[data-sub], [data-sub]');
        if(!el) return;
        if(isNav2(wrap) && el.hidden) return;

        e.preventDefault();
        e.stopPropagation();
        setSub(wrap, el.getAttribute('data-sub'));
      });
    }

    // 패널 내부 검색 / data-wf-field 반영
    wrap.addEventListener('input', function(e){
      if(e.target && e.target.matches && e.target.matches('input[data-wf-q]')){
        applyPanelChipSearch(wrap);
        emitChange(wrap);
        return;
      }
      if(e.target && (e.target.matches('[data-wf-field]') || (e.target.closest && e.target.closest('[data-wf-field]')))){
        emitChange(wrap);
        return;
      }
    });


    // ✅ datepicker 등 'change'로만 바뀌는 입력 지원
    wrap.addEventListener('change', function(e){
      if(e.target && (e.target.matches('[data-wf-field]') || (e.target.closest && e.target.closest('[data-wf-field]')))){
        emitChange(wrap);
      }
    }, true);

    // ✅ blur에서 값이 확정되는 경우(마스크/달력)까지 커버
    wrap.addEventListener('blur', function(e){
      if(e.target && (e.target.matches('[data-wf-field]') || (e.target.closest && e.target.closest('[data-wf-field]')))){
        emitChange(wrap);
      }
    }, true);

    // 칩 클릭(활성 패널 내만)
    wrap.addEventListener('click', function(e){
      var chip = e.target.closest('.wf-chip');
      if(!chip) return;

      var panel = getActivePanel(wrap);
      if(panel && !panel.contains(chip)) return;

      chip.classList.toggle('is-active');
      emitChange(wrap);
    });
  }

  function initFilterWraps(root, opt){
    qsa(root || document, '.wrap-filter').forEach(function(wrap){
      bindOne(wrap, opt);
    });
  }

  window.initFilterWraps = initFilterWraps;

  // =========================================================
  // 전역: 전체해제
  // =========================================================
  if(!window.__wrapFilterResetAllBoundV5){
    window.__wrapFilterResetAllBoundV5 = true;
    document.addEventListener('click', function(e){
      var btn = e.target.closest && e.target.closest('[data-wf-reset="all"]');
      if(!btn) return;

      e.preventDefault();
      e.stopPropagation();

      var wrap = resolveWrapFromResetBtn(btn);
      if(!wrap) return;

      resetAllWrap(wrap);
    });
  }

  // =========================================================
  // 전역: 선택해제(현재 활성 패널만)
  // =========================================================
  if(!window.__wrapFilterResetActiveBoundV5){
    window.__wrapFilterResetActiveBoundV5 = true;
    document.addEventListener('click', function(e){
      var btn = e.target.closest && e.target.closest('[data-wf-reset="active"]');
      if(!btn) return;

      e.preventDefault();
      e.stopPropagation();

      var wrap = resolveWrapFromResetBtn(btn);
      if(!wrap) return;

      resetActivePanel(wrap);
    });
  }

  window.FilterWrap = {
    init: initFilterWraps,
    getState: function(wrap){ return collectState(wrap); },
    reset: function(wrap){ reset(wrap); },
    setMajor: function(wrap, major){ setMajor(wrap, major); },
    setSub: function(wrap, sub){ setSub(wrap, sub); },
    setGroup: function(wrap, sub){ setSub(wrap, sub); }
  };
})();

// =========================================================
// ✅ 공용 로딩 오버레이 (UI_Loading)
// - show/hide/wrap
// - refCount(중복 로딩) 안전
// - scopeEl(페이지 root / 모달 body 등) 어디든 사용 가능
// =========================================================
(function(){
  function _key_(opts){
    opts = opts || {};
    return String(opts.key || 'default');
  }

  function _getState_(el){
    if (!el) return null;
    if (!el.__uiLoadingState) el.__uiLoadingState = { map: {} };
    return el.__uiLoadingState;
  }

  function _getOverlayHost_(scopeEl, opts){
    opts = opts || {};
    if (opts.global === false && scopeEl) return scopeEl;
    return document.body || document.documentElement || scopeEl;
  }

  function _makeOverlay_(hostEl, opts){
    opts = opts || {};
    var ov = document.createElement('div');
    ov.className = 'ui-loading-ov' + (opts.boot ? ' is-boot' : '');
    ov.setAttribute('aria-busy', 'true');
    ov.setAttribute('aria-live', 'polite');
    ov.setAttribute('role', 'status');

    // ✅ 스피너는 1개만: CSS fallback 스피너만 사용
    var spinnerHtml = '<i class="fa-solid fa-spinner ui-loading-spinner-icon" aria-hidden="true"></i>';

    var text = (opts.text != null) ? String(opts.text) : '';
    ov.innerHTML =
      '<div class="ui-loading-box">' +
        spinnerHtml +
        (text ? ('<div class="ui-loading-text">' + _escapeHtml_(text) + '</div>') : '') +
      '</div>';

    // bootstrap spinner가 보이면 fallback은 숨겨도 되는데,
    // CSS로 제어하기 어렵다면 둘 다 떠도 문제없게 최소 크기로 둠.
    // (원하면 여기서 런타임으로 하나 숨길 수도 있음)

    hostEl.appendChild(ov);
    return ov;
  }

  function _escapeHtml_(s){
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function show(scopeEl, opts){
    var hostEl = _getOverlayHost_(scopeEl, opts);
    if (!hostEl) return;
    opts = opts || {};
    var st = _getState_(hostEl);
    var k = _key_(opts);
    if (!st.map[k]){
      st.map[k] = { count: 0, ov: null };
    }
    var slot = st.map[k];
    slot.count++;
    if (!slot.ov){
      slot.ov = _makeOverlay_(hostEl, opts);
    }else{
      // text 갱신(옵션)
      if (opts.text != null){
        var t = slot.ov.querySelector('.ui-loading-text');
        if (t) t.textContent = String(opts.text);
      }
    }
    slot.ov.classList.add('is-on');
  }

  function hide(scopeEl, opts){
    var hostEl = _getOverlayHost_(scopeEl, opts);
    if (!hostEl) return;
    opts = opts || {};
    var st = _getState_(hostEl);
    var k = _key_(opts);
    var slot = st.map[k];
    if (!slot) return;
    slot.count = Math.max(0, (slot.count || 0) - 1);
    if (slot.count === 0){
      try{
        if (slot.ov && slot.ov.parentNode) slot.ov.parentNode.removeChild(slot.ov);
      }catch(e){}
      st.map[k] = null;
      delete st.map[k];
    }else{
      // 남은 작업이 있으면 유지
    }
  }

  function wrap(scopeEl, promiseFactory, opts){
    show(scopeEl, opts);
    var p;
    try{
      p = promiseFactory();
    }catch(e){
      hide(scopeEl, opts);
      return Promise.reject(e);
    }
    return Promise.resolve(p)
      .finally(function(){ hide(scopeEl, opts); });
  }

  window.UI_Loading = { show: show, hide: hide, wrap: wrap };
})();

/* 최초 페이지 로드 공통*/
function initUiScope(scope){
  var root = scope || document;

  // 1) DOM 구조 변경(래핑) 먼저
  if (typeof initAnimatedCheckboxes === 'function') initAnimatedCheckboxes(root);

  // 2) 탭 상태/액션 렌더링
  if (typeof initSecTabs === 'function') initSecTabs(root);

  // 3) input/date/time + has-value
  if (typeof refreshFloatingInputs === 'function') refreshFloatingInputs(root);
  if (window.initUnitInputs) window.initUnitInputs(root);       // ✅ input-unit 바인딩/표시
  if (window.initUnitTextTbl) window.initUnitTextTbl(root);     // ✅ text-unit(표시형) 있으면 같이

  // 4) 테이블 체크박스 로직(헤더-행 연동)
  if (window.initTableRowCheckboxes) window.initTableRowCheckboxes(root);

  // 5) 아이콘 툴팁 데이터 세팅
  if (typeof initIconTooltips === 'function') initIconTooltips(root);

  // 6) 보기버튼 등(있다면)
  if (typeof initViewIconButtons === 'function') initViewIconButtons(root);
  if (root.querySelector && root.querySelector('#leave-root')) {
    if (window.leaveSyncApplyBtn) window.leaveSyncApplyBtn(root);
    if (typeof leaveInitApprovalUI === 'function') leaveInitApprovalUI();
  }
  // 7) 숫자콤마
  if (window.initUnitInputs) window.initUnitInputs(root);
  if (window.initUnitTextTbl) window.initUnitTextTbl(root);
  // 8)) 필터
  if (window.initFilterWraps) window.initFilterWraps(root);
}

window.initUiScope = initUiScope;



/* 최초 페이지 로드 때 한 번 */
document.addEventListener('DOMContentLoaded', function () {
  initUiScope(document);
});
  
</script>
